:root{
  --font:'NeoDGM','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  /* 글자 크기 단계: 보조 / 설명 / 본문 / 강조 / 제목 / 핵심 수치 */
  --fs-xs:12.5px;--fs-sm:14px;--fs-md:16px;--fs-lg:19px;--fs-xl:24px;--fs-xxl:36px;
  --bg:#0b1820;--panel:#0f222b;--panel2:#15313c;--line:#2a5462;--ink:#f5eedd;--muted:#a9c0c5;--gold:#f0c060;
  --can:#58d8ff;--sel:#ffd166;
  --R:#c0363e;--G:#2e8a57;--B:#2d63b8;--W:#d8ceb4;--K:#2c2833;
  --paper1:#f7eed8;--paper2:#ecdcb6;--cardink:#261f15;
  --bw:150px;--hw:130px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--font);font-size:var(--fs-md);
  letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;line-height:1.5;
  background:radial-gradient(ellipse at 55% 42%,#18434e 0%,#0c1c24 60%,#070f14 100%)}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#1b3e4a;color:var(--ink);
  padding:9px 14px;border-radius:9px;font-size:15px;font-weight:600;line-height:1.25;display:inline-flex;align-items:center;gap:6px}
button:hover:not(:disabled){background:#245463}
button.primary{background:var(--gold);color:#2a1d05;border-color:#c1912f;font-weight:800}
button.primary:hover:not(:disabled){background:#ffd37c}
button.warn{background:#5a2a2a;border-color:#8a4444}
button.big{font-size:17px;padding:11px 18px}
button:disabled{opacity:.38;cursor:not-allowed}
kbd{font-family:var(--font);font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.35);border-bottom-width:2px;color:inherit;line-height:1.3;white-space:nowrap}
button.primary kbd{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.35)}
.dim{opacity:.65}
.muted{color:var(--muted)}

/* ===== 레이아웃 ===== */
.layout{display:grid;height:calc(100*var(--vh));
  grid-template-columns:minmax(0,1fr) clamp(340px,calc(27*var(--vw)),470px);
  grid-template-rows:56px auto minmax(0,1fr) auto}
.topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:14px;padding:0 14px;background:#07131a;border-bottom:1px solid var(--line);min-width:0}
.topbar .logo{font-weight:800;font-size:var(--fs-lg);color:var(--gold);white-space:nowrap}
.topbar .phase{padding:4px 12px;border-radius:14px;background:#1d3f4a;font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.topbar .phase.final{background:#6a2f73}
.topbar .turnno{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
.topbar .sp{flex:1}
.topbar button{padding:7px 12px;font-size:var(--fs-sm)}
.left{grid-column:1;grid-row:2;padding:10px;overflow:auto;border-right:1px solid var(--line);background:rgba(5,15,20,.4);min-height:0}
.center{grid-column:1;grid-row:3;display:flex;flex-direction:column;min-width:0;min-height:0}
.right{grid-column:2;grid-row:3;display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0;overflow-y:auto;background:rgba(5,15,20,.4)}
.bottom{grid-column:1/-1;grid-row:4;border-top:1px solid var(--line);background:#08151b;min-width:0}

/* ===== 지금 할 일 (최우선 정보) ===== */
.guide{margin:10px 12px 0;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:14px;
  background:linear-gradient(90deg,#173a46,#12303a);border:2px solid #2f6576;box-shadow:0 4px 16px rgba(0,0,0,.35);min-width:0}
.guide.act{border-color:var(--can)}
.guide.go{border-color:var(--sel);background:linear-gradient(90deg,#3a3016,#1d2c2a)}
.guide.done{border-color:#62c98a}
.guide.bad{border-color:#e07a7a}
.guide .gstep{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sc,#2f6576);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.guide .gmain{flex:1;min-width:0}
.guide .gt{font-size:var(--fs-lg);font-weight:800;line-height:1.3}
.guide .gd{font-size:var(--fs-sm);color:#d7e4e6;margin-top:2px}
.guide .gkeys{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:flex-end;font-size:13px;color:var(--muted);max-width:44%}
.guide .gkeys span{white-space:nowrap}
.boardwrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px}
.cross{display:grid;gap:calc(var(--bw)*.1);grid-template-columns:repeat(3,var(--bw));grid-template-rows:repeat(3,calc(var(--bw)*1.4016));
  grid-template-areas:". t ." "l m r" ". b ."}
.boardwrap.rowmode .cross{grid-template-columns:repeat(5,var(--bw));grid-template-rows:calc(var(--bw)*1.4016);grid-template-areas:"t r m b l"}
.slot{position:relative;display:flex;align-items:center;justify-content:center}
.slot.t{grid-area:t}.slot.r{grid-area:r}.slot.b{grid-area:b}.slot.l{grid-area:l}.slot.m{grid-area:m}
.slot.empty::before{content:"비어 있음";position:absolute;inset:0;border:2px dashed #3a6470;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#4f7c88;font-size:var(--fs-sm)}
.deckinfo{position:absolute;left:14px;bottom:8px;font-size:var(--fs-sm);color:var(--muted)}

/* ===== 색상 칩 (색 + 기호 + 글자) ===== */
.cc{display:inline-flex;align-items:center;gap:.15em;padding:.05em .4em .05em .3em;border-radius:.4em;color:#fff;font-weight:800;font-size:.82em;
  line-height:1.35;white-space:nowrap;border:1px solid rgba(255,255,255,.45);vertical-align:middle}
.cc i{font-style:normal;font-size:.95em}
.cc-R{background:var(--R)}.cc-G{background:var(--G)}.cc-B{background:var(--B)}.cc-W{background:#efe6cf;color:#5c4b22;border-color:#b8a57a}.cc-K{background:#1c1a20;border-color:#777}

/* ===== 카드 공통 (63.5 x 89 mm) ===== */
.card{--w:var(--bw);width:var(--w);height:calc(var(--w)*1.4016);font-size:calc(var(--w)/12);position:relative;flex:none;
  border-radius:.7em;background:var(--cc,#555);color:var(--cardink);box-shadow:0 .25em .7em rgba(0,0,0,.55);
  user-select:none;transition:transform .12s,box-shadow .12s,filter .12s,opacity .12s;container-type:inline-size}
.card .inner{position:absolute;inset:.38em;border-radius:.5em;overflow:hidden;display:flex;flex-direction:column;gap:.3em;padding:.4em .45em .3em;
  background:linear-gradient(170deg,var(--paper1),var(--paper2))}
.card.skill .inner{bottom:2.1em}
.card.haspb .inner{bottom:2.1em}
.card .head{display:flex;align-items:center;gap:.4em;flex:none;min-height:2.6em}
.card .valc{flex:none;width:2.55em;height:2.55em;border-radius:50%;background:#fffaf0;border:.16em solid var(--cc);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.card .valc b{font-size:1.55em;font-weight:900}
.card .valc.bo b{font-size:1.2em}.card .valc.bo small{font-size:.34em}
.card .valc small{font-size:.42em;font-weight:700;opacity:.75;margin-top:.1em}
.card .nm{flex:1;min-width:0}
.card .name{font-size:1.08em;font-weight:800;line-height:1.15;letter-spacing:-.03em}
.card .sub{font-size:.62em;font-weight:600;opacity:.72;margin-top:.1em;line-height:1.2}
.card .mid{display:flex;gap:.35em;flex:0 1 31%;min-height:0}
.card .rail{display:flex;flex-direction:column;gap:.2em;flex:none;align-items:flex-start}
.card .rail .cc{font-size:.7em}
.card .art{flex:1;border-radius:.4em;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--ac,#888) 50%,#fff) 0%,var(--ac,#888) 58%,color-mix(in srgb,var(--ac,#888) 55%,#000) 100%);
  box-shadow:inset 0 0 .6em rgba(0,0,0,.3)}
.card .art .ticon{height:86%;aspect-ratio:1;background:#fdf3e0 center/84% no-repeat;border-radius:.35em;box-shadow:0 .08em .25em rgba(0,0,0,.35);image-rendering:pixelated;display:block}

/* v1.2: 시작 화면 분리 */
.setup.title{display:flex;align-items:center;justify-content:center;padding:20px}
.setup.title .tbox{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.setup.title h1{font-size:clamp(34px,calc(6*var(--vh)),58px);line-height:1.25;margin:0}
.setup.title .tsub{color:var(--muted);font-size:var(--fs-lg);letter-spacing:.5px}
.setup.title .tstart{font-size:22px;padding:16px 46px;margin-top:10px}
.setup.title .b2{display:flex;gap:10px;flex-wrap:nowrap}
.setup .sh{margin:0;color:var(--gold);font-size:clamp(20px,calc(2.8*var(--vh)),26px)}
.setup .tback{margin-top:8px;font-size:var(--fs-sm);opacity:.85}
.setup .pickp .pport{flex:none;width:clamp(40px,calc(6*var(--vh)),56px);aspect-ratio:1;background:center/contain no-repeat;image-rendering:pixelated;display:block}
/* v1.3: 선택 화면 — 한 마리씩 보기 */
.setup.pick{grid-template-columns:1fr minmax(230px,calc(19*var(--vw)));gap:20px;padding:18px 22px 30px}
.setup.pick.enter{animation:pkEnter .55s cubic-bezier(.2,.8,.2,1)}
@keyframes pkEnter{from{transform:translateY(calc(70*var(--vh)));opacity:0}to{transform:none;opacity:1}}
.setup.pick .sl{align-items:center}
.setup .pstrip{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap;margin:4px 0 14px}
.setup .pchip{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:92px;padding:8px 10px;background:#10262e;border:2px solid #2a5462;border-bottom:5px solid var(--sc);border-radius:12px;opacity:.75}
.setup .pchip .pg{font-size:24px;line-height:1}
.setup .pchip .pcn{font-size:15px;font-weight:800}
.setup .pchip.on{opacity:1;border-color:var(--sel)}
.setup .pchip.cur{opacity:1;background:#173842;transform:translateY(-3px);box-shadow:0 0 0 2px #8fe0f5}
.setup .pchip .ord{position:absolute;top:-9px;left:-9px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1d05;font-size:14px;display:flex;align-items:center;justify-content:center}
.setup .pstage{display:flex;align-items:center;gap:14px;width:100%;max-width:900px;flex:1;min-height:0;overflow:hidden}
.setup .parr{flex:none;width:52px;height:90px;font-size:24px;border-radius:12px}
.setup .pickp.big{flex:1;width:auto;cursor:default;padding:18px 22px;gap:12px;align-self:center}
.setup .pickp.big:hover{transform:none}
.setup .pstk{flex:1;display:grid;align-self:center;min-width:0}
.setup .pstk>.pickp.big{grid-area:1/1;align-self:stretch}
.setup .pstk>.pickp.ghost{visibility:hidden}
.setup .psel .pst{display:inline-grid}
.setup .psel .pst>span{grid-area:1/1}
.setup .psel .pst>.h{visibility:hidden}
.setup .pickp.big .ph{gap:14px}
.setup .pickp.big .ph > div{flex:1}
.setup .pickp.big .pg{font-size:46px}
.setup .pickp.big .pport{width:72px}
.setup .pickp.big .pn{font-size:30px}
.setup .pickp.big .pr{font-size:15px}
.setup .pickp.big .pb{font-size:17px;line-height:1.6;padding:12px 14px}
.setup .pickp.big .pt{font-size:17px}
.setup .psel{flex:none;padding:10px 16px;font-size:16px;font-weight:800;white-space:nowrap}
.setup .pickp.slideL{animation:pkL .28s ease-out}
.setup .pickp.slideR{animation:pkR .28s ease-out}
@keyframes pkL{from{transform:translateX(90px);opacity:0}to{transform:none;opacity:1}}
@keyframes pkR{from{transform:translateX(-90px);opacity:0}to{transform:none;opacity:1}}
.setup .phint{color:var(--muted);font-size:var(--fs-sm);margin-top:10px}
.setup.pick .sr{gap:12px;padding:14px}
.setup .team .sh{font-size:20px}
.setup .team .tl{display:flex;flex-direction:column;gap:5px;margin:8px 0 6px;min-height:28px}
.setup .team .tm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;border-left:5px solid var(--sc);padding-left:8px}
.setup .team .tm b{color:var(--gold)}
.setup .team .ti{font-size:13px}
.setup.pick .sr .opts{gap:9px;padding:10px 12px;font-size:var(--fs-sm)}
.setup.pick .sr .opts select{font-size:var(--fs-sm);padding:4px 6px;max-width:62%}
.setup.pick .btns{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.setup.pick .btns .b2{display:flex;gap:6px}
.setup.pick .btns .b2 button{flex:1;padding:8px 0;font-size:17px}
.setup.pick .credit{font-size:11px}
/* v1.3: 게임 화면 상단 한 줄 */
.layout.onebar{grid-template-rows:0 auto minmax(0,1fr) auto}
.status .sg.who{gap:5px;flex:none;border-left:5px solid var(--sc)}
.status .who .curwho{display:flex;align-items:center;gap:7px;font-weight:800;font-size:var(--fs-md);white-space:nowrap}
.status .who .curwho .dot{width:11px;height:11px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc)}
.status .who .curwho small{font-weight:600;color:var(--muted);font-size:var(--fs-xs)}
.status .who .tophp{display:flex;align-items:center;gap:6px;white-space:nowrap}
.status .who .tophp .hl{font-size:12.5px;color:#ffb3b3;font-weight:800}
.status .who .tophp b{font-size:20px;font-weight:900;color:#ff8a8a;line-height:1}
.status .who .tophp small{font-size:12.5px;color:var(--muted)}
.status .who .tophp .hpbar{width:64px;height:8px;margin:0}
.status .who .tophp.low b{animation:hplow 1s ease-in-out infinite alternate}
.status .sg.sys{flex:none;flex-direction:row;align-items:center;gap:8px;padding:5px 8px;overflow:visible}

#recon .rcbox button{font-size:15px;padding:6px 16px}
.guide .nchip{display:inline-block;background:#1d3a46;border:1px solid #7fa8b4;padding:1px 8px;margin-right:4px;font-size:13px}
.guide .nchip.ok{border-color:#5fd28a;color:#a8f0c0}.guide .nchip.no{border-color:#e05050;color:#ffb0b0}.guide .nchip.req{border-color:#ffd75e;color:#ffe9a8;font-weight:900}


/* 채팅 */
#chat{position:fixed;right:8px;bottom:8px;z-index:95;display:flex;flex-direction:column;align-items:flex-end;font-size:15px}
#chat .chtog{background:#1d3a46;border:2px solid #7fa8b4;color:#fff;padding:3px 12px;font-weight:700;box-shadow:3px 3px 0 #000}
#chat .chbody{display:none;width:min(340px,calc(80*var(--vw)));background:rgba(8,21,27,.96);border:3px solid #7fa8b4;box-shadow:5px 5px 0 #000;margin-top:4px;order:-1;margin-bottom:4px}
#chat.open .chbody{display:block}
#chat .chlist{height:180px;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
#chat .cl{line-height:1.35;word-break:break-all}#chat .cl b{color:#9fe3f5}#chat .cl b.me{color:#ffe08a}#chat .cl.sys{color:#8aa3ab;font-size:13px}
#chat .chq{display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px;border-top:1px solid #34454b}
#chat .chq button{font-size:13px;padding:2px 8px;background:#13262e;border:1px solid #7fa8b4;color:#dfe}
#chat .chin{display:flex;gap:4px;padding:6px;border-top:1px solid #34454b}
#chat .chin input{flex:1;min-width:0;font:inherit;font-size:15px;padding:5px 8px;background:#0e1e26;color:#fff;border:2px solid #7fa8b4}
#chat .chin button{padding:4px 10px}
.guide{position:relative}
.status .sg.who{position:relative}
.ntm{position:absolute;right:6px;bottom:3px;font-size:13px;font-weight:900;color:#cfe6ec;background:#0c1f26;border:1px solid #4f7c88;padding:0 5px;line-height:1.35;pointer-events:none}
.ntm.off{display:none}.ntm.warn{color:#ffb070;border-color:#ff8a3a}.ntm.wait{opacity:.6}
.guide .nfuse{position:absolute;left:0;right:0;bottom:0;height:4px;pointer-events:none;display:none}
.guide .nfuse.on{display:block}
.guide .nfuse i{position:relative;display:block;height:100%;background:linear-gradient(90deg,#8a3a12,#ff8a2a 70%,#ffd75e);transition:width 1s linear}
.guide .nfuse i::after{content:'';position:absolute;right:-4px;top:-3px;width:10px;height:10px;background:#fff3a0;box-shadow:0 0 6px 2px #ff9a2a;animation:fuseSpark .25s steps(2) infinite}
.guide .nfuse.wait i::after{animation:none;opacity:.5}
@keyframes fuseSpark{50%{background:#ff7a2a;box-shadow:0 0 9px 3px #ffcf5a}}
.guide .nbtn.kick{background:#5a1a1a;border-color:#ff8a8a}
body.touch #chat .chlist{height:110px}
.setup.title .tres{display:flex;flex-direction:column;align-items:center;gap:2px}.setup.title .tres small{font-size:14px;color:#9fe3f5;font-weight:700}
.tuthl.tuthl{outline:5px solid #ffd75e !important;outline-offset:3px !important;box-shadow:0 0 0 11px #000 !important;animation:tutPulse .9s steps(2) infinite}
body.scaled .tuthl.tuthl{outline-width:9px !important;outline-offset:4px !important;box-shadow:0 0 0 17px #000 !important}
@keyframes tutPulse{50%{outline-color:#ffffff}}
#tut{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:45;width:min(520px,90%);background:rgba(10,24,30,.97);border:3px solid #ffd75e;box-shadow:6px 6px 0 #000;padding:10px 14px;font-size:15px;line-height:1.5;color:#eef}
#tutblk{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.18)}
#tut.low{top:auto;bottom:29%}
#tut.btm{top:auto;bottom:8px}
body.touch #tut{width:min(380px,58%);font-size:12px;padding:6px 10px;line-height:1.4}
body.touch #tut .tuthd{font-size:11px}body.touch #tut .tutbt{margin-top:4px}body.touch #tut .tutbt button{font-size:12px;padding:2px 10px}
#tut .tuthd{color:#ffd75e;font-weight:900;font-size:13px;margin-bottom:2px}
#tut .tutb b{color:#ffe9a8}
#tut .tutbt{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#tut .tutbt button{padding:3px 14px;font-size:14px}
.hadd-st{margin:6px 0 10px;padding-left:22px;line-height:1.55}.hadd-st li{margin-bottom:6px}
.lbopt{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;font-size:16px}
.lbopt label,.lbopt span{display:flex;align-items:center;gap:6px}.lbopt select{font:inherit;font-size:15px;padding:2px 4px}
.feedbox .fd.chat{font-size:var(--chatfs,14px)}
.lbopt .tg{padding:3px 12px}.lbopt .tg.on{background:#2a5a3a;border-color:#5fd28a}
.feedbox .fd.chat{border-left-color:#c8a0ff;color:#ecdfff}
.lbrd{font-size:13px;padding:0 6px;border:1px solid #7fa8b4;color:#9fb9c2}.lbrd.ok{border-color:#5fd28a;color:#a8f0c0}

.card .art span{font-size:2.6em;color:rgba(255,255,255,.8);text-shadow:0 .05em .2em rgba(0,0,0,.35);line-height:1}
.card .rp{display:flex;flex-direction:column;gap:.18em;flex:none;font-size:.66em}
.card .rp div{display:flex;align-items:center;gap:.3em;flex-wrap:wrap;background:#fffaf0;border-radius:.4em;padding:.1em .35em;border-left:.3em solid #b08a2a}
.card .rp .pn{border-left-color:#a33}
.card .rp em{font-style:normal;font-weight:800;white-space:nowrap}
.card .txt{flex:1 1 auto;min-height:0;overflow:hidden;font-size:.8em;line-height:1.4;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:.25em;padding:0 .15em}
.card .txt .fl{font-style:italic;opacity:.7}
.card .code{flex:none;font-size:.46em;opacity:.5;letter-spacing:.04em;line-height:1}
.op{display:inline-flex;align-items:center;gap:.15em;background:rgba(0,0,0,.08);border-radius:.35em;padding:0 .3em;font-weight:800;white-space:nowrap}
.card .bbar{position:absolute;left:.38em;right:.38em;bottom:.38em;height:1.6em;border-radius:.2em .2em .5em .5em;
  display:flex;align-items:center;justify-content:center;gap:.35em;color:#fff;background:rgba(0,0,0,.3);font-size:1em;font-weight:800}
.card .bbar .lbl{font-size:.62em;opacity:.9;font-weight:700}
.card .bbar .cc{font-size:.66em}
.card .bbar b{font-size:1.05em}
.card .pbar{position:absolute;left:.38em;right:.38em;bottom:.38em;height:1.6em;border-radius:.2em .2em .5em .5em;background:rgba(0,0,0,.45);overflow:hidden}
.card .pbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e0a820,#ffd166)}
.card .pbar span{position:relative;display:flex;align-items:center;justify-content:center;height:100%;color:#fff;font-weight:800;font-size:.72em;text-shadow:0 1px 2px #000}
/* 작은 카드: 그림과 이야기 글을 줄여 핵심 정보 우선 */
@container (max-width:150px){
  .card .mid{flex-basis:24%}
  .card .art span{font-size:1.7em}
  .card .txt .fl{display:none}
  .card .txt{font-size:.8em}
  .card .code{display:none}
}
/* 카드 부속: 단축키 배지 / 확대 버튼 / 리본 */
.card .kb{position:absolute;left:-.35em;top:-.45em;z-index:4;background:#0c2a33;color:#fff;border:2px solid var(--can);border-radius:.5em;
  font-size:max(12px,.7em);font-weight:800;padding:0 .4em;line-height:1.5;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.card .zb{position:absolute;right:-.35em;top:-.45em;z-index:4;width:28px;height:28px;padding:0;border-radius:50%;justify-content:center;
  font-size:14px;background:#0c2a33;border:2px solid #6b8f99;opacity:.8}
.card .zb:hover{opacity:1;background:#1f4b58}
.card .rib{position:absolute;left:50%;transform:translateX(-50%);top:-.8em;z-index:5;background:var(--sel);color:#2a1d05;border-radius:1em;
  padding:0 .7em;font-size:max(12px,.66em);font-weight:900;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.card .rib.tg{background:#ff9f43}
/* 상태: 선택 가능 / 선택됨 / 선택 불가 / 현재 도전 */
.card.can{cursor:pointer;box-shadow:0 0 0 .2em var(--can),0 0 1em rgba(88,216,255,.55)}
.card.can:hover{transform:translateY(-.3em);box-shadow:0 0 0 .25em var(--can),0 .6em 1.4em rgba(0,0,0,.6)}
.card.sel{cursor:pointer;box-shadow:0 0 0 .3em var(--sel),0 0 1.4em var(--sel);transform:translateY(-.5em)}
.card.tgt{box-shadow:0 0 0 .3em #ff9f43,0 0 1.6em #ff9f43}
.card.off{filter:grayscale(.75) brightness(.55);opacity:.7;cursor:not-allowed}
.card.down{filter:brightness(.6) saturate(.6)}
/* 카드 종류 */
.card.evt{--cc:#8f6d2a}
.card.hunger{--cc:#6b4524}
.card.master.back{--cc:#3a2450}
.card.master.back .inner{background:radial-gradient(circle at 50% 40%,#5a3c7a,#241634 70%);color:#eee2ff;align-items:center;justify-content:center;text-align:center;gap:.5em}
.card.master.back .q{font-size:3em;opacity:.75;line-height:1}
.card.master.back .t{font-weight:800;font-size:1.1em}
.card.master.back .h{font-size:.72em;line-height:1.4}
.card.master{--cc:#2c2833}
.card.tdown .inner{align-items:center;justify-content:center;text-align:center;gap:.4em;background:linear-gradient(170deg,#d9d2c2,#bfb49d)}
.card.seeker .inner,.card.item .inner{background:linear-gradient(170deg,#f8efd9,#ecdcb5)}
.card.item.used .inner{background:linear-gradient(170deg,#6a6456,#4a4539);color:#eee}
.card .state{display:inline-block;font-size:.62em;font-weight:800;padding:.05em .5em;border-radius:.5em;background:#2e8a57;color:#fff}
.card.item.used .state{background:#666}

/* ===== 왼쪽 패널 ===== */
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.box h4{margin:0 0 6px;font-size:var(--fs-sm);color:var(--muted);font-weight:700}
.hpbig{font-size:var(--fs-xxl);font-weight:900;color:#ff8a8a;text-align:center;line-height:1.1}
.hpbig small{font-size:var(--fs-md);color:var(--muted);font-weight:600}
.hpbar{height:10px;border-radius:5px;background:#34454b;overflow:hidden;margin:8px 0}
.hpbar div{height:100%;background:linear-gradient(90deg,#e05050,#ff8a8a)}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.row button{padding:4px 10px;font-size:var(--fs-sm)}
.pile{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:var(--fs-sm);line-height:1.3}
.pile .mini{width:28px;height:39px;border-radius:4px;border:1px solid #6d5a33;flex:none;background:repeating-linear-gradient(45deg,#1e4a4f,#1e4a4f 4px,#285e63 4px,#285e63 8px)}
.pile .mini.hg{background:repeating-linear-gradient(45deg,#4a3419,#4a3419 4px,#5d4220 4px,#5d4220 8px)}
.pile b{font-size:var(--fs-xl);font-weight:800;line-height:1}
.lnk{color:var(--gold);cursor:pointer;font-size:var(--fs-xs);text-decoration:underline;background:none;border:none;padding:0;font-weight:600}
.lnk:hover{background:none!important;color:#ffe29a}
.hrow{display:flex;gap:6px;align-items:flex-start;font-size:var(--fs-sm);padding:6px 0;border-top:1px dashed #2c4c56;line-height:1.4}
.hrow b{color:#ffcf9a}
.mods{font-size:var(--fs-sm);color:#ffd0ad;line-height:1.6}

/* 좁은 화면용 한 줄 요약 */
.lstrip{display:none;align-items:center;gap:8px 16px;flex-wrap:wrap;font-size:var(--fs-sm)}
.lstrip b{font-size:var(--fs-lg);font-weight:800}
.lstrip .hp b{color:#ff8a8a;font-size:22px}
.lstrip button{padding:2px 9px;font-size:13px}
.lstrip .sep{width:1px;height:20px;background:var(--line)}

/* ===== 오른쪽 패널 ===== */
.turnbox{padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 30%,#0f222b),#0f222b 75%);border-left:6px solid var(--sc)}
.turnbox .lbl{font-size:var(--fs-xs);color:var(--muted);font-weight:700}
.turnbox .who{font-size:var(--fs-xl);font-weight:900;line-height:1.2}
.turnbox .who small{font-size:var(--fs-sm);color:var(--muted);font-weight:600;margin-left:6px}
.action{padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.action p{margin:6px 0;line-height:1.55}
.chal-sum{background:var(--panel2);border:1px solid #ff9f43;border-radius:11px;padding:9px 12px;margin-bottom:10px}
.chal-sum .nm{font-weight:900;font-size:var(--fs-lg)}
.chal-sum .meta{font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;align-items:center}
.chal-sum .meta b{font-size:var(--fs-lg)}
.progress{height:12px;border-radius:6px;background:#2b3c42;overflow:hidden;margin-top:7px;position:relative}
.progress div{height:100%;background:linear-gradient(90deg,#e0a820,#ffd166)}
.progress div.add{background:repeating-linear-gradient(45deg,#7fe0ff,#7fe0ff 5px,#4ab7d8 5px,#4ab7d8 10px)}
.steps{display:flex;gap:4px;margin:8px 0}
.steps div{flex:1;text-align:center;font-size:13px;font-weight:700;padding:6px 2px;border-radius:7px;background:#15313b;color:var(--muted)}
.steps div.on{background:var(--gold);color:#2a1d05}
.steps div.done{background:#23505c;color:#d7f3ff}
.selbox{background:#0b1b22;border:1px dashed #3d6b78;border-radius:10px;padding:8px 11px;margin:8px 0;font-size:var(--fs-md)}
.selbox .l{font-size:var(--fs-xs);color:var(--muted);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tally{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:var(--fs-sm);background:#0b1b22;border-radius:10px;padding:9px 12px;margin:10px 0 2px}
.tally .tot{font-weight:900;color:var(--gold);border-top:1px solid var(--line);padding-top:5px;font-size:var(--fs-lg)}
.dice{display:flex;gap:10px;margin:12px 0 18px;justify-content:center}
.die{width:58px;height:58px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1.1;
  border:2px solid rgba(255,255,255,.5);box-shadow:0 2px 6px rgba(0,0,0,.5);position:relative;font-weight:800}
.die i{font-style:normal;font-size:22px}
.die small{font-size:12px}
.die.hit{box-shadow:0 0 0 3px var(--sel),0 0 14px var(--sel)}
.die.hit::before{content:"+1";position:absolute;top:-10px;right:-8px;background:var(--sel);color:#2a1d05;border-radius:8px;font-size:12px;padding:0 5px}
.die.R{background:var(--R)}.die.G{background:var(--G)}.die.B{background:var(--B)}
.die.L{background:#f4e6b8;color:#8a5a00}.die.D{background:#17171b}
.die.q{background:#223}
.die.fate::after{content:"운명";position:absolute;bottom:-19px;font-size:12px;color:var(--muted)}
.die.rr{cursor:pointer;outline:2px dashed var(--can);outline-offset:3px}
.result{font-size:var(--fs-xl);font-weight:900;padding:10px;border-radius:10px;text-align:center;margin:6px 0}
.result.ok{background:#1f5a3a}.result.ng{background:#5a2323}
.infobox{padding:12px 16px;border-bottom:1px solid var(--line);font-size:var(--fs-sm);line-height:1.6;min-height:120px;overflow:auto;flex:1 1 auto;background:#0c1d24}
.infobox .ih{font-size:var(--fs-xs);color:var(--muted);font-weight:700;margin-bottom:3px}
.infobox .in{font-size:var(--fs-lg);font-weight:800;line-height:1.3}
.infobox .ir{margin-top:3px}
.infobox .ir em{font-style:normal;color:var(--muted);font-weight:700;margin-right:5px}
.infobox .fl{font-style:italic;color:#c9d6d8;margin-top:4px}
.loghead{padding:7px 14px;font-size:var(--fs-xs);color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.log{flex:0 0 auto;height:clamp(90px,calc(17*var(--vh)),170px);overflow:auto;padding:6px 14px;font-size:var(--fs-sm);line-height:1.5}
.log div{padding:3px 0;border-bottom:1px dotted #1f3a44;color:#d3dfe1}
.log .turn{color:var(--gold);font-weight:800;border-bottom:none;padding-top:8px}
.log .good{color:#94e8ad}.log .bad{color:#ffa3a3}.log .sys{color:#c4b5ff}

/* ===== 하단: 탐험대원 ===== */
.tabs{display:flex;gap:4px;padding:6px 10px 0;overflow-x:auto}
.tab{padding:6px 14px;border-radius:9px 9px 0 0;background:#10262e;border:1px solid var(--line);border-bottom:none;cursor:pointer;font-size:15px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tab .dot{width:11px;height:11px;border-radius:50%;background:var(--sc)}
.tab.on{background:#183640;color:#fff;font-weight:800}
.tab .tn{display:inline-grid}.tab .tn>span,.tab .tn::after{grid-area:1/1}.tab .tn::after{content:attr(data-w);visibility:hidden;font-weight:800}
.tab .cur.off{visibility:hidden}
.curwho .cwt{display:inline-grid}.curwho .cwt>span{grid-area:1/1;white-space:nowrap}.curwho .cwt>.gh{visibility:hidden}.tab .n{min-width:3.4em;text-align:right}
.tab .cur{font-size:12px;background:var(--gold);color:#2a1d05;border-radius:6px;padding:0 6px;font-weight:800}
.tab .n{font-size:13px;color:var(--muted)}
.tab.help{box-shadow:0 0 0 2px var(--can) inset}
.seat{display:flex;gap:14px;padding:12px 12px 10px;background:#183640;border-top:1px solid var(--line);align-items:stretch}
.seatinfo{flex:none;width:clamp(320px,calc(27*var(--vw)),440px);min-height:calc(var(--hw)*1.4016);overflow:visible;background:#10262e;border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:10px;padding:8px 10px;font-size:var(--fs-sm);line-height:1.45}
.seatinfo .snm{font-size:var(--fs-lg);font-weight:900;display:flex;align-items:baseline;gap:4px 6px;flex-wrap:wrap}
.seatinfo .snm .nmx{white-space:nowrap}
.seatinfo .ihead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seatinfo .ihead button{margin:0 0 0 auto}
.seatinfo .snm small{font-size:var(--fs-xs);color:var(--muted);font-weight:600}
.seatinfo .sect{margin-top:6px;padding-top:6px;border-top:1px dashed #2c4c56}
.seatinfo .sect b{color:#ffe0a0}

.slot.closed::before{content:"닫힘 (배고픔)";border-color:#6b4524;color:#b07a4a}

.seatinfo .l2{font-size:12px;color:var(--muted);font-weight:700}
.setup .credit{position:fixed;left:12px;bottom:10px;font-size:12px;color:#7d979d;max-width:calc(60*var(--vw));line-height:1.4}


.card.dual{background:linear-gradient(180deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
.card .berryline{font-size:.92em;font-weight:700;color:#a3311f}
.card .cbtns{position:absolute;right:.4em;top:3.3em;z-index:5;display:flex;flex-direction:column;gap:3px;align-items:flex-end}

.card .cbtn.show{background:#1f5a7a;border-color:#58b8e0}.card .cbtn.show:hover{background:#2a7aa3!important}

.card .xl{font-size:.92em;font-weight:700;line-height:1.3}
.card .xs{color:#1f5a7a}.card .xt{color:#6a4a0a}.card .xr{color:#3d5a1a}
.card .tagc{background:rgba(0,0,0,.12);border-radius:.3em;padding:0 .25em}
.seatinfo .toppas{display:block;width:100%;font-size:12px;color:#ffd28a}
.card .rp em.lk{margin-left:.35em;color:#8a6a00}
.card .rp em.lk.dk{color:#444}
.card.master.back .back-ab{font-size:.62em;background:rgba(0,0,0,.25);border-radius:.4em;padding:.3em .4em;opacity:.85}
.card.master.back .back-ab.on{background:rgba(170,40,40,.55);opacity:1}
.card .bitems{font-size:.9em;font-weight:700;color:#5a2a7a}
.card.master.back .bitems{color:#ffd6f0;font-size:.62em}
.story{font-size:var(--fs-md);line-height:1.7;color:#f1e7cf;background:#1a2d33;border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px}
.seatinfo .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
.seatinfo .sbox{background:#0c1f26;border:1px solid #28505c;border-radius:8px;padding:5px 7px;font-size:12.5px;line-height:1.4}
.seatinfo .sbox.usedb{opacity:.75}
.seatinfo .sh{font-weight:800;color:#ffe0a0;font-size:13px;margin-bottom:2px}
.seatinfo .srow{margin-top:5px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}


.card .bvs{font-size:.62em;background:#ffd166;color:#3a2600;border-radius:.5em;padding:0 .35em;font-weight:900}
.hand .card .mid{flex-basis:17%}
.hand .card .art span{font-size:1.5em}
.hand .card .txt{font-size:.9em;line-height:1.3}
.hand .card .txt .fl{display:none}
.hand .card .name{font-size:1.15em}
.hand .card .code{display:none}
.setup .grid{gap:14px}
.setup .pickp{position:relative;cursor:pointer;width:clamp(250px,calc(30*var(--vw)),360px);background:#10262e;border:2px solid #2a5462;border-left:8px solid var(--sc);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:transform .12s}
.setup .pickp:hover{transform:translateY(-3px)}

.card .aura{display:block;background:#3a2150;color:#f3e3ff;border-radius:.4em;padding:.15em .35em;font-weight:700}
.card .trk{color:#b3261e}
.itemfx{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,color-mix(in srgb,var(--sc) 55%,transparent) 0%,rgba(0,0,0,.82) 60%);animation:fxin .25s ease-out;cursor:pointer}
.itemfx.out{animation:fxout .25s ease-in forwards}
.itemfx .fxring{position:absolute;width:40vmin;height:40vmin;border-radius:50%;border:6px solid var(--sc);box-shadow:0 0 60px var(--sc);animation:fxring 1.2s ease-out infinite}
.itemfx .fxbox{position:relative;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8);animation:fxpop .45s cubic-bezier(.2,1.6,.4,1)}
.itemfx .fxg{font-size:96px;line-height:1;filter:drop-shadow(0 0 24px var(--sc))}
.itemfx .fxname{font-size:44px;font-weight:900;margin-top:6px;color:#fff6d8}
.itemfx .fxline{font-size:22px;font-weight:700;margin-top:8px}
.itemfx .fxtext{font-size:17px;margin-top:10px;opacity:.9;max-width:640px}
@keyframes fxin{from{opacity:0}to{opacity:1}}
@keyframes fxout{to{opacity:0}}
@keyframes fxpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fxring{from{transform:scale(.4);opacity:1}to{transform:scale(2.2);opacity:0}}

}
}

.setup{height:calc(100*var(--vh));overflow:hidden;display:grid;grid-template-columns:1fr minmax(290px,calc(24*var(--vw)));gap:22px;align-items:stretch;padding:18px 22px 34px}
.setup .sl{display:flex;flex-direction:column;min-height:0}
.setup .sl .lead{margin-bottom:10px}
.setup .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:none;flex:1;min-height:0;align-content:start}
.setup .pickp{width:auto;padding:10px 12px;gap:6px}
.setup .pickp .pb{font-size:clamp(12.5px,calc(1.55*var(--vh)),15px);line-height:1.45;padding:7px 9px}
.setup .pickp .pn{font-size:clamp(18px,calc(2.2*var(--vh)),22px)}

.setup .sr{display:flex;flex-direction:column;gap:14px;background:rgba(10,24,30,.55);border:1px solid var(--line);border-radius:16px;padding:18px;overflow:auto}

.ty{color:var(--ty);font-weight:800;text-shadow:0 0 1px rgba(0,0,0,.35)}

.setup.title.cov button.cvb:hover::before,.setup.title.cov button.cvb.kfocus::before{left:8px}
.setup.title.cov .cvsub{display:flex;flex-wrap:wrap;gap:6px 14px}
.setup.title.cov button.cvs{background:transparent;border:0;box-shadow:none;color:#c8d4f0;font-size:clamp(12px,calc(1.6*var(--vh)),15px);padding:2px 0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.setup.title.cov button.cvs:hover{color:#ffe28a}
.setup.title.cov button.cvs::before{content:none !important}
.setup.title.cov .credit{left:12px;right:auto;max-width:calc(100% - clamp(280px,calc(32*var(--vw)),480px) - 24px);color:#d8e0f0;text-shadow:1px 1px 0 #000}

/* 탐험 기록 */
.rec{display:flex;flex-direction:column;gap:10px;text-align:left}
.rec h4{margin:8px 0 0;font-size:17px;color:#ffe28a}.rec h4 small{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.rec .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:start}
.rec .rwrap{overflow-x:auto;max-width:100%}.rec .rr{white-space:nowrap}
.rec .rt{width:100%;border-collapse:collapse;font-size:14px}.rec .rt th{text-align:left;color:#a8bcf0;border-bottom:1px solid #2a5462;padding:3px 6px}
.rec .rt td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.08)}.rec .rt td:last-child{text-align:right}
.rec .rr td:last-child{text-align:left}.rec .rr td.w{color:#7fe0a0}.rec .rr td.l{color:#ff9a9a}
.rec .achl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.rec .ach{background:#0c1f26;border:1px solid #28505c;padding:6px 9px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.rec .ach.on{opacity:1;border-color:#e8c060}.rec .ach b{font-size:14px}.rec .ach span{font-size:12.5px;color:var(--muted)}
.rec .rcode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rec .rcode code{font-size:18px;letter-spacing:1px;background:#05070f;border:1px solid #e8c060;padding:6px 10px;user-select:all;word-break:break-all}
.rec .rin{display:flex;gap:8px}.rec .rin input{flex:1;min-width:0;font-size:15px;padding:6px 8px;background:#05070f;color:#fff;border:1px solid #2a5462}
.rec .rmsg{min-height:1.2em;color:#ffe28a;margin:0}

/* 업적·해금 알림 (오른쪽 아래에서 올라옴) */
#achpop{position:fixed;right:16px;bottom:16px;z-index:12000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
#achpop .apop{display:flex;gap:12px;align-items:center;min-width:280px;max-width:min(380px,calc(80*var(--vw)));background:#0b1430;border:2px solid #e8c060;outline:2px solid #05070f;box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:10px 14px;color:#fff;animation:apIn .45s ease-out both}
#achpop .apop.out{animation:apOut .5s ease-in both}
#achpop .apop>i{font-style:normal;font-size:30px;line-height:1}
#achpop .apop div{display:flex;flex-direction:column;gap:2px;min-width:0}
#achpop .apop small{font-size:12px;color:#a8bcf0}#achpop .apop b{font-size:16px;color:#ffe28a}#achpop .apop span{font-size:12.5px;color:#c8d4f0}
@keyframes apIn{from{transform:translateY(140%);opacity:0}to{transform:none;opacity:1}}
@keyframes apOut{from{transform:none;opacity:1}to{transform:translateY(140%);opacity:0}}
.setup .pchip.locked{opacity:.75;filter:grayscale(1)}.pchip.locked .pg,.setup .pickp.locked .pg{display:flex;align-items:center;justify-content:center;font-weight:900;color:#9fb0c0;font-size:clamp(14px,calc(3.2*var(--vh)),30px)}
.setup .pickp.locked .pg{font-size:clamp(36px,calc(8*var(--vh)),80px)}.lbpc.locked .pg{font-size:44px}

<script>
const PORTRAITS=["bulbasaur", "charmander", "eevee", "jigglypuff", "pikachu", "riolu", "squirtle"];
const CTYPE_ICONS=["이벤트", "장애물", "전투", "퍼즐", "함정"];
const TYPE_ICONS=["강철", "격투", "고스트", "노말", "독", "드래곤", "땅", "물", "바위", "불꽃", "얼음", "에스퍼", "전기", "페어리", "풀"];
/* =================== 사운드: 코드로 만드는 8비트 효과음·배경음악 (소리 파일 없음) =================== */
const SND = (() => {
  let ctx = null, master = null, sfxBus = null, musBus = null, CUR = null;
  const st = {on:true, bgm:true, fx:true, sfx:0.5, mus:0.35};   // on: 전체(항상 켬, 예전 설정 호환), bgm: 배경음악, fx: 효과음
  try { const v = localStorage.getItem('pmd_sound'); if (v==='0'){ st.bgm = st.fx = false; localStorage.removeItem('pmd_sound'); }
    const g = localStorage.getItem('pmd_bgm'), f = localStorage.getItem('pmd_fx'); if (g!=null) st.bgm = g!=='0'; if (f!=null) st.fx = f!=='0'; const a = localStorage.getItem('pmd_vol_sfx'), b = localStorage.getItem('pmd_vol_mus'); if (a!=null) st.sfx = +a; if (b!=null) st.mus = +b; } catch(e){}
  const waves = {};
  function init(){
    if (ctx) { if (ctx.state==='suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = st.sfx; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = st.mus; musBus.connect(master);
    // 옛 게임기 느낌의 펄스파(듀티 12.5% / 25%)
    for (const d of [0.125, 0.25]){
      const n = 32, re = new Float32Array(n), im = new Float32Array(n);
      for (let k=1;k<n;k++) im[k] = (2/(k*Math.PI)) * Math.sin(k*Math.PI*d);
      waves[d] = ctx.createPeriodicWave(re, im);
    }
    return true;
  }
  const hz = n => { // 'A4', 'C#5', 'Bb3'
    const m = /^([A-G])(#|b)?(\d)$/.exec(n); if (!m) return 0;
    const s = {C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2}[m[1]] + (m[2]==='#'?1:m[2]==='b'?-1:0) + (+m[3]-4)*12;
    return 440 * Math.pow(2, s/12);
  };
  // 음 하나: 주파수(또는 음 이름), 길이, 파형, 음량, 끝 주파수(미끄러짐)
  function tone({f, d=0.1, w='p25', v=0.3, to=null, at=0, bus=null, a=0.004, r=0.03}){
    const t = (at||ctx.currentTime), o = ctx.createOscillator(), g = ctx.createGain();
    const fr = typeof f==='string' ? hz(f) : f;
    if (w==='p25') o.setPeriodicWave(waves[0.25]); else if (w==='p12') o.setPeriodicWave(waves[0.125]); else o.type = w;
    o.frequency.setValueAtTime(fr, t);
    if (to) o.frequency.exponentialRampToValueAtTime(typeof to==='string'?hz(to):to, t+d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t+a);
    g.gain.setValueAtTime(v, t+Math.max(a, d-r)); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(bus||CUR||sfxBus); o.start(t); o.stop(t+d+0.02);
  }
  let nbuf = null;
  function noise({d=0.1, v=0.3, hp=0, lp=0, bp=0, bpTo=0, q=1.2, at=0, bus=null, a=0}){
    if (!nbuf){ nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const c = nbuf.getChannelData(0); for (let i=0;i<c.length;i++) c[i] = Math.random()*2-1; }

    if (lp){ const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = lp; node.connect(f); node = f; }
    if (bp){ const f = ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value = q; f.frequency.setValueAtTime(bp, t); if (bpTo) f.frequency.exponentialRampToValueAtTime(bpTo, t+d); node.connect(f); node = f; }

  /* ---------- 효과음 ---------- */
  const SFX = {
    select:  () => tone({f:'E6', d:0.05, w:'p12', v:0.18}),
    confirm: () => seq(['C6','G6'], 0.06, {w:'p25', v:0.2}),

    // 카드 뽑기: 종이 한 장 넘기는 「스륵」 / 버리기: 여러 장 미끄러지는 「스르륵」
    draw:    () => { const t = ctx.currentTime;   // 「스슥」: 짧게 두 번 스치는 종이 소리
                     noise({d:0.05, v:0.35, hp:1800, bp:3500, bpTo:6000, q:0.8, a:0.012, at:t});

    discard: () => { const t = ctx.currentTime;   // 「스르륵」: 여러 장이 미끄러지며 잦아듦

    // 주사위: 또르륵 (점점 느려지며 잦아드는 딸깍 소리)
    dice:    () => { const t = ctx.currentTime; let x = 0; for (let i=0;i<9;i++){ noise({d:0.03, v:0.75-i*0.05, bp:2600+Math.random()*1400, q:2, at:t+x}); x += 0.03 + i*0.008; } },
    match:   () => seq(['E6','A6'], 0.05, {w:'p12', v:0.16}),
    complete:() => seq(['C5','E5','G5','C6'], 0.07, {w:'p25', v:0.2, d:0.09}),
    damage:  () => { noise({d:0.16, v:0.4, lp:900}); tone({f:120, to:50, d:0.18, w:'square', v:0.2}); },
    // 피해 감소: 방패에 맞고 「팅~」 울리는 금속음 (어긋난 배음 + 짧은 타격음)
    block:   () => { const t = ctx.currentTime;   // 「텅」: 방패에 맞는 낮은 금속음
                     noise({d:0.05, v:0.5, lp:1800, at:t}); tone({f:220, to:160, d:0.12, w:'triangle', v:0.35, at:t});
                     [[620,0.32,0.6],[985,0.18,0.45],[1470,0.09,0.3],[2110,0.04,0.2]].forEach(([f,v,d])=>tone({f, d, w:'sine', v, a:0.002, r:d*0.9, at:t})); },
    fail:    () => seq(['E4','C4','A3'], 0.11, {w:'p25', v:0.18, d:0.12}),
    turn:    () => seq(['G5','D6'], 0.08, {w:'triangle', v:0.3}),
    // 던전 문 열림: 크게 울리는 「쿠-웅」 + 돌 끌리는 소리
    door:    () => { const t = ctx.currentTime;   // 휴대폰 스피커에서도 들리도록 중간 대역(150~1500Hz)을 함께 낸다
                     tone({f:90, to:40, d:0.9, w:'triangle', v:0.6, at:t, r:0.5}); tone({f:200, to:80, d:0.5, w:'square', v:0.22, at:t, r:0.3});
                     noise({d:0.4, v:0.8, lp:1500, at:t}); noise({d:0.9, v:0.45, bp:700, bpTo:200, q:0.7, a:0.12, at:t+0.2}); },
    // 부적 사용: 반짝이며 올라가는 아르페지오
    item:    () => { seq(['C6','E6','G6','C7','E7'], 0.045, {w:'p12', v:0.14, d:0.08}); tone({f:'G5', d:0.35, w:'triangle', v:0.2, at:ctx.currentTime+0.05}); },
    // 부적 충전: 빠르게 차오르는 소리
    charge:  () => { tone({f:'C5', to:'C7', d:0.22, w:'p25', v:0.12}); tone({f:'C7', d:0.08, w:'p12', v:0.1, at:ctx.currentTime+0.22}); },
    // HP 회복: 부드러운 상승 세 음
    heal:    () => seq(['G5','B5','D6'], 0.07, {w:'triangle', v:0.32, d:0.1}),
    // 배고픔 획득: 낮게 꾸르륵
    hunger:  () => { const t = ctx.currentTime; [0,0.12,0.22].forEach((x,i)=>tone({f:150-i*25, to:90-i*15, d:0.11, w:'p25', v:0.2, at:t+x})); },
    // HP 3 이하 경고: 낮은 심장 박동 「두근-두근」 한 번
    lowhp:   () => { const t = ctx.currentTime; [[0,1],[0.24,0.75]].forEach(([x,k])=>{
                       tone({f:75, to:42, d:0.16, w:'sine', v:0.8*k, at:t+x, r:0.12}); tone({f:150, to:85, d:0.12, w:'triangle', v:0.35*k, at:t+x, r:0.09});
                       noise({d:0.08, v:0.35*k, lp:400, at:t+x}); }); },
    // 보스 등장: 땅울림 + 낮은 포효
    boss:    () => { const t = ctx.currentTime;
                     noise({d:1.4, v:0.7, lp:350, a:0.25, at:t}); tone({f:55, to:38, d:1.4, w:'triangle', v:0.6, a:0.2, at:t, r:0.6});
                     tone({f:190, to:70, d:0.9, w:'sawtooth', v:0.22, a:0.08, at:t+0.35, r:0.4}); tone({f:240, to:95, d:0.8, w:'square', v:0.12, a:0.08, at:t+0.38, r:0.35});
                     noise({d:0.8, v:0.4, bp:600, bpTo:180, q:0.9, a:0.1, at:t+0.35}); },
    // 승리: 밝게 올라가는 짧은 팡파레
    win:     () => { const t = ctx.currentTime, s = 0.11;
                     [['C5',0],['E5',1],['G5',2],['C6',3],['G5',5],['C6',6]].forEach(([f,i])=>tone({f, d:s*0.9, w:'p25', v:0.2, at:t+i*s}));
                     tone({f:'E6', d:1.1, w:'p25', v:0.22, at:t+7*s, r:0.5});
                     ['C5','G5'].forEach(f=>tone({f, d:1.1, w:'triangle', v:0.2, at:t+7*s, r:0.5}));
                     tone({f:'C3', d:1.2, w:'triangle', v:0.35, at:t+7*s, r:0.5}); },
    // 패배: 천천히 내려앉는 단조 징글
    tick:    () => { tone({f:1900, d:0.03, w:'square', v:0.07}); noise({d:0.02, v:0.25, bp:3400, q:3}); },   // 「째깍」 차례 시간 마지막 15초
    myturn:  () => seq(['G5','C6','E6','G6'], 0.075, {w:'triangle', v:0.32, d:0.12}),   // 온라인: 내 차례 알림
    chat:    () => { const t = ctx.currentTime; [0, 0.13].forEach(x=>tone({f:'B6', d:0.05, w:'p25', v:0.16, at:t+x})); },   // 「띡. 띡.」 채팅 도착
    lose:    () => { const t = ctx.currentTime, s = 0.24;
                     ['E5','D5','C5','B4'].forEach((f,i)=>tone({f, d:s*0.95, w:'p25', v:0.18, at:t+i*s}));
                     tone({f:'A4', d:1.3, w:'p25', v:0.18, at:t+4*s, r:0.7}); tone({f:'C5', d:1.3, w:'triangle', v:0.14, at:t+4*s, r:0.7});
                     tone({f:'A2', d:2.2, w:'triangle', v:0.35, at:t, r:0.9}); },
  };
  // 효과음별 크기 보정(휴대폰 스피커 기준으로 들리는 크기를 맞춤)
  const GAIN = {"select": 1.47, "confirm": 1.19, "cancel": 1.28, "draw": 0.97, "discard": 1.02, "dice": 1.34, "match": 2.05, "complete": 0.84, "damage": 0.74, "block": 0.18, "fail": 1.0, "turn": 0.33, "door": 0.44, "item": 0.42, "charge": 1.33, "heal": 0.28, "hunger": 1.8, "lowhp": 1.6, "boss": 0.7, "win": 0.3, "lose": 0.45, "chat": 1.0, "tick": 0.9, "myturn": 0.9};
  function play(name){ if (!st.fx || !init() || !SFX[name]) return;
    const g = ctx.createGain(); g.gain.value = GAIN[name]!=null ? GAIN[name] : 1; g.connect(sfxBus); CUR = g; try { SFX[name](); } finally { CUR = null; } }

  /* ---------- 배경음악: 음표 데이터 + 앞서 예약하는 재생기 ---------- */
  // 한 칸 = 8분음표. '-' = 앞 음 이어짐, '.' = 쉼
  const SONGS = {
    // 시작·선택 화면: 밝고 경쾌하게
    title: { bpm:138, bass:'oct', drum:'basic', pad:false,
      lead: 'E5 . G5 . C6 . G5 E5 | D5 . G5 . B5 - A5 G5 | A5 . E5 . C5 . E5 A5 | G5 - F5 - E5 . D5 . | E5 . G5 . C6 . D6 E6 | D6 - B5 - G5 . A5 B5 | C6 . A5 . F5 . A5 C6 | B5 - D6 - B5 . G5 D5',
      chords: ['C4 E4 G4','G3 B3 D4','A3 C4 E4','F3 A3 C4','C4 E4 G4','G3 B3 D4','F3 A3 C4','G3 B3 D4'],
      bass: ['C3','G2','A2','F2','C3','G2','F2','G2'] },
    // 던전 탐험(게임 중): 빠른 단조 전투곡
    battle: { bpm:160, bass:'drive', drum:'drive', pad:false,
      lead: 'E5 . E5 . G5 . B5 A5 | G5 . E5 . C5 . E5 G5 | F#5 . F#5 . A5 . D6 C6 | B5 - - - D#5 . F#5 . | E5 . G5 . B5 . E6 D6 | C6 . B5 . G5 . E5 G5 | A5 . C6 . E6 . C6 A5 | B5 - D#6 - F#6 - B5 .',
      chords: ['E3 G3 B3','C3 E3 G3','D3 F#3 A3','B2 D#3 F#3','E3 G3 B3','C3 E3 G3','A2 C3 E3','B2 D#3 F#3'],
      bass: ['E2','C2','D2','B1','E2','C2','A1','B1'] },
    // 최심층 보스전: 느리고 무거운 웅장한 곡
    boss: { bpm:104, bass:'oct', drum:'boss', pad:true,
      lead: 'D5 - - - A5 - - - | A#5 - A5 - G5 - F5 - | G5 - - - C6 - - - | A5 - - - C#6 - E6 - | D6 - - - A5 - F5 - | A#5 - - - D6 - F6 - | G5 - A5 - A#5 - D6 - | C#6 - - - A5 - - -',
      chords: ['D3 F3 A3','A#2 D3 F3','C3 E3 G3','A2 C#3 E3','D3 F3 A3','A#2 D3 F3','G2 A#2 D3','A2 C#3 E3'],
      bass: ['D2','A#1','C2','A1','D2','A#1','G1','A1'] },
  };
  let mus = null, cur = null, pend = null;
  function parseLine(s){ return s.split('|').flatMap(b=>b.trim().split(/\s+/)); }
  const up = (n, k=1) => n.replace(/(\d)$/, d=>String(+d+k));
  function startMusic(name, fadeIn=2.5, delay=0){
    if (!init()) return; stopMusic(true);
    const S = SONGS[name]; if (!S) return;
    const step = 60/S.bpm/2, lead = parseLine(S.lead), N = lead.length, t0 = ctx.currentTime + 0.1 + delay;
    // 무음에서 시작해 기본 음량까지 서서히 키운다
    musBus.gain.cancelScheduledValues(ctx.currentTime); musBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    musBus.gain.setValueAtTime(0.0001, t0); musBus.gain.linearRampToValueAtTime(st.mus, t0 + fadeIn);
    mus = {S, step, lead, N, i:0, t:t0, timer:null}; cur = name;
    const sched = () => {
      while (mus && mus.t < ctx.currentTime + 0.25){
        const i = mus.i % N, bar = Math.floor(i/8), pos = i%8, t = mus.t;
        const n = lead[i];
        if (n!=='.' && n!=='-'){ let len = 1; while (lead[(i+len)%N]==='-' && len<8) len++;
          tone({f:n, d:step*len*0.92, w:'p25', v:0.16, at:t, bus:musBus, r:0.05});
          if (S.pad) tone({f:up(n,-1), d:step*len*0.92, w:'p12', v:0.06, at:t, bus:musBus, r:0.05}); }   // 보스전: 한 옥타브 아래로 겹쳐 두껍게
        const ch = S.chords[bar].split(' ');
        if (S.pad){ if (pos===0 || pos===4) ch.forEach(c=>tone({f:up(c), d:step*3.9, w:'p12', v:0.03, at:t, bus:musBus, a:0.06, r:0.2})); }   // 길게 깔리는 화음
        else { tone({f:up(ch[(pos*2)%3]), d:step*0.42, w:'p12', v:0.05, at:t, bus:musBus}); tone({f:up(ch[(pos*2+1)%3]), d:step*0.42, w:'p12', v:0.04, at:t+step/2, bus:musBus}); }
        const b = S.bass[bar];
        if (S.bass==='drive' || S.bass==='oct' || true){
          const bn = S.bass==='drive' ? (pos%4===3 ? up(b) : b) : (pos%2 ? up(b) : b);
          tone({f:bn, d:step*0.8, w:'triangle', v:0.34, at:t, bus:musBus});
        }
        const kick = (v=0.5) => tone({f:110, to:40, d:0.12, w:'sine', v, at:t, bus:musBus});
        const snare = (v=0.16, x=0) => noise({d:0.09, v, hp:1500, at:t+x, bus:musBus});
        if (S.drum==='basic'){
          if (pos===0 || pos===4) kick(); if (pos===2 || pos===6) snare();
          noise({d:0.022, v:pos%2?0.07:0.04, hp:6500, at:t, bus:musBus}); noise({d:0.02, v:0.035, hp:7000, at:t+step/2, bus:musBus});
          if (pos===7 && bar%2===1) snare(0.12, step/2);
        } else if (S.drum==='drive'){   // 전투: 밀어붙이는 킥, 2·4박 스네어, 16분 하이햇, 4마디마다 연타
          if (pos===0 || pos===3 || pos===4) kick(0.55); if (pos===2 || pos===6) snare(0.2);
          noise({d:0.02, v:0.06, hp:6500, at:t, bus:musBus}); noise({d:0.02, v:0.04, hp:7000, at:t+step/2, bus:musBus});

        } else if (S.drum==='boss'){    // 보스: 팀파니 같은 낮은 북, 4마디마다 큰 북 연타
          if (pos===0 || pos===4){ tone({f:95, to:55, d:0.3, w:'triangle', v:0.6, at:t, bus:musBus}); tone({f:60, to:35, d:0.25, w:'sine', v:0.5, at:t, bus:musBus}); }
          if (pos===2 || pos===6) snare(0.14);
          if (pos%2===1) noise({d:0.03, v:0.04, hp:6000, at:t, bus:musBus});
          if (bar%4===3 && pos>=4){ tone({f:150-(pos-4)*20, to:80, d:0.15, w:'triangle', v:0.45, at:t, bus:musBus}); tone({f:140-(pos-4)*20, to:75, d:0.15, w:'triangle', v:0.4, at:t+step/2, bus:musBus}); }
        }
        mus.i++; mus.t += step;
      }
    };
    sched(); mus.timer = setInterval(sched, 40);
  }
  function stopMusic(now){ if (pend){ clearTimeout(pend); pend = null; } if (mus){ clearInterval(mus.timer); mus = null; } if (!now) cur = null; }
  // 원하는 곡으로 전환: 이전 곡은 잠깐 줄여 끄고, 새 곡은 무음에서 서서히 키운다(보스전은 정적 뒤 더 천천히)
  function want(name){
    if (window.__noFx) return;
    if (!st.bgm){ stopMusic(); cur = null; return; }
    if (name===cur) return;
    if (!name){ if (mus && ctx){ musBus.gain.cancelScheduledValues(ctx.currentTime); musBus.gain.setValueAtTime(musBus.gain.value, ctx.currentTime); musBus.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+1.2); pend = setTimeout(()=>stopMusic(), 1300); } cur = null; return; }
    if (!init()) return;
    const boss = name==='boss', had = !!mus;
    if (had){ musBus.gain.cancelScheduledValues(ctx.currentTime); musBus.gain.setValueAtTime(musBus.gain.value, ctx.currentTime); musBus.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.6); }
    cur = name; if (pend) clearTimeout(pend);
    pend = setTimeout(()=>{ pend = null; if (cur===name) startMusic(name, boss ? 2.5 : (!had && name==='title' ? 0.6 : 2.5), boss ? 0.5 : (!had && name==='title' ? 0.4 : 0)); }, had ? 650 : 0);   // 첫 시작 화면: 0.5초 뒤 바로 들리게
  }
  function setVol(k, v){ st[k] = v; try { localStorage.setItem('pmd_vol_'+k, String(v)); } catch(e){} if (!ctx) return; if (k==='sfx') sfxBus.gain.value = v; if (k==='mus' && mus){ musBus.gain.cancelScheduledValues(ctx.currentTime); musBus.gain.setValueAtTime(Math.max(0.0001, v), ctx.currentTime); } }
  function save(){ try { localStorage.setItem('pmd_bgm', st.bgm?'1':'0'); localStorage.setItem('pmd_fx', st.fx?'1':'0'); } catch(e){} }
  function toggle(){ const on = !(st.bgm || st.fx); st.bgm = st.fx = on; save(); if (!on) stopMusic(); return on; }   // M: 둘 다 켜기·끄기
  function setBgm(v){ st.bgm = v; save(); if (!v){ stopMusic(); cur = null; } }
  function setFx(v){ st.fx = v; save(); }
  return {play, want, startMusic:(n)=>{ if (st.bgm) startMusic(n); }, stopMusic, setVol, st, init, toggle, setBgm, setFx, list:Object.keys(SFX), playing:()=>!!mus, current:()=>cur, songs:Object.keys(SONGS)};
})();

// 게임에서 부르는 짧은 이름 (시뮬레이션 중에는 소리 없음)
function sfx(n){ if (!window.__noFx) SND.play(n); }   // function 선언: 멀티에서 net.js가 감싸 참가자에게 소리를 보낸다
// 휴대폰: 첫 터치·클릭 때 소리 장치를 깨운다
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, ()=>{ if (SND.st.bgm || SND.st.fx){ SND.init(); if (typeof syncMusic==='function') syncMusic(); } }, {once:true, capture:true}));
// 지금 화면에 맞는 배경음악: 시작·선택 화면 → title, 게임 중 → battle, 최심층 → boss, 게임 끝 → 없음
function syncMusic(){ if (window.__noFx) return; SND.want(typeof S==='undefined' || !S ? 'title' : (over() ? null : (S.phase==='final' ? 'boss' : 'battle'))); }

/* =================== 온라인 멀티플레이 (방장 진행 · P2P) ===================
   - 방장 브라우저가 게임을 진행(무작위 포함)하고, 참가자는 화면만 받아 그린다.
   - 참가자의 조작은 함수 호출로 방장에게 보내고, 방장이 권한을 확인한 뒤 실행한다.
   - 연결: PeerJS(인터넷) · 주소에 ?net=local 이면 같은 브라우저 탭끼리(BroadcastChannel, 시험용)
*/
const NET = {on:false, role:null, pid:null, code:null, nick:'', players:[], picks:[], conns:{}, link:null,
  ui:false, seq:0, wait:{}, snap:null, sendT:null, decider:null, replyTo:null, view:null, status:'', err:'', chat:[], chatOpen:false, unread:0, beat:null};
const NET_PREFIX = 'pmdx-pe-';
const NET_MAX = 4;

/* ---------- 연결 계층 ---------- */
function loadPeer(){
  if (window.Peer) return Promise.resolve();
  const urls = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
  const one = u => new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = u; s.onload = ()=>res(); s.onerror = ()=>{ s.remove(); rej(); }; document.head.appendChild(s); });
  return one(urls[0]).catch(()=>one(urls[1])).catch(()=>{ throw new Error('연결 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); });
}
// 공통 연결 객체: send(obj), onData(fn), onClose(fn), close()
function wrapPeerConn(c){
  const o = {id:c.peer, _d:null, _c:null, send:x=>{ try { c.send(x); } catch(e){} }, close:()=>{ try { c.close(); } catch(e){} } };
  c.on('data', d=>o._d && o._d(d)); c.on('close', ()=>o._c && o._c()); c.on('error', ()=>o._c && o._c());
  o.onData = f=>o._d = f; o.onClose = f=>o._c = f; return o;
}
const LOCALBUS = {};
// 시험용: 주소에 &lag=300 을 붙이면 같은 브라우저 탭 사이 메시지를 지연시켜 느린 인터넷을 흉내 낸다(순서는 유지, 약간의 흔들림)
function localChannel(code){
  const ch = new BroadcastChannel(NET_PREFIX + code);
  const lag = +((/[?&]lag=(\d+)/.exec(location.search)||[])[1]||0); if (!lag) return ch;
  const post = ch.postMessage.bind(ch); let last = 0;
  ch.postMessage = m => { const t = Math.max(Date.now() + lag + Math.random()*lag*0.5, last + 1); last = t; setTimeout(()=>{ try { post(m); } catch(e){} }, t - Date.now()); };
  return ch;
}
async function netHostOpen(code, onConn){
  if (netLocal()){
    const ch = localChannel(code), me = 'host';
    const conns = {};
    ch.onmessage = e=>{ const m = e.data; if (!m || m.to!==me) return;
      if (m.k==='open'){ const o = {id:m.from, _d:null, _c:null, send:x=>ch.postMessage({to:m.from, from:me, k:'data', d:x}), close:()=>ch.postMessage({to:m.from, from:me, k:'close'})};
        o.onData = f=>o._d = f; o.onClose = f=>o._c = f; conns[m.from] = o; ch.postMessage({to:m.from, from:me, k:'ok'}); onConn(o); }
      else if (m.k==='data'){ const o = conns[m.from]; if (o && o._d) o._d(m.d); }
      else if (m.k==='close'){ const o = conns[m.from]; if (o && o._c) o._c(); delete conns[m.from]; } };
    ch.postMessage({to:'probe', from:me, k:'hi'});
    return {close:()=>{ Object.values(conns).forEach(o=>o.close()); ch.close(); }};
  }
  await loadPeer();
  return new Promise((res, rej)=>{
    const p = new Peer(NET_PREFIX + code);
    p.on('open', ()=>res({close:()=>{ try { p.destroy(); } catch(e){} }}));
    p.on('connection', c=>{ c.on('open', ()=>onConn(wrapPeerConn(c))); });
    p.on('disconnected', ()=>{ setTimeout(()=>{ try { if (!p.destroyed) p.reconnect(); } catch(e){} }, 1000); });   // 앱 전환 등으로 중계 서버와 끊기면 다시 연결
    p.on('error', e=>{ if (e && e.type==='unavailable-id') rej(new Error('ID')); else rej(e); });
  });
}
async function netJoinOpen(code){
  if (netLocal()){
    const ch = localChannel(code), me = 'c' + netRid();
    return new Promise((res, rej)=>{
      const o = {id:'host', _d:null, _c:null, send:x=>{ try { ch.postMessage({to:'host', from:me, k:'data', d:x}); } catch(e){} }, close:()=>{ try { ch.postMessage({to:'host', from:me, k:'close'}); ch.close(); } catch(e){} }};
      o.onData = f=>o._d = f; o.onClose = f=>o._c = f;
      const t = setTimeout(()=>rej(new Error('방을 찾을 수 없습니다. 방 코드를 확인하세요.')), 3000);
      ch.onmessage = e=>{ const m = e.data; if (!m || m.to!==me) return;
        if (m.k==='ok'){ clearTimeout(t); res(o); } else if (m.k==='data'){ if (o._d) o._d(m.d); } else if (m.k==='close'){ if (o._c) o._c(); } };
      window.addEventListener('pagehide', ()=>{ try { ch.postMessage({to:'host', from:me, k:'close'}); } catch(e){} });
      ch.postMessage({to:'host', from:me, k:'open'});
    });
  }
  await loadPeer();
  return new Promise((res, rej)=>{
    const p = new Peer();
    const t = setTimeout(()=>{ try { p.destroy(); } catch(e){} rej(new Error('방을 찾을 수 없습니다. 방 코드를 확인하세요.')); }, 12000);
    p.on('open', ()=>{ const c = p.connect(NET_PREFIX + code, {reliable:true}); c.on('open', ()=>{ clearTimeout(t); const o = wrapPeerConn(c); const cl = o.close; o.close = ()=>{ cl(); try { p.destroy(); } catch(e){} }; res(o); }); });
    p.on('error', e=>{ clearTimeout(t); try { p.destroy(); } catch(_){} rej(new Error(e && e.type==='peer-unavailable' ? '방을 찾을 수 없습니다. 방 코드를 확인하세요.' : '연결하지 못했습니다. 잠시 뒤 다시 시도하세요.')); });
  });
}

/* ---------- 상태 직렬화 (같은 객체를 여러 곳에서 가리키는 관계 유지) ----------
   1.10.0.0: 카드·탐험대원 등 DATA에 있는 내용은 번호(code)만 보내고 달라진 값만 붙인다 (양쪽 DATA가 같으므로 버전 확인 필수) */
let NET_PROTO = null;
function netProto(){
  if (NET_PROTO) return NET_PROTO;
  const byCode = new Map(), ref = new Map(), refK = [];
  ['seekers','skills','delve','masters','trials','exhaust','bossItems'].forEach(set => (DATA[set]||[]).forEach((x,i) => {
    const k = set+':'+i; ref.set(x, k); refK[k] = x;
    if (x.code && !byCode.has(x.code)){ const js = {}; for (const key of Object.keys(x)) js[key] = typeof x[key]==='object' && x[key]!==null ? JSON.stringify(x[key]) : x[key]; byCode.set(x.code, {o:x, js}); }
  }));
  return NET_PROTO = {byCode, ref, refK};
}
function netEncode(root){
  const P = netProto();
  const ids = new Map(), out = [];
  const enc = v => {
    if (v===null || typeof v!=='object') return (typeof v==='function' || v===undefined) ? null : v;
    if (P.ref.has(v)) return {$r:P.ref.get(v)};   // DATA 원본 그대로
    if (ids.has(v)) return {$:ids.get(v)};
    const k = out.length; ids.set(v, k); out.push(null);
    if (v instanceof Set) out[k] = {$set:[...v].map(enc)};
    else if (Array.isArray(v)) out[k] = v.map(enc);
    else {
      const pr = typeof v.code==='string' ? P.byCode.get(v.code) : null;
      const o = pr ? {$p:v.code} : {};
      for (const key of Object.keys(v)) { const x = v[key]; if (typeof x==='function' || x===undefined) continue;
        if (pr && key in pr.js){ const pj = pr.js[key]; if (typeof x==='object' && x!==null ? JSON.stringify(x)===pj : x===pj) continue; }
        o[key] = enc(x); }
      if (pr){ const miss = Object.keys(pr.js).filter(key=>!(key in v)); if (miss.length) o.$x = miss; }
      out[k] = o; }
    return {$:k};
  };
  return {r:enc(root), o:out};
}
function netDecode(p){
  const P = netProto();
  const made = new Array(p.o.length);
  const get = k => { if (made[k]) return made[k]; const n = p.o[k];
    if (n && n.$set){ made[k] = new Set(); n.$set.forEach(x=>made[k].add(dec(x))); return made[k]; }
    if (Array.isArray(n)){ const a = []; made[k] = a; n.forEach(x=>a.push(dec(x))); return a; }
    const o = {}; made[k] = o;
    if (n.$p){ const pr = P.byCode.get(n.$p); if (pr) for (const key of Object.keys(pr.o)){ const x = pr.o[key]; o[key] = typeof x==='object' && x!==null ? JSON.parse(pr.js[key]) : x; } }
    for (const key of Object.keys(n)){ if (key==='$p' || key==='$x') continue; o[key] = dec(n[key]); }
    if (n.$x) n.$x.forEach(key=>delete o[key]);
    return o; };
  const dec = v => { if (!(v && typeof v==='object')) return v; const ks = Object.keys(v); if (ks.length!==1) return v;
    if (ks[0]==='$') return get(v.$); if (ks[0]==='$r') return P.refK[v.$r]; return v; };
  return dec(p.r);
}

    const code = netCode();
    try {

      Object.assign(NET, {on:true, role:'host', pid:'H', code, players:[{pid:'H', nick, on:true, ready:true}], picks:[], status:'', chat:[]});
      netBeatStart(); clearInterval(NET.tmI); NET.tmI = setInterval(tmTick, 250); NET.chatOpen = !document.body.classList.contains('touch'); chatDraw();
      sfx('confirm'); render(); return;
    } catch(e){ if (e && e.message==='ID') continue; NET.status = ''; NET.err = e && e.message ? e.message : '방을 만들지 못했습니다.'; render(); return; }
  }
  NET.status = ''; NET.err = '방을 만들지 못했습니다. 다시 시도하세요.'; render();
}
function netOnJoin(c){
  let pid = null;
  c.seen = Date.now();
  c.onData(m=>{
    c.seen = Date.now();
    if (!m || typeof m!=='object') return;
    if (m.t==='pong') return;
    if (m.t==='chk'){ c.send({t:'pong'}); return; }
    if (m.t==='bye'){ if (c._c) c._c(); return; }
    if (m.t==='hello'){
      const nick = String(m.nick||'').slice(0,10) || '손님';
      if (m.v!==GAME_VER){ c.send({t:'deny', why:`버전이 다릅니다 (방장 ${GAME_VER}, 내 기기 ${m.v||'이전 버전'}). 게임을 완전히 닫았다가 다시 열어 주세요. 방장도 최신 버전인지 확인하세요.`}); setTimeout(()=>c.close(), 300); return; }
      if (nick===NET.nick){ c.send({t:'deny', why:'방장과 같은 닉네임은 쓸 수 없습니다.'}); setTimeout(()=>c.close(), 300); return; }
      if (NET.kicked && NET.kicked[nick]){ c.send({t:'deny', why:'강퇴된 닉네임은 이 방에 다시 들어올 수 없습니다.'}); setTimeout(()=>c.close(), 300); return; }
      const old = NET.players.find(p=>p.nick===nick && p.pid!=='H');   // 같은 닉네임으로 다시 들어오면 자리 그대로 (이전 연결은 끊음)
      if (old && NET.conns[old.pid] && NET.conns[old.pid]!==c){ const oc = NET.conns[old.pid]; delete NET.conns[old.pid]; oc._c = null; try { oc.close(); } catch(e){} }
      if (!old && NET.players.filter(p=>p.on).length >= NET_MAX){ c.send({t:'deny', why:'방이 가득 찼습니다 (최대 4명).'}); setTimeout(()=>c.close(), 300); return; }
      if (!old && S){ c.send({t:'deny', why:'이미 게임이 시작된 방입니다.'}); setTimeout(()=>c.close(), 300); return; }
      pid = old ? old.pid : 'P' + netRid(); if (old){ old.on = true; old.ready = false; } else NET.players.push({pid, nick, on:true, ready:false});
      NET.conns[pid] = c; c.send({t:'welcome', pid}); c.send({t:'chatlog', list:NET.chat.slice(-30)});
      if (S){ S.net.players = NET.players; c.send({t:'start', resume:true}); netSendState(true); toast(`${nick} 님이 다시 들어왔습니다.`); netChatSys(`${nick} 님이 다시 들어왔습니다.`); }
      else { toast(`${nick} 님이 들어왔습니다.`); netChatSys(`${nick} 님이 들어왔습니다.`); }
      lobbyBroadcast(); return;
    }
    if (!pid) return;
    if (m.t==='pick'){ netTogglePick(pid, m.id); return; }
    if (m.t==='ready'){ netSetReady(pid, !!m.v); return; }
    if (m.t==='chat'){ netChatPost(pid, m.m); return; }
    if (m.t==='call'){ netHostCall(pid, m.fn, m.args||[], m.v); return; }
    if (m.t==='mres'){ const w = NET.wait[m.id]; if (w){ delete NET.wait[m.id]; w(m.v); } return; }
  });
  c.onClose(()=>{ c._c = null; if (!pid || NET.conns[pid]!==c) return; const p = NET.players.find(x=>x.pid===pid); delete NET.conns[pid];
    if (p){ p.on = false; p.ready = false; toast(`${p.nick} 님의 연결이 끊겼습니다.`); netChatSys(`${p.nick} 님의 연결이 끊겼습니다.`); }
    if (!S){ NET.players = NET.players.filter(x=>x.pid!==pid); NET.picks = NET.picks.filter(x=>x.pid!==pid); }
    else { S.net.players = NET.players; netSendState(true); Object.keys(NET.wait).forEach(k=>{ const w = NET.wait[k]; if (w && w.pid===pid){ delete NET.wait[k]; w(w.dflt); } }); }
    lobbyBroadcast(); });
}
async function netJoin(auto){
  const nick = auto ? auto.nick : netReadNick(); if (!nick) return;
  if (auto) NET.nick = nick;
  const inp = document.getElementById('lbCode'); const code = auto ? auto.code : (inp ? inp.value : '').trim().toUpperCase();

  NET.status = auto ? `방 ${code}에 다시 들어가는 중…` : '방에 들어가는 중…'; NET.err = ''; if (!S) render();
  try {
    const c = await netJoinOpen(code);
    Object.assign(NET, {on:true, role:'client', code, link:c, status:''});
    NET.chat = []; NET.hostSeen = Date.now(); netBeatStart(); NET.chatOpen = !document.body.classList.contains('touch'); chatDraw();
    c.onData(m=>{ if (NET.link!==c) return; NET.hostSeen = Date.now(); netClientData(m); });   // 끊긴 옛 연결에서 늦게 온 메시지는 무시
    c.onClose(()=>{ if (NET.role!=='client' || NET.link!==c) return; const inGame = !!S; try { c.close(); } catch(e){} netReset();
      if (inGame && netRejoinSoon(true)){ NET.recon = true; reconDraw(); return; }   // 게임 화면은 그대로 두고 다시 연결
      S = null; SETUP.screen = 'lobby'; NET.err = '방장과 연결이 끊겼습니다.'; render(); if (inGame) toast('방장과 연결이 끊겼습니다.'); netRejoinSoon(); });
    c.send({t:'hello', nick, v:GAME_VER});
  } catch(e){ NET.status = ''; NET.err = e && e.message ? e.message : '연결하지 못했습니다.';
    if (auto && !netRejoinSoon()){ NET.err = '이전 방에 다시 들어가지 못했습니다. ' + NET.err; if (NET.recon){ NET.recon = false; S = null; SETUP.screen = 'lobby'; toast('방장과 연결이 끊겼습니다.'); } }
    reconDraw(); render(); }
}
function netReadNick(){
  const inp = document.getElementById('lbNick'); const v = (inp ? inp.value : NET.nick).trim().slice(0,10);
  if (!v){ NET.err = '닉네임을 입력하세요.'; render(); return ''; }

}
function netTogglePick(pid, id){
  if (S || !DATA.seekers.some(d=>d.id===id)) return;
  const k = NET.picks.findIndex(x=>x.id===id);
  if (k>=0){ if (NET.picks[k].pid===pid) NET.picks.splice(k,1); else return; }
  else if (NET.picks.length < 4) NET.picks.push({id, pid}); else return;
  const pl = NET.players.find(p=>p.pid===pid); if (pl && pid!=='H') pl.ready = false;   // 고른 것이 바뀌면 준비 해제
  lobbyBroadcast();
}
function netClientData(m){
  if (!m || typeof m!=='object') return;
  if (m.t==='welcome'){ NET.pid = m.pid; NET.rejoinN = 0; roomSave({code:NET.code, nick:NET.nick}); return; }
  if (m.t==='ping'){ NET.link.send({t:'pong'}); roomTouch(); return; }
  if (m.t==='pong') return;
  if (m.t==='hostgone'){ const f = NET.link && NET.link._c; if (f){ NET.link._c = null; f(); } return; }   // 방장이 잠시 나감: 게임 화면을 둔 채 다시 연결 시도
  if (m.t==='chat'){ chatAdd(m.c); return; }
  if (m.t==='chatlog'){ NET.chat = m.list || []; chatDraw(); return; }
  if (m.t==='deny'){ roomSave(null); NET.recon = false; reconDraw(); const why = m.why, inGame = !!S; netLeave(true); S = null; SETUP.screen = 'lobby'; NET.err = why; render(); if (inGame) toast(why); return; }
  if (m.t==='lobby'){ NET.players = m.players; NET.picks = m.picks; NET.tl = m.tl!==false; if (m.opt) Object.assign(SETUP, m.opt); if (!S) render(); return; }
  if (m.t==='tm'){ NET.tmv = m.v; tmDraw(); return; }
  if (m.t==='mclose'){ const el = NET.dlgEl && NET.dlgEl[m.id]; if (el && el.parentNode) el.remove(); return; }
  if (m.t==='start'){ NET.snap = null; NET.chatOpen = false; chatDraw(); if (m.resume) return; NET.introWait = true; return; }   // 첫 화면 상태가 오면 시작 연출
  if (m.t==='S'){ if (NET.recon){ NET.recon = false; reconDraw(); } netApply(m.j!=null ? JSON.parse(m.j) : m.d); return; }
  if (m.t==='reset'){ S = null; NET.snap = null; SETUP.screen = 'lobby'; render(); return; }
  if (m.t==='sfx'){ sfx(m.n); return; }
  if (m.t==='feed'){ feedShow(m.m, m.cls); return; }
  if (m.t==='fx'){ const f = NET_FXO[m.fn]; if (!f || !S) return; let a = m.args || [];
    if (m.fn==='itemFx') a = [S.seekers[a[0]]];
    NET.mute = true; try { f.apply(null, a); } finally { NET.mute = false; } if (m.fn==='blockFx') render(); return; }
  if (m.t==='toast'){ toast(m.m); return; }
  if (m.t==='modal' || m.t==='pick'){ const f = m.t==='modal' ? MODAL0 : PICK0;
    f(m.o).then(v=>{ if (m.id) NET.link.send({t:'mres', id:m.id, v}); });
    if (m.id){ NET.dlgEl = NET.dlgEl || {}; NET.dlgEl[m.id] = topModal(); }
    if (!m.id) netInfoAutoClose(); return; }
}
