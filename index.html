function netHostStart(){
  if (NET.role!=='host' || !NET.picks.length){ toast('탐험대원을 1마리 이상 고르세요.'); return; }
  const notReady = NET.players.filter(p=>p.on && p.pid!=='H' && !p.ready);
  if (notReady.length){ toast(`아직 준비하지 않은 사람이 있습니다: ${notReady.map(p=>p.nick).join(', ')}`); return; }
  SETUP.sel = NET.picks.map(x=>x.id);
  NET.owner = NET.picks.map(x=>x.pid);
  Object.values(NET.conns).forEach(c=>c.send({t:'start'}));
  NET.chatOpen = false; chatDraw();
  startGame();
}
/* ---------- 방장 이어하기: 방장이 새로고침하거나 앱을 닫았다 열어도 같은 방으로 게임을 이어 감 ---------- */
const HOST_KEEP = 30*60*1000;
function hostSave(j){
  if (NET.role!=='host' || !S || !S.net) return;
  if (over()){ hostClear(); return; }
  if (S.busy || INTRO || topModal() || Object.keys(NET.wait||{}).length) return;   // 선택 창·연출이 없는 안정된 상태만 저장
  if (!j) j = JSON.stringify(netEncode(Object.assign({}, S, {log:S.log.slice(0, 80)})));
  try { localStorage.setItem('pmd_host', JSON.stringify({v:GAME_VER, t:Date.now(), code:NET.code, nick:NET.nick, uid:UID, owner:S.net.owner, tl:NET.tl!==false, kicked:NET.kicked||{},
    players:NET.players.map(p=>({pid:p.pid, nick:p.nick})), chat:NET.chat.slice(-30), setup:{hard:!!SETUP.hard, quick:!!SETUP.quick, boss:SETUP.boss||'random', autoEnd:SETUP.autoEnd!==false}, j})); } catch(e){}
}
function hostLoad(){ try { const h = JSON.parse(localStorage.getItem('pmd_host')||'null'); return h && h.v===GAME_VER && h.j && Date.now() - h.t < HOST_KEEP ? h : null; } catch(e){ return null; } }
function hostClear(){ try { localStorage.removeItem('pmd_host'); } catch(e){} }
async function netHostResume(h){
  SETUP.screen = 'lobby'; NET.nick = h.nick; NET.err = '';
  for (let k=1; k<=10; k++){
    NET.status = `이전 게임(방 ${h.code})을 다시 여는 중… (${k}번째 시도)`; render();
    try {
      NET.link = await netHostOpen(h.code, netOnJoin);
      Object.assign(NET, {on:true, role:'host', pid:'H', code:h.code, players:h.players.map(p=>({pid:p.pid, nick:p.nick, on:p.pid==='H', ready:true})), picks:[], status:'', chat:h.chat||[], kicked:h.kicked||{}});
      NET.owner = h.owner; NET.tl = h.tl; Object.assign(SETUP, h.setup);
      S = netDecode(JSON.parse(h.j)); UID = Math.max(UID, h.uid||0);
      S.busy = false; if (S.A){ S.A.rolling = false; S.A.rrAnim = null; S.A.gating = false; }
      S.net = {owner:NET.owner, players:NET.players, tl:NET.tl, afk:{}}; S.view = S.cur; S.hideOver = false; LASTTURN = S.turnNo;
      netBeatStart(); clearInterval(NET.tmI); NET.tmI = setInterval(tmTick, 250); chatDraw();
      log('방장이 다시 들어와 게임을 이어 갑니다.', 'sys'); netChatSys('방장이 다시 들어왔습니다. 참가자는 자동으로 다시 들어옵니다.');
      sfx('confirm'); render(); return;
    } catch(e){ await new Promise(r=>setTimeout(r, 2000)); }   // 이전 연결의 방 코드가 풀릴 때까지 잠시 기다림
  }
  hostClear(); NET.status = ''; NET.err = '이전 게임 방을 다시 열지 못했습니다.'; render();
}
function netClientStart(){ startGame(()=>{ if (NET.snap) netApply(NET.snap, true); }); }

/* ---------- 상태 보내기 · 받기 ---------- */
function netSendState(now){
  if (NET.role!=='host' || !S) return;
  if (!S.net){ S.net = {owner:NET.owner, players:NET.players, tl:NET.tl!==false, afk:{}}; }
  const go = ()=>{ NET.sendT = null; if (!S) return;
    const j = JSON.stringify(netEncode(Array.isArray(S.log) && S.log.length > 80 ? Object.assign({}, S, {log:S.log.slice(0, 80)}) : S));   // 한 번만 만들어 모두에게 보냄
    Object.values(NET.conns).forEach(c=>{ if (c._lastS===j) return; c._lastS = j; c.send({t:'S', j}); });   // 바뀐 것이 있을 때만
    hostSave(j); };
  if (now){ clearTimeout(NET.sendT); go(); return; }
  if (!NET.sendT) NET.sendT = setTimeout(go, 100);
}
function netApply(d, force){
  NET.snap = d;
  if (NET.introWait && !force){ NET.introWait = false; startGame(()=>netApply(NET.snap, true)); return; }
  if (INTRO && !force){ const n = netDecode(d); n.view = S ? S.view : n.view; S = n; return; }   // 연출 중에는 다시 그리지 않음 (끝나면 그림)
  const old = S, n = netDecode(d);
  const mine = n.net ? n.net.owner.map((p,i)=>p===NET.pid?i:-1).filter(i=>i>=0) : [];
  const keep = old && old.cur===n.cur && (old.A ? old.A.step : 0)===(n.A ? n.A.step : 0);
  if (keep) n.view = old.view;
  else n.view = (n.net && n.net.owner[n.cur]===NET.pid) ? n.cur : (mine.length ? mine[0] : n.cur);   // 내 차례가 아니면 내 탐험대원의 패
  if (old && old.hideOver) n.hideOver = true;
  S = n; render();
}

/* ---------- 방장 쪽: 참가자 조작 실행 ---------- */
const NET_FNS = ['onSlotClick','onHandClick','clickHand','executeSel','goBack','primary','doExhaust','confirmAction','skipAction','confirmBoost','skipBoost',
  'rollDice','reroll','resolveAttempt','endTurn','useItem','useShow','useReact','useBerry','aeHoldNow','netReqBoost','netNoBoost','netKick','netBoostDone','netDropBoost'];
const NET_ORIG = {};
function cardOwnerSeeker(u){ u = +u; for (const s of S.seekers) if (s.hand.some(c=>c.uid===u)) return s.i; return -1; }
function netPermit(pid, fn, args){
  if (!S) return false;
  const actor = ownerPid(S.cur);
  if (['onHandClick','clickHand'].includes(fn) && S.A && S.A.step===2){ const i = cardOwnerSeeker(args[0]); return i>=0 && (ownerPid(i)===pid); }
  if (fn==='netNoBoost' || fn==='netBoostDone') return pid!==actor && S.net.owner.includes(pid);
  if (fn==='netKick'){ const t = args[0]; return !!(S.net.afk && S.net.afk[t]) && t!=='H' && t!==pid && S.net.players.some(p=>p.pid===pid); }
  if (fn==='useItem'){ return ownerPid(+args[0])===pid; }
  if (['useShow','useReact','useBerry'].includes(fn)){ const i = cardOwnerSeeker(args[0]); return i>=0 && ownerPid(i)===pid; }
  return actor===pid;
}
function netDenyMsg(fn){
  if (S && S.A && S.A.step===2 && ['onHandClick','clickHand'].includes(fn)) return '자기 탐험대원의 카드로만 향상할 수 있습니다.';
  return `지금은 ${nickOf(ownerPid(S.cur))} 님의 차례입니다.`;
}
// 진행 단계를 바꾸는 조작은 참가자가 본 화면 상태(차례·단계)가 지금과 같을 때만 실행한다.
// 인터넷이 느릴 때 연타가 늦게 도착해 다음 단계·다음 차례에 잘못 적용되는 것을 막는다.
const NET_FLOW = ['onSlotClick','executeSel','goBack','primary','confirmAction','skipAction','confirmBoost','skipBoost','rollDice','resolveAttempt','endTurn','aeHoldNow','doExhaust','useItem'];
function netStateKey(){ return S ? `${S.turnNo}:${S.A ? S.A.step + (S.A.dice ? 'd' : '') : 0}:${S.T.acted ? 1 : 0}:${S.selSlot==null ? '' : S.selSlot}` : ''; }
async function netHostCall(pid, fn, args, v){
  if (!NET_FNS.includes(fn) || !NET_ORIG[fn]) return;
  if (!S || over() || INTRO) return;
  if (v!=null && NET_FLOW.includes(fn) && v!==netStateKey()) return;   // 늦게 도착한 조작은 버림
  if (!netPermit(pid, fn, args)){ netToast(pid, netDenyMsg(fn)); return; }
  if (NET.autoRun && pid===ownerPid(S.cur) && fn!=='netKick'){ netToast(pid, '시간이 다 되어 자동으로 진행하는 중입니다.'); return; }
  if (S.busy && !['useShow','useReact','netKick'].includes(fn)) return;
  if (S.net.afk && S.net.afk[pid] && !NET.autoRun) delete S.net.afk[pid];   // 다시 조작하면 강퇴 대상에서 빠짐
  NET.replyTo = pid;
  const bt = (['onHandClick','clickHand'].includes(fn) && S.A && S.A.step===2) ? S.A.selBoost.slice() : null;
  try { const r = NET_ORIG[fn].apply(null, args); NET.replyTo = null; if (r && r.then) await r;
    if (bt && S.A && S.A.step===2){ const u = +args[0], on = S.A.selBoost.includes(u), was = bt.includes(u), c = findSkill(u);
      if (c && on!==was){ if (S.A.net && S.A.net.no) delete S.A.net.no[pid]; if (S.A.net && S.A.net.done) delete S.A.net.done[pid]; netFeed(`${nickOf(pid)}: 향상 「${c.name}」 ${on?'+'+boostValue(c)+' 골랐음':'취소'}`, on?'good':'', pid); } } }
  finally { NET.replyTo = null; render(); }
}
function netToast(pid, m){ if (pid==='H') toastLocal(m); else { const c = NET.conns[pid]; if (c) c.send({t:'toast', m}); } }

/* ---------- 창(선택지) 보내기 ---------- */
function netDecider(){ return NET.decider || ownerPid(S.cur); }
function netRemoteDialog(kind, o, dflt){
  const pid = netDecider(); const c = NET.conns[pid];
  if (!c) return null;
  const id = netRid();
  return new Promise(res=>{ const w = v=>res(v); w.pid = pid; w.dflt = dflt; NET.wait[id] = w; c.send({t:kind, id, o}); });
}

/* ---------- 조작 함수 감싸기 ---------- */
function netInstall(){
  window.MODAL0 = modal; window.PICK0 = pickModal;
  window.modal = function(o){
    if (NET.role==='host' && S && S.net && !netLocalDialog){
      const info = !(o.buttons && o.buttons.length > 1);
      const pid = netDecider();
      if (info){ Object.entries(NET.conns).forEach(([p,c])=>{ if (p!==pid) c.send({t:'modal', o}); }); }
      if (pid!=='H'){ if (info){ MODAL0(o); netInfoAutoClose(); } const r = netRemoteDialog('modal', o, (o.buttons||[]).find(b=>b.primary) ? (o.buttons.find(b=>b.primary)).value : undefined); if (r) return r; }
      else if (!info){ NET.hostDlg = (NET.hostDlg||0) + 1; return MODAL0(o).finally(()=>{ NET.hostDlg--; }); }
    }
    return MODAL0(o);
  };
  window.pickModal = function(o){
    if (NET.role==='host' && S && S.net && netDecider()!=='H'){
      const r = netRemoteDialog('pick', o, o.items && o.items.length ? [o.items[0].v] : []); if (r) return r;
    }
    if (NET.role==='host' && S && S.net){ NET.hostDlg = (NET.hostDlg||0) + 1; return PICK0(o).finally(()=>{ NET.hostDlg--; }); }
    return PICK0(o);
  };
  for (const fn of NET_FNS){
    const orig = window[fn]; if (typeof orig!=='function') continue;
    NET_ORIG[fn] = orig;
    window[fn] = function(...args){
      if (NET.recon){ NET.ui = false; return; }   // 다시 연결하는 동안에는 조작하지 않음
      if (!NET.on || !S || !S.net) return orig.apply(this, args);
      if (NET.role==='client'){ if (NET.ui){ NET.ui = false; NET.link.send({t:'call', fn, args, v:netStateKey()}); } return; }
      if (NET.ui){ NET.ui = false; if (!netPermit('H', fn, args)){ toastLocal(netDenyMsg(fn)); return; } if (NET.autoRun && ownerPid(S.cur)==='H' && fn!=='netKick'){ toastLocal('시간이 다 되어 자동으로 진행하는 중입니다.'); return; } }
      return orig.apply(this, args);
    };
  }
  { const cd = window.chooseDiscard; if (typeof cd==='function') window.chooseDiscard = async function(s, ...rest){   // 다른 탐험대원의 카드를 버릴 때는 그 주인이 고른다
      if (NET.role!=='host' || !S || !S.net || !s) return cd.call(this, s, ...rest);
      const prev = NET.decider; NET.decider = ownerPid(s.i); try { return await cd.call(this, s, ...rest); } finally { NET.decider = prev; } }; }
  window.pickModal = (pm => function(o){ return pm(o); })(window.pickModal);
  { const lg = window.log; window.log = function(msg, cls){ lg(msg, cls);   // 다른 사람이 한 일은 화면 왼쪽 위 알림으로도 보여 준다
      if (NET.role==='host' && S && S.net){ const o = NET.replyTo || ownerPid(S.cur); netFeed(String(msg), cls||'', o); } }; }
  for (const fn of NET_FX){ const f = window[fn]; if (typeof f!=='function') continue; NET_FXO[fn] = f;
    window[fn] = function(...a){ if (NET.role==='host' && S && S.net){ const sa = fn==='itemFx' ? [a[0] && a[0].i] : a; Object.values(NET.conns).forEach(c=>c.send({t:'fx', fn, args:sa})); } return f.apply(this, a); }; }
  window.toastLocal = toast;
  window.toast = function(m){ if (NET.role==='host' && NET.replyTo && NET.replyTo!=='H'){ netToast(NET.replyTo, m); return; } toastLocal(m); };
  const sfx0 = window.sfx;
  window.sfx = function(n){ if (NET.mute) return; sfx0(n); if (NET.role==='host' && S && S.net && n!=='turn' && !NET.ui && !INTRO) Object.values(NET.conns).forEach(c=>c.send({t:'sfx', n})); };
  ['click','keydown','contextmenu','touchend'].forEach(ev=>document.addEventListener(ev, ()=>{ NET.ui = true; setTimeout(()=>{ NET.ui = false; }, 0); }, true));
}

function netAct(a, el){

function chatDraw(){
  let el = document.getElementById('chat');
  if (!NET.on){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id = 'chat'; document.body.appendChild(el);
    el.innerHTML = `<div class="chd"><button class="chtog" data-chat="tog"></button></div><div class="chbody"><div class="chlist"></div>
      <div class="chq">${CHAT_QUICK.map(q=>`<button data-chat="q" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <div class="chin"><input id="chatIn" maxlength="80" placeholder="메시지 입력 후 Enter" autocomplete="off"><button data-chat="send">보내기</button></div></div>`;
    el.addEventListener('click', e=>{ e.stopPropagation(); const b = e.target.closest('[data-chat]'); if (!b) return;
      if (b.dataset.chat==='tog'){ NET.chatOpen = !NET.chatOpen; if (NET.chatOpen) NET.unread = 0; chatDraw(); if (NET.chatOpen) setTimeout(()=>{ const i = document.getElementById('chatIn'); if (i && !document.body.classList.contains('touch')) i.focus(); }, 50); }
      else if (b.dataset.chat==='q') chatSend(b.dataset.q);
      else if (b.dataset.chat==='send'){ const i = document.getElementById('chatIn'); chatSend(i.value); i.value = ''; } }, true);
    el.addEventListener('keydown', e=>{ e.stopPropagation(); if (e.key==='Enter' && e.target.id==='chatIn'){ chatSend(e.target.value); e.target.value = ''; } else if (e.key==='Escape'){ e.target.blur(); } }, true);
    ['contextmenu','mousedown','touchstart','touchend'].forEach(ev=>el.addEventListener(ev, e=>e.stopPropagation()));
  }
  el.classList.toggle('open', !!NET.chatOpen);
  el.querySelector('.chtog').textContent = NET.chatOpen ? '채팅 닫기 ▾' : `채팅${NET.unread?` (${NET.unread})`:''} ▴`;
  const list = el.querySelector('.chlist'); const at = list.scrollTop + list.clientHeight >= list.scrollHeight - 4;
  list.innerHTML = (NET.chat||[]).map(chatLine).join('') || '<div class="cl sys">아직 메시지가 없습니다.</div>';
  if (at || NET.chatOpen) list.scrollTop = list.scrollHeight;
}

// 다른 사람의 안내 창(보기 전용)은 5초 뒤 저절로 닫혀서 내 조작을 막지 않는다
function netInfoAutoClose(){ const el = topModal(); if (!el) return; setTimeout(()=>{ if (el.parentNode) el.remove(); }, 5000); }

/* ---------- 차례 시간 제한 (방장이 재고 모두에게 알림) ---------- */
// 차례당 75초. 다른 사람을 기다리는 동안(동료 향상 단계, 다른 사람의 선택 창)은 차례마다 30초까지 시간이 줄지 않는다.
// 시간이 다 되면 남은 단계를 기본값으로 진행하고 차례를 넘긴다. 시간을 넘긴 참가자는 다른 사람이 강퇴하고 대신 조작할 수 있다.
var TL_MS = 75000, TL_FUSE = 15000, TL_GRACE = 30000;   // var: 시험할 때 바꿀 수 있게
function tlActive(){ return netOn() && S.net.tl && new Set(S.net.owner).size >= 2; }
function tmWaiting(){
  const actor = ownerPid(S.cur);
  if (S.A && S.A.step===2 && netBoostPending().length) return true;
  if (S.A && S.A.step===3) return true;   // 주사위 단계: 대기 시간처럼 취급(차례마다 30초까지 시간이 줄지 않음)
  if (Object.values(NET.wait).some(w=>w.pid!==actor)) return true;
  return actor!=='H' && NET.hostDlg > 0;
}
function tmTick(){
  if (NET.role!=='host') return;
  if (!S || !tlActive() || over() || INTRO){ NET.tm = null; tmSend(); return; }
  const now = Date.now(); let T = NET.tm;
  if (!T || T.key!==S.turnNo) T = NET.tm = {key:S.turnNo, used:0, grace:0, last:now, out:false, wait:false};
  const dt = Math.min(1000, now - T.last); T.last = now;
  if (!T.out){
    T.wait = tmWaiting() && T.grace < TL_GRACE;
    const anim = S.busy || (S.A && (S.A.rolling || S.A.rrAnim!=null));
    if (anim){ T.wait = true; } else if (T.wait) T.grace += dt; else T.used += dt;   // 주사위 굴림·효과 처리 연출 중에는 시간이 흐르지 않음
    if (T.used >= TL_MS){ T.out = true; T.wait = false; netTimeout(); }
  }
  tmSend();
}
function tmSend(){
  const T = NET.tm, v = T ? {k:T.key, l:Math.max(0, TL_MS - T.used), w:T.wait?1:0, o:T.out?1:0} : null;
  const sig = v ? `${v.k}:${Math.ceil(v.l/1000)}:${v.w}:${v.o}` : '';
  if (sig===NET.tmSig) return; NET.tmSig = sig; NET.tmv = v;
  Object.values(NET.conns).forEach(c=>c.send({t:'tm', v})); tmDraw();
}
const tmCur = () => { const v = NET.tmv; return v && S && v.k===S.turnNo ? v : null; };
function tmNumHTML(){ return '<b id="ntm" class="ntm off"></b>'; }
function tmFuseHTML(){ const v = tmCur(), on = v && !v.o && v.l<=TL_FUSE; return `<div class="nfuse ${on?'on':''} ${v&&v.w?'wait':''}"><i style="width:${on?(v.l/TL_FUSE*100).toFixed(1):100}%"></i></div>`; }
function tmDraw(){
  const v = tmCur(), sec = v ? Math.ceil(v.l/1000) : 0;
  const el = document.getElementById('ntm');
  if (el){ el.textContent = v ? (v.o ? '시간 초과' : `${sec}초`) : ''; el.className = 'ntm' + (v ? '' : ' off') + (v && (v.o || v.l<=TL_FUSE) ? ' warn' : '') + (v && v.w ? ' wait' : '');
    el.title = v && v.w ? '다른 사람을 기다리는 동안은 시간이 줄지 않습니다 (차례마다 최대 30초)' : '남은 차례 시간'; }
  const fu = document.querySelector('.guide .nfuse');
  if (fu){ const on = !!(v && !v.o && v.l<=TL_FUSE); fu.classList.toggle('on', on); fu.classList.toggle('wait', !!(v && v.w)); const i = fu.firstElementChild; if (i && on) i.style.width = (v.l/TL_FUSE*100).toFixed(1) + '%'; }
  if (v && !v.o && !v.w && v.l<=TL_FUSE && v.l>0){ const key = v.k + ':' + sec; if (key!==NET.tickK){ NET.tickK = key; if (!window.__noFx) SND.play('tick'); } }
}
// 시간 초과: 차례 주인의 창은 기본값으로 닫고, 남은 단계를 순서대로 진행한 뒤 차례를 넘긴다
function tmAutoDlg(actor){
  Object.entries(NET.wait).forEach(([id, w])=>{ if (w.pid!==actor) return; delete NET.wait[id]; const c = NET.conns[actor]; if (c) c.send({t:'mclose', id}); w(w.dflt); });
  if (actor!=='H') return;
  const el = topModal(); if (!el) return;
  const sk = el.querySelector('[data-x="skip"]'); if (sk){ sk.click(); return; }
  if (el.querySelector('[data-pick]')){ for (let k=0; k<9 && el.parentNode; k++) el._num(k); if (el.parentNode) el._enter(); return; }
  const n = el.querySelectorAll('[data-mb]').length;
  if (el.querySelector('button.primary') || n===1) el._enter(); else if (n) el._cancel();
}
async function netTimeout(){
  const actor = ownerPid(S.cur), key = S.turnNo, nm = nickOf(actor);
  if (actor!=='H'){ S.net.afk = S.net.afk || {}; S.net.afk[actor] = true; }
  netChatSys(`${nm} 님의 차례 시간이 다 되어 자동으로 진행합니다.`);
  netFeed(`${nm}: 시간 초과, 자동 진행`, 'bad', null);
  const call = (fn, ...a) => { const f = NET_ORIG[fn] || window[fn]; try { const r = f.apply(null, a); if (r && r.catch) r.catch(()=>{}); } catch(e){} };
  NET.autoRun = true; render();
  try {
    const S0 = S;
    while (S===S0 && NET.on && !over() && S.turnNo===key){
      tmAutoDlg(ownerPid(S.cur));
      if (!S.busy && (ownerPid(S.cur)!=='H' || !topModal())){
        const A = S.A;
        if (!A){ S.selSlot = null; call('endTurn'); }
        else if (A.step===1) call('skipAction');
        else if (A.step===2) call('confirmBoost');
        else if (A.step===3){ if (!A.dice) call('rollDice'); else if (!A.rolling && A.rrAnim==null) call('resolveAttempt'); }
        else call('endTurn');
      }
      await sleep(400);
    }
  } finally { NET.autoRun = false; if (S) render(); }
}
// 강퇴: 시간을 넘긴 참가자를 내보내고, 그 탐험대원을 누른 사람이 맡는다
function netKick(t){
  if (!netOn() || !S.net.afk || !S.net.afk[t] || t==='H') return;
  const by = NET.replyTo || 'H', tp = S.net.players.find(p=>p.pid===t); if (!tp || by===t) return;
  const names = []; S.net.owner.forEach((p,i)=>{ if (p===t){ S.net.owner[i] = by; names.push(S.seekers[i].def.name); } });
  delete S.net.afk[t]; tp.on = false; tp.kicked = true; NET.kicked = NET.kicked || {}; NET.kicked[tp.nick] = true;
  Object.keys(NET.wait).forEach(k=>{ const w = NET.wait[k]; if (w && w.pid===t){ delete NET.wait[k]; w(w.dflt); } });
  const c = NET.conns[t]; if (c){ delete NET.conns[t]; c._c = null; c.send({t:'deny', why:'차례 시간을 넘겨 강퇴되었습니다.'}); setTimeout(()=>{ try { c.close(); } catch(e){} }, 300); }
  const m = `${nickOf(by)} 님이 ${tp.nick} 님을 강퇴했습니다.${names.length?` 이제 ${nickOf(by)} 님이 조작: ${names.join(', ')}`:''}`;
  netChatSys(m); netFeed(m, 'bad', null); sfx('cancel'); render(); netSendState(true);
}

/* ---------- 초대 링크 · 자동 재접속 ---------- */
// 참가자는 들어간 방을 기억해 두었다가, 새로고침하거나 앱을 잠깐 나갔다 와서 끊기면 같은 닉네임으로 다시 들어간다(자리 그대로 이어짐).
const ROOM_KEEP = 30*60*1000;
function roomLoad(){ try { const r = JSON.parse(localStorage.getItem('pmd_room')||'null'); return r && Date.now() - r.t < ROOM_KEEP ? r : null; } catch(e){ return null; } }
function roomSave(r){ try { if (r) localStorage.setItem('pmd_room', JSON.stringify(Object.assign({t:Date.now()}, r))); else localStorage.removeItem('pmd_room'); } catch(e){} }
function roomTouch(){ const now = Date.now(); if (now - (NET.touchT||0) < 20000) return; NET.touchT = now; const r = roomLoad(); if (r) roomSave({code:r.code, nick:r.nick}); }
function netRejoinSoon(inGame){
  const r = roomLoad(); if (!r) return false;
  const max = (inGame || NET.recon) ? 20 : 6;   // 게임 중에는 약 2분 반 동안 다시 시도
  NET.rejoinN = (NET.rejoinN||0) + 1; if (NET.rejoinN > max){ NET.rejoinN = 0; roomSave(null); return false; }
  clearTimeout(NET.rejoinT);
  const go = ()=>{ if (NET.on) return; if (document.hidden){ NET.rejoinWait = true; return; } NET.rejoinWait = false; netJoin(r); };
  NET.rejoinT = setTimeout(go, Math.min(8000, 1200 * NET.rejoinN));
  NET.status = `방 ${r.code}에 다시 들어가는 중… (${NET.rejoinN}번째 시도)`; reconDraw(); return true;
}
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) return;
  if (NET.rejoinWait && !NET.on){ const r = roomLoad(); NET.rejoinWait = false; if (r) netJoin(r); }
  if (NET.role==='client' && NET.link){   // 화면이 다시 켜지면 방장에게 확인 신호를 보내고, 3초 안에 답이 없으면 바로 다시 연결
    const c = NET.link, t0 = Date.now(); c.send({t:'chk'});
    setTimeout(()=>{ if (NET.link===c && (NET.hostSeen||0) < t0 && c._c){ const f = c._c; c._c = null; f(); } }, 3000);
  }
  if (NET.role==='host'){ const now = Date.now(); Object.values(NET.conns).forEach(c=>{ c.seen = now; c.send({t:'ping'}); }); if (S) netSendState(true); }   // 방장이 돌아오면 끊김 판정을 새로 시작하고 화면 상태를 다시 보냄
});
function reconDraw(){   // 다시 연결하는 동안 게임 화면 위에 덮는 안내 (조작 막음)
  let el = document.getElementById('recon');
  if (!NET.recon){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id = 'recon'; document.body.appendChild(el);
    el.addEventListener('click', e=>{ if (e.target.closest('[data-recon-leave]')){ clearTimeout(NET.rejoinT); roomSave(null); NET.recon = false; NET.rejoinN = 0; netLeave(true); S = null; SETUP.screen = 'lobby'; reconDraw(); render(); } }); }
  el.innerHTML = `<div class="rcbox"><b>연결이 끊겨 다시 연결하는 중…</b><span>${esc(NET.status||'')}</span><button data-recon-leave>로비로 나가기</button></div>`;
}
function netBoot(){
  const q = new URLSearchParams(location.search), room = (q.get('room')||'').trim().toUpperCase();
  if (/^[A-Z0-9]{4}$/.test(room)){
    try { q.delete('room'); const rest = q.toString(); history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash); } catch(e){}
    NET.inviteCode = room; SETUP.screen = 'lobby';
    NET.status = `초대받은 방: ${room}. 닉네임을 확인하고 「참가」를 누르세요.`; render(); return;
  }
  const h = hostLoad(); if (h){ netHostResume(h); return; }
  const r = roomLoad();
  if (r){ SETUP.screen = 'lobby'; NET.inviteCode = r.code; render(); netJoin(r); }
}

function boostCap(A){

function passives(s, k){ const t = topCard(s); return t && t.topRules ? parseRules(t.topRules).filter(r=>r.k===k).map(r=>({...r, src:t.name})) : []; }
function tagOrColor(f, c){ if (!f) return true; return f.split('|').some(p => COL[p] ? cols(c.colors).includes(p) : (c.tag===p || c.ctype===p)); }
function boostBreak(c){
  const o = S.seekers[c.owner]; let v = +c.boost||0; const notes = [];
  const forOther = c.owner!==S.cur;
  if (o.def.hook==='boostBonus' && c.tag==='페어리' && forOther){ v += 1; notes.push(`${o.def.ability_name} +1`); }
  if (c.boostVs && S.A && S.A.card){ const [t, n] = c.boostVs.split(':'); if (S.A.card.ctype===t || (t==='ally' && c.owner!==S.cur)){ const add = +n - (+c.boost||0); v += add; notes.push(`${t==='ally'?'동료 향상':t+' 특화'} +${add}`); } }

const boostValue = c => boostBreak(c).v;
function dieHit(f, A){

const diceHits = A => A.dice ? A.dice.filter(f => dieHit(f,A)).length : 0;
function fixFate(A){ if (A && A.darkAsLight && A.dice && A.dice.length && A.dice[A.dice.length-1]==='D') A.dice[A.dice.length-1] = 'L'; }   // 스피드스타: ☠를 ☀로
function fateMods(A){ const c = A && A.card; const m = {}; if (c && c.fate) String(c.fate).split(',').forEach(x=>{ const [k,v] = x.split(':'); if (v.trim()==='clear') m[k.trim()+'clear'] = true; else m[k.trim()] = +v; }); return m; }   // D:clear = ☠면 즉시 완료

const diceBase = A => A.dice ? A.dice.reduce((t,f) => t + dieVal(f,A), 0) : 0;
function puzzleDice(A){   // 퍼즐 도전의 주사위 조건 (조합·화음·정답)

  selfRules(A,'selfChord').forEach(r => { if (hits>=3){ out.add += r.n; out.notes.push(`화음 +${r.n}`); } });
  selfRules(A,'selfHitsMin').forEach(r => { if (hits < r.n){ out.zero = true; out.notes.push(`일치 ${hits}개 — 진행도 없음`); } });

function focusDice(A){   // 리오르 「정신력」: 일치하지 않은 기술 주사위 1개를 일치로 취급
  if (!A || !A.dice || !A.dice.length || A.rolling || !A.action) return 0;
  const o = S.seekers[A.action.owner]; if (!o || o.def.hook!=='focus') return 0;
  return Math.min(1, A.dice.slice(0,-1).filter(f=>!dieHit(f,A)).length);
}
const diceValue = A => diceBase(A) + puzzleDice(A).add + focusDice(A);
const rerollsLeft = A => A ? (selfRules(A,'selfNoReroll').length ? 0 : A.rerolls + (+A.hookRR||0) - A.rerollUsed) : 0;

/* 조건 판정 (화면에서 확인 가능한 정보만) */
function cmp(a, op, b){ b = +b; switch(op){ case '>=': return a>=b; case '<=': return a<=b; case '>': return a>b; case '<': return a<b; case '!=': return a!=b; default: return a==b; } }
function condOK(c, s){
  const A = S.A; s = s || cur();
  const card = A ? A.card : null; const top = topCard(s);
  const list = c.v.split('|').map(x=>x.trim());
  const neg = c.op==='!=';
  switch (c.k){
    case 'type': { const t = card ? (card.ctype || (A && A.tg.type==='master' ? '전투' : '')) : ''; const r = list.includes(t); return neg ? !r : r; }
    case 'col': { const r = A && list.includes(A.color); return neg ? !r : r; }
    case 'prog': return A ? cmp(A.startProg, c.op, c.v) : false;
    case 'half': return A ? A.startProg*2 >= A.diffAtStart : false;
    case 'top': {
      if (list.includes('none')) return neg ? !!top : !top;
      const tc = top ? cols(top.colors) : [];
      const r = !!top && (tc.includes('W') || list.some(x => tc.includes(x.toUpperCase())));
      return neg ? !r : r; }
    case 'topv': return top ? cmp(+top.value||0, c.op, c.v) : false;
    case 'topname': { const r = !!top && list.includes(top.name); return neg ? !r : r; }
    case 'hp': return cmp(S.hp, c.op, c.v);
    case 'hunger': return cmp(S.exhaustActive.length, c.op, c.v);
    case 'hand': return cmp(s.hand.length, c.op, c.v);
    case 'boosted': return !!(A && A.boosts.length);
    case 'light': return !!(A && A.dice && A.dice[A.dice.length-1]==='L');
    case 'dark': return !!(A && A.dice && A.dice[A.dice.length-1]==='D');
    case 'tri': { if (!A || !A.dice) return false; const sk = A.dice.slice(0,-1); return ['R','G','B'].every(x=>sk.includes(x)); }
    case 'dice': return A && A.dice ? cmp(diceHits(A), c.op, c.v) : false;
    case 'blue': return A && A.dice ? cmp(A.dice.slice(0,-1).filter(x=>x==='B').length, c.op, c.v) : false;
    case 'wild': { const r = !!(card && card.ctype==='전투' && A && A.tg.type!=='master'); return neg ? !r : r; }
    case 'boss': return !!(A && A.tg.type==='master');
    case 'notboss': return !!(A && A.tg.type!=='master');
    case 'topcol': { const r = !!(A && top && cols(top.colors).includes(A.color)); return neg ? !r : r; }   // 보스가 아닌 전투 (잠재우기: 보스는 내성)
    case 'team': return S.seekers.length>1;
    case 'solo': return S.seekers.length===1;
    case 'final': return S.phase==='final';
    case 'acttype': { const r = !!(A && A.action && list.includes(A.action.tag)); return neg ? !r : r; }
  }
  return false;
}
// 선택한 카드의 효과 미리보기 (조건 충족 여부: on=발동, off=미충족, wait=나중에 판정, '' = 판정 안 함)
const LATE = new Set(['boosted','light','dark','tri','dice','blue']);
const NEED_A = new Set(['prog','half','type','col']);
function clausePreview(c, judge){
  const e = parseEffect(c.effect); const s = S ? (S.seekers[c.owner] || cur()) : null;
  const rows = [];
  if (e.onlyLast){ const hl = s ? s.hand.filter(x=>x!==c).length : 0; rows.push({t:'패의 마지막 한 장일 때만 행동으로 사용 가능', st: judge ? (s && s.hand.includes(c) ? (s.hand.length===1?'on':'off') : (hl===0?'on':'off')) : ''}); }
  if (e.onlyHand!=null){ const hn = s ? s.hand.length : 0; rows.push({t:`패가 ${e.onlyHand}장 이하일 때만 행동으로 사용 가능`, st: judge ? (hn<=e.onlyHand?'on':'off') : ''}); }
  if (e.matchTop){ const t = s && topCard(s); rows.push({t:`버린 더미 맨 위 카드의 색${t?'('+cols(t.colors).map(x=>COL[x].n).join('/')+')':''}으로도 사용 가능`, st: judge ? (t?'on':'off') : ''}); }
  e.clauses.forEach(cl => {
    const cond = cl.conds.map(condLabel).join(', ');
    const diceC = cl.conds.some(x=>['light','dark','tri','dice','blue'].includes(x.k));
    const txt = `${cl.when!=='play' && !(cl.when==='roll' && !diceC)?WHENL[cl.when]+': ':''}${cond?cond+' → ':''}${cl.ops.map(opLabel).join(', ')}${cl.cost?` (비용: ${{discard:'패 1장 버리기',bury:'버린 더미 맨 위를 덱 맨 아래로',hp:'피해 1'}[cl.cost]||cl.cost})`:''}`;
    let st = '';
    if (judge){
      const now = cl.conds.filter(x=>!LATE.has(x.k) && (S.A || !NEED_A.has(x.k)));
      if (!now.every(x=>condOK(x, s))) st = 'off';
      else st = ((cl.when==='play' || cl.when==='after' || cl.when==='end') && cl.conds.every(x=>!LATE.has(x.k))) ? 'on' : 'wait';
    }
    rows.push({t:txt, st});
  });

}

/* ---------------- 게임 시작 ---------------- */
function newGame(){
  const ids = SETUP.sel.slice(0,4);
  const mdef = SETUP.boss==='random' ? rnd(DATA.masters) : (DATA.masters.find(m=>m.code===SETUP.boss) || DATA.masters[0]);
  S = {
    gid: Math.random().toString(36).slice(2, 10), quick: !!SETUP.quick,   // gid: 탐험 기록 중복 방지용 판 번호
    phase:'delve', hpStart: SETUP.hard?CFG.hpHard:CFG.hpNormal, cur:0, view:0, turnNo:1, log:[], busy:false, selSlot:null,
    seekers: ids.map((id,i)=>{
      const def = DATA.seekers.find(s=>s.id===id);
      const cards = DATA.skills.filter(c=>c.seeker===id).map(c=>({...c, uid:uid(), owner:i, kind:'skill'}));
      return {i, def, deck:shuffle(cards), hand:[], discard:[], charged:true};
    }),
    delveDeck: shuffle(DATA.delve.map(c=>({...c, uid:uid()}))), delveDiscard:[], completed:[], removed:[],
    exhaustDeck: shuffle(DATA.exhaust.map(c=>({...c, uid:uid(), kind:'hunger', fails:0}))), exhaustActive:[],
    master: {def:mdef, revealed:false, progress:0, weak:[], items:[], baseDiff:null},
    trials: pickTrials(mdef),
    slots:[], A:null, T:null, stats:{fails:0, exhausts:0},
  };
  S.hp = S.hpStart;
  { // 처음 펼치는 4장에는 이벤트를 2장까지만: 넘치는 이벤트는 던전 덱의 무작위 위치로 되돌린다
    const first = [], back = [];
    while (first.length < 4 && S.delveDeck.length){ const c = S.delveDeck.shift(); if (c.kind==='event' && first.filter(x=>x.kind==='event').length >= 2) back.push(c); else first.push(c); }
    back.forEach(c => S.delveDeck.splice(Math.floor(Math.random()*(S.delveDeck.length+1)), 0, c));
    S.delveDeck.unshift(...first);
  }
  S.slots = [0,1,2,3].map(()=>({card:S.delveDeck.shift()||null, progress:0, down:false})); S.slots.forEach(sl => sl.progress = startProg(sl.card));
  const disc = SETUP.quick ? CFG.quickDiscard : CFG.setupDiscard;
  for (let k=0;k<disc && S.delveDeck.length;k++) S.delveDiscard.push(S.delveDeck.shift());
  S.seekers.forEach(s=>drawCards(s, handSize(), true));
  log(`탐험 시작 — 탐험대: ${S.seekers.map(s=>s.def.name).join(', ')} / HP ${S.hp} / 던전 덱 ${S.delveDeck.length}장`, 'sys');
  if (SETUP.quick){
    S.hp -= 2; log('빠른 게임: 피해 2', 'bad');
    const c = S.exhaustDeck.shift(); S.exhaustActive.push(c); log(`빠른 게임: 배고픔 카드 「${c.name}」 공개(공개 시 효과는 생략)`, 'bad');
  }
  startTurn();
}

function drawCards(s, n, silent){
  let got = 0;
  for (let k=0;k<n;k++){
    if (!s.deck.length){
      if (!s.discard.length) break;
      s.deck = shuffle(s.discard); s.discard = [];
      log(`${s.def.name}: 버린 더미를 섞어 새 기술 덱을 만들었습니다.`, 'sys');
    }
    s.hand.push(s.deck.shift()); got++;
  }
  if (got && !silent) sfx('draw');
  if (!silent) log(`${s.def.name}: 기술 카드 ${got}장 뽑기`);
  return got;
}

function startTurn(){
  S.T = {acted:false, used:[], exhausted:false, guard:0};
  S.A = null; S.selSlot = null; S.view = S.cur;
  log(`${S.turnNo}번째 차례 · ${cur().def.name}`, 'turn');
  render();
  (async () => {
    const s = cur();
    if (s.def.hook==='boostAny' && S.slots.some(x=>x.card && !x.down && x.progress>0) && boardTargets(false).length>1){
      S.busy = true; await moveProgress(1, `${s.def.name} 특성 「${s.def.ability_name}」`); S.busy = false; render();
    }
    if (!over() && !cur().hand.length) startTurnEmpty();
  })();
}
function startTurnEmpty(){
  {
    modal({title:'패가 비었습니다', html:`<p>${cur().def.name}의 패에 카드가 없어 <b>반드시 배고픔</b>을 선언하고 새 패를 뽑습니다.</p>`, buttons:[{label:'확인',primary:true}]})
      .then(()=>doExhaust(true));
  }
}

async function doExhaust(forced){
  const s = cur();
  if (!forced){
    const ok = await modal({title:'배고픔 선언', html:`<p>${s.def.name}의 패 ${s.hand.length}장을 모두 버리고, 배고픔 카드 1장을 공개한 뒤 <b>${handSize()}장</b>을 새로 뽑습니다.</p>
      <p class="muted">배고픔 카드에는 강력한 지속 효과와 패배 조건이 있습니다. 공개된 배고픔: ${S.exhaustActive.length}장</p>`,
      buttons:[{label:'취소',value:false},{label:'배고픔 선언',value:true,primary:true}]});

async function revealHunger(n){
  if (n>0) sfx('hunger');
  for (let k=0;k<n;k++){
    if (over()) return;
    if (!S.exhaustDeck.length){
      if (CFG.loseWhenHungerEmpty){ lose('배고픔 카드가 더 이상 없습니다 — 탐험대가 쓰러졌습니다.'); return; }
      log('배고픔 덱이 비어 있어 공개할 카드가 없습니다.','sys'); continue;
    }
    const c = S.exhaustDeck.shift(); c.fails = 0; S.exhaustActive.push(c);
    log(`배고픔 카드 공개: 「${c.name}」 ${c.text||''}`, 'bad'); render();
    await modal({title:'배고픔 카드 공개', html:`<div class="center-cards">${hungerHTML(c,{w:'220px', noZb:true})}</div>`, buttons:[{label:'확인',primary:true}]});
    await applyOps(parseOps(c.effect), c.name);

function checkHungerSets(){
  if (over()) return;
  for (const c of S.exhaustActive){
    const r = parseRules(c.rules).find(x => x.k==='setLose'); if (!r) continue;
    const cnt = S.exhaustActive.filter(x => x.name===c.name).length;
    if (cnt >= r.n){ lose(`「${c.name}」 ${cnt}장이 모두 공개되었습니다 — 탐험대가 배고픔으로 쓰러졌습니다.`); return; }
  }
}
function countFail(){
  S.stats.fails++;
  for (const c of S.exhaustActive){
    const r = parseRules(c.rules).find(x => x.k==='failLose'); if (!r) continue;
    c.fails = (c.fails||0) + 1;
    log(`「${c.name}」 실패 카운트 ${c.fails}/${r.n}`, 'bad');
    if (c.fails >= r.n){ lose(`「${c.name}」 공개 후 도전에 ${r.n}번 실패했습니다 — 탐험대가 쓰러졌습니다.`); return; }
  }
}

/* ---------------- 효과 처리 ---------------- */
function heal(n, src){ const b=S.hp; S.hp = Math.min(S.hpStart, S.hp+n); if (S.hp>b) sfx('heal'); log(`${src}: HP ${S.hp-b} 회복 (HP ${S.hp})`, 'good'); }
var BLOCKFX = null;   // 피해 감소 연출(팀 HP 옆에 「피해 감소」)
function blockFx(n){ if (n>0) sfx('block'); if (n>0) BLOCKFX = {n:(BLOCKFX && Date.now()-BLOCKFX.t<300 ? BLOCKFX.n : 0) + n, t:Date.now()}; }
function damage(n, src){
  if (n<=0) return;
  if (S.T && S.T.guard>0){ const a = Math.min(S.T.guard, n); S.T.guard -= a; n -= a; log(`${src}: 피해 ${a} 막음 (남은 막기 ${S.T.guard})`, 'good'); blockFx(a); if (n<=0) return; }
  if (S.T && S.T.endure && S.hp - n <= 0 && S.hp > 1){ n = S.hp - 1; S.T.endure = false; log(`${src}: 끝까지 버텼다! HP 1로 버팀`, 'good'); }   // 버티기(리오르)
  const hp0 = S.hp; S.hp = Math.max(0, S.hp-n); sfx('damage'); if (hp0 > 3 && S.hp <= 3 && S.hp > 0 && !window.__noFx) setTimeout(()=>sfx('lowhp'), 420); log(`${src}: 피해 ${n} (HP ${S.hp})`, 'bad');
  if (S.stats){ const k = /불이익/.test(src)?'penalty':/불운/.test(src)?'dark':/배고픔|허기|굶주림/.test(src)||S.exhaustActive.some(c=>c.name===src)?'hunger':S.slots.some(x=>false)?'':/몬스터|이벤트/.test(src)?'event':'card'; S.stats.dmg = S.stats.dmg||{}; S.stats.dmg[k]=(S.stats.dmg[k]||0)+n; }
  if (S.hp<=0) lose('팀 HP가 0이 되었습니다 — 탐험대가 쓰러졌습니다.');
}
function win(){ sfx('win'); S.phase='won'; log('던전 보스를 쓰러뜨렸습니다! 승리!','good'); render(); }
function lose(msg){ if (over()) return; sfx('lose'); S.phase='lost'; S.loseMsg=msg; log(msg,'bad'); render(); }
const needAttempt = (src, what) => { if (!S.A || S.A.step>=4){ log(`${src}: ${what} — 도전 시도 중에만 효과가 있습니다.`,'sys'); return false; } return true; };

async function applyOps(ops, src, who){
  for (const o of ops){
    if (over()) return;
    const s = who || cur(), n = o.n, A = S.A;
    switch (o.op){
      case 'progress':
        if (A && A.step<4){ A.bonus += n; A.notes.push(`${src} ${n>=0?'+':''}${n}`); log(`${src}: 이번 시도 진행도 ${n>=0?'+':''}${n}`); }
        else if (A && A.step===4){ const r = A.tg.type==='master' ? S.master : S.slots[A.tg.i];

function boardTargets(excludeCurrent){
  const t = [];
  S.slots.forEach((sl,i)=>{
    if (!sl.card || sl.down || sl.card.kind==='event' || sl.card._fin) return;
    if (cardHasRule(sl.card,'noAttempt')) return;   // 다른 효과로도 진행도를 올릴 수 없음
    if (excludeCurrent && S.A && S.A.tg.type==='slot' && S.A.tg.i===i) return;
    t.push({type:'slot', i});
  });
  if (S.phase==='final' && !(excludeCurrent && S.A && S.A.tg.type==='master')) t.push({type:'master'});
  return t;
}
const tgKey = tg => tg.type==='master' ? 'master' : 'slot'+tg.i;
const keyTg = k => k==='master' ? {type:'master'} : {type:'slot', i:+k.slice(4)};
function tgPickHTML(tg){ return tg.type==='master' ? masterHTML({w:'150px', noZb:true}) : slotCardHTML(S.slots[tg.i], tg.i, {w:'150px', noact:true, noZb:true}); }
async function addProgressAny(n, src, f){
  const ts = boardTargets(true).filter(tg => matchFilter(f, tgCard(tg)));
  if (!ts.length){ log(`${src}: 진행도를 올릴 ${f?fName(f)+' ':''}도전이 없습니다.`,'sys'); return; }
  const r = await pickModal({title:`${src}: 진행도 ${n} 올리기`, desc:`진행도를 올릴 ${f?fName(f)+' ':''}도전을 선택하세요.`, items:ts.map(tg=>({v:tgKey(tg), html:tgPickHTML(tg)})), skip:true});
  if (!r.length) { log(`${src}: 사용하지 않음`); return; }
  const tg = keyTg(r[0]); tgRef(tg).progress += n;
  log(`${src}: 「${tgCard(tg).name}」에 진행도 ${n}`, 'good');
  await checkAuto(tg);
}
async function pullProgress(n, src, f){
  if (!needAttempt(src,'끌어오기')) return;
  const srcs = boardTargets(true).filter(tg => tg.type==='slot' && tgRef(tg).progress>0 && matchFilter(f, tgCard(tg)));
  if (!srcs.length){ log(`${src}: 끌어올 진행도가 있는 ${f?fName(f)+' ':''}도전이 없습니다.`,'sys'); return; }
  const a = await pickModal({title:`${src}: 진행도 끌어오기 (최대 ${n})`, desc:'진행도를 가져올 도전을 선택하세요. 가져온 진행도는 이번 시도에 더해집니다.', items:srcs.map(tg=>({v:tgKey(tg), html:tgPickHTML(tg)})), skip:true});
  if (!a.length) return;
  const from = keyTg(a[0]); const amt = Math.min(n, tgRef(from).progress);
  tgRef(from).progress -= amt; S.A.bonus += amt; S.A.notes.push(`${src} +${amt}`);
  log(`${src}: 「${tgCard(from).name}」에서 진행도 ${amt} 끌어옴`, 'good');
}
async function moveProgress(n, src){
  const srcs = [];
  S.slots.forEach((sl,i)=>{ if (sl.card && sl.progress>0 && !sl.down) srcs.push({type:'slot',i}); });
  if (!srcs.length){ log(`${src}: 옮길 진행도가 없습니다.`,'sys'); return; }
  const a = await pickModal({title:`${src}: 진행도 이동 (최대 ${n})`, desc:'진행도를 가져올 카드를 선택하세요.', items:srcs.map(tg=>({v:tgKey(tg), html:tgPickHTML(tg)})), skip:true});
  if (!a.length) return;
  const from = keyTg(a[0]);
  const tos = boardTargets(true).filter(t=>tgKey(t)!==a[0]);
  if (!tos.length){ log(`${src}: 옮길 대상 도전이 없습니다.`,'sys'); return; }
  const b = await pickModal({title:`${src}: 진행도 이동`, desc:'진행도를 옮길 도전을 선택하세요.', items:tos.map(tg=>({v:tgKey(tg), html:tgPickHTML(tg)})), skip:true});
  if (!b.length) return;
  const to = keyTg(b[0]); const amt = Math.min(n, tgRef(from).progress);
  tgRef(from).progress -= amt; tgRef(to).progress += amt;
  log(`${src}: 「${tgCard(from).name}」 → 「${tgCard(to).name}」 진행도 ${amt} 이동`, 'good');
  await checkAuto(to);
}
async function scrapChallenge(src, f){
  if (S.phase==='final'){ log(`${src}: 보스전의 시련은 버릴 수 없습니다.`,'sys'); return; }
  const ts = boardTargets(true).filter(tg => tg.type==='slot' && matchFilter(f, tgCard(tg)));
  if (!f) S.slots.forEach((sl,i)=>{ if (sl.card && !sl.down && sl.card.kind==='event') ts.push({type:'slot', i}); });   // 필터 없는 버리기는 이벤트도 대상
  ts.sort((a,b)=>a.i-b.i);
  if (!ts.length){ log(`${src}: 버릴 수 있는 ${f?fName(f)+' 도전':'도전·이벤트'}이 없습니다.`,'sys'); return; }
  const r = await pickModal({title:`${src}: ${f?'도전':'도전·이벤트'} 1장 버리기`, desc:`버릴 ${f?fName(f)+' 도전':'도전 또는 이벤트'}을 고르세요. 지나온 층으로 가며, 완료로 치지 않고 보상도 없습니다. 올려 둔 진행도는 사라집니다.`, items:ts.map(tg=>({v:tgKey(tg), html:tgPickHTML(tg)})), skip:true});
  if (!r.length) return;
  const sl = S.slots[keyTg(r[0]).i]; const c = sl.card;

}
async function pickSeeker(s, title, any){
  const others = S.seekers.filter(x => any || x!==s);
  if (!others.length) return s;
  if (others.length===1) return others[0];
  const r = await pickModal({title, desc:'탐험대원을 고르세요.', items:others.map(x=>({v:String(x.i), html:`<div class="pick txtpick"><span style="color:${x.def.color}">●</span> ${esc(x.def.name)} <span class="muted">(패 ${x.hand.length} · 부적 ${x.charged?'충전됨':'사용함'})</span></div>`, raw:true}))});
  return S.seekers[+r[0]] || s;
}
async function giveCards(s, n, src){
  if (S.seekers.length===1){ log(`${src}: 혼자라서 대신 카드 ${n}장 뽑기`); drawCards(s, n); return; }
  for (let k=0;k<n;k++){
    if (!s.hand.length){ log(`${src}: 넘길 카드가 없습니다.`,'sys'); return; }
    const a = await pickModal({title:`${src}: 넘길 카드`, desc:'다른 탐험대원에게 넘길 카드를 고르세요.', items:s.hand.map(c=>({v:String(c.uid), html:skillHTML(c,{w:'150px', noZb:true})})), skip:true});
    if (!a.length) return;
    const t = await pickSeeker(s, `${src}: 카드를 받을 탐험대원`, false);
    const c = s.hand.find(x=>x.uid===+a[0]); s.hand = s.hand.filter(x=>x!==c); c.owner = t.i; t.hand.push(c);
    log(`${src}: 「${c.name}」을(를) ${t.def.name}에게 넘김`, 'good');
  }
}
// 배고픔 회복: 되돌릴 카드를 고름 (패배 조건이 있는 카드가 앞에 표시됨)
async function recoverHunger(n, src){
  let k = 0; if (n>0 && S.exhaustActive.length) sfx('heal');
  for (; k<n && S.exhaustActive.length; k++){
    const danger = c => parseRules(c.rules).some(r=>r.k==='setLose'||r.k==='failLose') ? 0 : 1;
    const list = S.exhaustActive.slice().sort((a,b)=>danger(a)-danger(b));
    let c = list[0];
    if (list.length>1){
      const r = await pickModal({title:`${src}: 배고픔 카드 회복`, desc:'배고픔 덱으로 되돌릴 카드를 고르세요.', items:list.map(x=>({v:String(x.uid), html:hungerHTML(x,{w:'150px', noZb:true})}))});
      c = list.find(x=>String(x.uid)===r[0]) || c;
    }
    S.exhaustActive = S.exhaustActive.filter(x=>x!==c); c.fails = 0; S.exhaustDeck.push(c);
    log(`${src}: 배고픔 「${c.name}」 회복`, 'good');
  }
  if (!k) log(`${src}: 회복할 배고픔 카드가 없습니다.`, 'sys');
}
async function checkAuto(tg){
  const r = tgRef(tg); if (!r || (tg.type==='slot' && (!r.card || r.down || r.card._fin))) return;
  if (r.progress >= effDiff(tg)){
    log(`「${tgCard(tg).name}」의 진행도가 난이도에 도달 — 즉시 완료! (보상은 현재 탐험대원)`, 'good');
    await complete(tg);
  }
}
async function chooseDiscard(s, n, src){
  if (!s.hand.length){ log(`${src}: 버릴 카드가 없습니다.`,'sys'); return; }
  let picked;
  if (s.hand.length<=n) picked = s.hand.map(c=>String(c.uid));
  else picked = await pickModal({title:`${src}: ${s.def.name}의 카드 ${n}장 버리기`, desc:'버릴 카드를 선택하세요. 마지막으로 버린 카드가 버린 더미 맨 위가 됩니다.', n, items:s.hand.map(c=>({v:String(c.uid), html:skillHTML(c,{w:'150px', noZb:true})}))});
  const gone = [];
  picked.forEach(u=>{ const c = s.hand.find(x=>x.uid===+u); if (c){ s.hand = s.hand.filter(x=>x!==c); S.seekers[c.owner].discard.push(c); gone.push(c); } });
  if (gone.length && typeof showMilled==='function') showMilled(gone, src, '패에서 버림');
  if (gone.length) sfx('discard');
  log(`${src}: ${s.def.name} 카드 ${picked.length}장 버림`, 'bad');
}
async function payCost(cost, card){
  const s = cur();
  if (cost==='discard'){
    if (!s.hand.length){ log(`「${card.name}」: 버릴 카드가 없어 추가 효과를 받을 수 없습니다.`,'sys'); return false; }
    const r = await pickModal({title:`「${card.name}」 비용: 패의 카드 1장 버리기`, desc:'버리면 추가 효과를 받습니다. 원하지 않으면 「사용하지 않음」.', items:s.hand.map(c=>({v:String(c.uid), html:skillHTML(c,{w:'150px', noZb:true})})), skip:true});
    if (!r.length) return false;
    const c = s.hand.find(x=>x.uid===+r[0]); s.hand = s.hand.filter(x=>x!==c); S.seekers[c.owner].discard.push(c);
    log(`비용: 「${c.name}」 버림`); return true;
  }
  if (cost==='bury'){
    const t = topCard(s); if (!t){ log(`「${card.name}」: 버린 더미가 비어 있어 추가 효과를 받을 수 없습니다.`,'sys'); return false; }
    const ok = await modal({title:`「${card.name}」 비용`, html:`<p>버린 더미 맨 위 「<b>${esc(t.name)}</b>」를 기술 덱 맨 아래로 넣고 추가 효과를 받을까요?</p>`, buttons:[{label:'사용하지 않음',value:false},{label:'넣고 효과 받기',value:true,primary:true}]});
    if (!ok) return false;
    s.discard.pop(); s.deck.push(t); log(`비용: 「${t.name}」을(를) 기술 덱 맨 아래로`); return true;
  }
  if (cost==='hp'){
    const ok = await modal({title:`「${card.name}」 비용`, html:'<p>피해 1을 받고 추가 효과를 받을까요?</p>', buttons:[{label:'사용하지 않음',value:false},{label:'피해 1 받기',value:true,primary:true}]});
    if (!ok) return false; damage(1, '비용'); return !over();
  }
  return true;
}
async function runClauses(card, when){
  if (!card) return;
  const e = parseEffect(card.effect);
  if (when==='play' && S.A) S.A.afterQ = e.clauses.filter(cl => cl.when==='after' && cl.conds.every(c=>condOK(c)));   // 행동 후: 조건은 지금 판정
  if (when==='play') e.clauses.forEach(cl=>{ if (cl.when==='end' && cl.conds.every(c=>condOK(c))) (S.T.endQ = S.T.endQ || []).push({cl, card}); });   // 차례 종료 시: 조건은 지금 판정
  for (const cl of e.clauses){
    if (cl.when!==when || over()) continue;
    if (!cl.conds.every(c=>condOK(c))) continue;
    if (cl.cost && !(await payCost(cl.cost, card))) continue;
    S._clauseCard = card; await applyOps(cl.ops, card.name); S._clauseCard = null;
  }
}

/* ---------------- 차례: 카드 선택 (클릭=선택, 선택된 카드 다시 클릭/Enter=실행) ---------------- */
const canPick = () => S && !over() && !S.busy && !S.A && !S.T.acted;
function slotPickable(k){
  if (k==='m') return S.phase==='final' && S.master.weak.length>0;
  const sl = S.slots[k]; if (!(sl && sl.card && !sl.down)) return false;
  if (sl.card.kind==='trial' && trialLocked(sl.card)) return false;
  if (cardHasRule(sl.card,'noAttempt')) return false;   // 직접 시도할 수 없는 시련
  return true;
}
function selectSlot(k){
  if (!S || over() || S.busy) return;
  if (S.A){ toast('도전 시도 중입니다. 먼저 이번 시도를 마치세요.'); return; }
  if (S.T.acted){ toast('이번 차례의 행동을 이미 했습니다. Enter로 차례를 종료하세요.'); return; }
  if (k==='m'){
    if (S.phase!=='final'){ toast('던전의 최심층에 도달해야 보스가 모습을 드러냅니다.'); return; }
    if (!S.master.weak.length){ toast('보스는 모든 색상에 무적입니다. 시련을 완료해 약점을 드러내세요.'); return; }
  } else {
    const sl = S.slots[k]; if (!sl || !sl.card) return;
    if (sl.down){ toast('이미 완료한 시련입니다.'); return; }
    const lk = sl.card.kind==='trial' && trialLocked(sl.card);
    if (lk){ toast(`「${lk}」을(를) 먼저 완료해야 시도할 수 있습니다.`); return; }
  }
  if (S.selSlot===k) return executeSel();
  S.selSlot = k; sfx('select'); render();
}
async function executeSel(){
  const k = S.selSlot; if (k==null || !canPick() || !slotPickable(k)) return;
  sfx('confirm');
  if (k==='m') return startAttempt({type:'master'});
  const sl = S.slots[k];
  if (S.phase!=='final' && sl.card.kind==='event'){ S.selSlot = null; return resolveEvent(k); }
  return startAttempt({type:'slot', i:k});
}
async function resolveEvent(i){
  const sl = S.slots[i], c = sl.card;
  S.busy = true; S.T.acted = true;
  sl.card = null; sl.progress = 0;
  log(`${cur().def.name}: 이벤트 「${c.name}」 — ${c.story||c.text||''}`);
  render();
  const evOps = parseOps(c.effect), evDmg = evOps.some(o=>o.op==='damage');
  for (;;){
    // 피해를 주는 이벤트: 패에 있는 '버리고 막기' 카드를 효과 적용 전에 쓸 수 있다
    const rs = evDmg ? S.seekers.flatMap(s=>s.hand.filter(x=>x.react && /guard/.test(x.react))) : [];
    const g = S.T.guard>0 ? `<p class="muted">${pxi('shield')} 이번 차례 피해 막기: ${S.T.guard>=9?'모두':S.T.guard}</p>` : '';
    const v = await modal({title:`✧ ${esc(c.name)}`, html:`<p class="story">${esc(c.story||c.flavor||'')}</p><div class="selbox"><div class="l">효과</div>${esc(c.text||opsText(c.effect)||'없음')}</div>${g}`,
      buttons:[...rs.map(x=>({label:`${pxi('shield')} 「${esc(x.name)}」 버리고 막기`, value:x.uid})), {label:'계속',value:'go',primary:true}]});
    const rc = rs.find(x=>x.uid===v); if (!rc) break;
    const rsk = S.seekers[rc.owner];
    rsk.hand = rsk.hand.filter(x=>x!==rc); rsk.discard.push(rc);
    log(`${rsk.def.name}: 「${rc.name}」을(를) 버리고 사용`, 'good');
    await applyOps(parseOps(rc.react), rc.name, rsk); render();
  }
  await applyOps(evOps, c.name);
  S.delveDiscard.push(c);
  S.busy = false; render();
}

async function startAttempt(tg){
  const card = tgCard(tg); if (S.T) S.T.tgCard = card;   // 이번 차례에 시도한 도전 (카운터용)
  const cs = tg.type==='master' ? [...new Set(S.master.weak)] : cols(card.colors);
  if (!cs.length){ toast('색상이 지정되지 않은 도전입니다(데이터 확인).'); return; }
  let color = cs[0];
  if (cs.length>1){
    const r = await pickModal({title:'시도 색상 선택', desc: tg.type==='master' ? '보스의 공개된 약점 중 이번 시도에 사용할 색상을 고르세요. 행동·향상·주사위 모두 이 색상 기준입니다.' : '이 도전은 여러 색상입니다. 이번 시도에 사용할 색상을 고르세요.',
      items: cs.map(c=>({v:c, html:`<div class="pick txtpick">${colChip(c)}</div>`, raw:true})), skip:true});
    if (!r.length){ render(); return; } color = r[0];
  }
  S.selSlot = null;
  const s = cur();
  S.A = {tg, card, color, step:1, sel:null, selBoost:[], action:null, actionVal:0, boostVal:0, boosts:[], dice:null, bonus:0, notes:[], result:null,
    startProg: tgRef(tg).progress, diffAtStart: effDiff(tg),
    rerolls:0, rerollUsed:0, hookRR: false, shown:{}, extraDie:0, diceAlso:[], diceBonus:[], darkOk:false,
    boostMaxAdd:0, boostPlus:0, shield:0, nopenalty:false, wild:false};
  if (selfRules(S.A,'selfNoRoll').length){ S.A.noRoll = true; }
  selfRules(S.A,'selfExtraDie').forEach(r => S.A.extraDie += r.n);
  S.view = S.cur;
  log(`${s.def.name}: 「${card.name}」 도전 시도 (${COL[color].n})`);
  render();
  const cDmg = selfRules(S.A,'selfCostDamage').reduce((a,r)=>a+r.n,0), cRet = selfRules(S.A,'selfCostRetreat').reduce((a,r)=>a+r.n,0);
  if (cDmg){ log(`「${card.name}」: 시도 대가`, 'bad'); await applyOps([{op:'damage', n:cDmg, s:'', f:''}], card.name+' (시도 대가)'); if (over()) return; }
  if (cRet){ await applyOps([{op:'retreat', n:cRet, s:'', f:''}], card.name+' (시도 대가)'); }
  const cost = selfRules(S.A,'selfCostDiscard').reduce((a,r)=>a+r.n,0);
  if (cost){ S.busy = true; log(`「${card.name}」: 시도하려면 패의 카드 ${cost}장을 버려야 합니다.`, 'sys'); { const before = s.discard.slice(); await chooseDiscard(s, cost, card.name); if (S.A) S.A.costCards = s.discard.filter(c=>!before.includes(c)); } S.busy = false; render(); }
}

/* 1·2단계: 패 선택 */
function clickHand(u){
  if (!S.A || S.busy) return;
  const c = findSkill(u); if (!c) return;
  const A = S.A;
  if (A.step===1){
    if (c.owner!==S.cur || !S.seekers[S.cur].hand.includes(c)) return toast('행동 카드는 현재 탐험대원의 패에서만 고를 수 있습니다.');
    if (!actionEligible(c)) return toast(hasRule('noWhite') && cols(c.colors).includes('W') ? '지금은 백색 카드를 행동으로 사용할 수 없습니다.' : `${COL[A.color].n} 또는 백색 카드만 사용할 수 있습니다.`);
    A.sel = A.sel===c.uid ? null : c.uid; sfx('select'); render();
  } else if (A.step===2){
    if (!boostCardOK(c)) return toast(c.selfBoost ? '이 기술은 자신의 시도에만 향상할 수 있습니다.' : (S.seekers.length===1 ? '향상은 자신의 패에서 고릅니다.' : '탐험대원이 2명 이상이면 다른 탐험대원만 향상할 수 있습니다.'));
    if (c.boostColor==='K') return toast('흑색 향상 카드는 향상에 사용할 수 없습니다.');
    if (!boostEligible(c)) return toast('향상 색상(카드 하단)이 시도 색상과 일치해야 합니다.');
    if (A.selBoost.includes(c.uid)) A.selBoost = A.selBoost.filter(x=>x!==c.uid);
    else { if (A.selBoost.length>=boostCap(A)) return toast(`이번 시도는 향상을 ${boostCap(A)}장까지만 받을 수 있습니다.`); A.selBoost.push(c.uid); }
    sfx('select'); render();
  }
}
async function confirmAction(){
  const A = S.A, s = cur(); if (!A || A.step!==1 || S.busy) return; const c = s.hand.find(x=>x.uid===A.sel); if (!c || !actionEligible(c)) return;
  sfx('confirm');
  s.hand = s.hand.filter(x=>x!==c); S.T.used.push(c);
  A.action = c; A.actionVal = +c.value||0;
  rulesOf('valueMod').forEach(r => { if (matchFilter(r.f, c)){ A.actionVal += r.n; A.notes.push(`${r.src} ${r.n}`); } });
  log(`${s.def.name}: 「${c.name}」을(를) 행동으로 사용 (+${A.actionVal})`);
  if (s.def.hook==='blazeLow' && c.tag==='불꽃' && A.startProg>0){ A.bonus += 2; A.notes.push(`${s.def.ability_name} +2`); log(`특성 「${s.def.ability_name}」 +2`,'good'); }

async function applyFailPenalty(ops, extra, src){
  const A = S.A, s = cur();
  const base = ops.filter(o=>o.op==='damage').reduce((a,o)=>a+o.n,0), rest = ops.filter(o=>o.op!=='damage');
  const total = base + extra, parts = failReduce(A, s), red = Math.min(total, parts.reduce((a,p)=>a+p.n,0));
  const par = Math.min(A.parry||0, total - red); let fin = total - red - par;   // ③-1 받아넘기기: 감소 뒤 남은 실패 피해를 막고 그만큼 이 도전에 진행도
  if (total>0) log(`실패 피해 ${total}${extra?` (불이익 ${base} + 증가 ${extra})`:''}${red?` − 감소 ${red} (${parts.map(p=>p.src+(p.n>=9?' 모두':' '+p.n)).join(', ')})`:''}${par?` − 받아넘기기 ${par}`:''} → ${fin}`, (red||par) ? 'good' : 'bad');
  if (red) blockFx(red);
  if (par){ blockFx(par); const r = tgRef(A.tg); const alive = A.tg.type==='master' || (r && r.card===A.card && !r.down);
    if (alive){ r.progress += par; log(`받아넘기기: 피해 ${par}을(를) 받지 않고 「${A.card.name}」에 반격 — 진행도 +${par}`, 'good'); await checkAuto(A.tg); } }
  if (A.result) A.result.failDmg = {base, extra, total, red, par, fin};
  await applyOps((fin>0 ? [{op:'damage', n:fin, s:'', f:''}] : []).concat(rest), src);
}
async function fail(tg, fate){
  const s = cur(), c = tgCard(tg), A = S.A; sfx('fail');
  await runClauses(A.action, 'fail');
  if (over()) return;
  { const fd = selfRules(A,'selfFailDrain'); if (fd.length){ const n = fd.reduce((a,r)=>a+r.n,0); let k = 0;   // 독안개 늪: 이 시련에 실패하면 모든 시련 진행도 -n
      S.slots.forEach(sl=>{ if (sl.card && !sl.down && sl.card.kind==='trial' && sl.progress>0){ sl.progress = Math.max(0, sl.progress-n); k++; } });
      log(`「${c.name}」 실패 — 독안개가 퍼져 펼쳐진 모든 시련의 진행도 -${n} (${k}장)`, 'bad'); } }
  if (selfRules(A,'selfFailReset').length && tg.type==='slot'){ const sl = S.slots[tg.i]; if (sl.card===c && sl.progress>0){ log(`「${c.name}」 실패 — 미끄러져 진행도 ${sl.progress}을(를) 모두 잃음`, 'bad'); sl.progress = 0; } }   // 얼어붙은 호수
  if (tg.type==='master'){
    log('보스 도전 실패 (진행도는 남습니다)', 'bad');
    itemRules('regen').forEach(r=>{ S.master.progress = Math.max(0, S.master.progress - r.n); log(`「${r.src}」: 보스가 회복했다 — 진행도 -${r.n}`, 'bad'); });
    if (A.nopenalty){ log('불이익을 무시합니다.', 'good'); if (!over()) countFail(); return; }
    const ops = parseOps(c.penalty||'').map(o=>({...o}));
    if (fate==='D' && c.dark){ parseOps(c.dark).forEach(o=>ops.push({...o})); A.result.curse = opsText(c.dark); log(`불운☠: 추가 불이익 — ${opsText(c.dark)}`, 'bad'); }
    const extra = itemRules('bossFail').reduce((a,r)=>a+r.n,0) + (A.fragile||0);   // 보스 반격에는 「실패 피해 +N」 규칙(배고픔·필드)을 적용하지 않음
    await applyFailPenalty(ops, extra, c.name+' 반격');
    if (!over()) countFail();
    return;
  }
  if (tg.type==='slot' && S.slots[tg.i].card!==c) return;  // 실패 효과로 이미 완료됨
  log(`✘ 「${c.name}」 실패`, 'bad');
  if (A.nopenalty){ log('불이익을 무시합니다.', 'good'); }
  else {
    const ops = parseOps(c.penalty).map(o=>({...o}));
    if (fate==='D' && c.dark){ parseOps(c.dark).forEach(o=>ops.push({...o})); A.result.curse = opsText(c.dark); if (!window.__noFx) toast(`☠ 불운 추가 불이익: ${A.result.curse}`); log(`불운☠: 추가 불이익 — ${opsText(c.dark)}`, 'bad'); }
    let extra = 0; rulesOf('failDamage').forEach(r => { if (matchFilter(r.f, c)) extra += r.n; });
    selfRules(A,'selfFailDamage').forEach(r => extra += r.n); extra += (A.fragile||0);
    selfRules(A,'selfFailExhaust').forEach(r => ops.push({op:'exhaust', n:r.n, s:'', f:''}));
    selfRules(A,'selfFailRage').forEach(r => { c.rage = (+c.rage||0) + r.n; log(`「${c.name}」: 분노가 쌓였다 — 난이도 +${r.n} (지금 ${cardDiff(c)})`, 'bad'); });
    selfRules(A,'selfFailDiscard').forEach(r => ops.push({op:'discard', n:r.n, s:'', f:''}));
    await applyFailPenalty(ops, extra, c.name+' 불이익');
  }
  if (!over()) countFail();
}

/* ---------------- 차례 종료 / 보충 / 최심층 ---------------- */
async function endTurn(){
  if (S.busy) return;
  if (S.A && S.A.step<4 && !(typeof NET!=='undefined' && NET.autoRun)) return;   // 도전 도중에는 차례를 끝내지 않음 (늦게 도착한 클릭 등)
  S.T.used.forEach(c=>{ const o = S.seekers[c.owner]; if (/selftop/i.test(c.effect||'')){ o.deck.unshift(c); log(`「${c.name}」: 덱 맨 위로 돌아감`, 'sys'); } else o.discard.push(c); }); S.T.used = [];
  S.A = null; flushCharge();
  if (S.phase==='delve') refill();
  if (over()){ render(); return; }
  { const q = S.T.endQ || []; if (q.length){ S.T.endQ = []; S.busy = true; render();   // 차례 종료 시 효과 (던전 카드를 다시 채운 뒤)
      for (const x of q){ if (over()) break; S._fxCard = x.card; await applyOps(x.cl.ops, x.card.name+' (차례 종료 시)', S.seekers[x.card.owner]); S._fxCard = null; }
      S.busy = false; if (over()){ render(); return; } } }
  S.cur = (S.cur+1) % S.seekers.length; S.turnNo++;
  startTurn();
}
const startProg = c => c ? parseRules(c.rules||'').filter(r=>r.k==='selfStartProg').reduce((a,r)=>a+r.n,0) : 0;   // 낡은 장애물: 펼쳐질 때 진행도
function refillNow(){ const lim = slotLimit(); let f = S.slots.filter(x=>x.card).length; for (const sl of S.slots){ if (f>=lim) break; if (!sl.card && S.delveDeck.length){ sl.card = S.delveDeck.shift(); sl.progress = startProg(sl.card); f++; } } }
function refill(){
  const lim = slotLimit();
  let filled = S.slots.filter(sl=>sl.card).length;
  for (const sl of S.slots){
    if (filled>=lim) break;
    if (sl.card) continue;
    if (S.delveDeck.length){ sl.card = S.delveDeck.shift(); sl.progress = startProg(sl.card); filled++; }
    else { reachBottom(); return; }
  }
}
function reachBottom(){
  S.slots.forEach(sl=>{ if (sl.card) S.removed.push(sl.card); });
  S.phase = 'final'; S.master.revealed = true; sfx('boss');
  S.slots = S.trials.map(t=>({card:t, progress:0, down:false}));
  log(`최심층 도달! 던전 보스 「${S.master.def.name}」이(가) 모습을 드러냈습니다. 시련 4장이 펼쳐집니다.`, 'sys');
  setTimeout(()=>modal({title:'최심층 도달!', html:`<div class="center-cards">${masterHTML({w:'230px', noZb:true})}</div><p>남아 있던 던전 카드를 모두 치웠습니다. 보스 주위에 <b>시련 카드 4장</b>이 놓입니다.<br>
    시련을 완료할 때마다 보스의 <b>약점 색상</b>이 공개되고, 그 색상으로 보스에게 도전할 수 있습니다.<br>보스와 시련의 고유 효과를 확인하세요. 깊이 파기·위로 후퇴 효과는 무시합니다.</p>`, buttons:[{label:'보스전 시작',primary:true}]}), 50);
}

function itemUsable(s){
  if (!s.charged || over() || S.busy) return false;
  if (hasRule('noItem')) return false;
  return !!(S.A && S.A.step<=3 && !S.A.dice && s.i===S.cur);   // 자기 차례의 시도에만
}
async function useItem(i){
  if (S.busy || over()) return;

  if (!itemUsable(s)){ toast(`부적은 ${CFG.itemTiming}에 사용할 수 있습니다.`); return; }
  const ok = await modal({title:`부적 사용: ${s.def.item_name}`, html:`<div class="center-cards">${itemHTML(s,{w:'200px', noZb:true})}</div><p>${esc(s.def.item_text)}</p>`,
    buttons:[{label:'취소',value:false},{label:'사용 (뒤집기)',value:true,primary:true}]});

  s.charged = false; S.busy = true; sfx('item');
  log(`${s.def.name}: 부적 「${s.def.item_name}」 사용 — ${s.def.item_line||''}`, 'good');
  await itemFx(s);
  if (s.def.item_choices && s.def.item_choices.length){
    const r = await pickModal({title:`${s.def.item_name}: 힘을 빌릴 모습 1개 선택`, desc:'고른 효과가 이번 시도에 적용됩니다.',
      items:s.def.item_choices.map((c,k)=>({v:String(k), html:`<div class="stone"><div class="sg">${c.glyph}</div><b>${esc(c.name)}</b><div>${tcol(esc(c.text))}</div></div>`}))});
    const ch = s.def.item_choices[+(r[0]||0)];
    log(`${s.def.name}: 「${ch.name}」 사용 — ${ch.text}`, 'good');
    for (const cl of parseEffect(ch.effect).clauses){ if (over()) break; if (cl.conds.every(c=>condOK(c))) await applyOps(cl.ops, ch.name, s); }
    S.busy = false; render(); return;
  }
  for (const cl of parseEffect(s.def.item_effect).clauses){ if (over()) break; if (cl.conds.every(c=>condOK(c))) await applyOps(cl.ops, s.def.item_name, s); }
  S.busy = false; render();
}

/* ---------------- 보여주기 (카드는 패에 남음, 탐험대원마다 시도당 1장) ---------------- */
function showUsable(c){
  if (!S || over() || S.busy || !c || !c.show || !S.A || S.A.step>=4) return false;

function itemFx(s){
  return new Promise(res=>{
    if (window.__noFx){ res(); return; }
    const el = document.createElement('div'); el.className = 'itemfx'; el.style.setProperty('--sc', s.def.color);
    el.innerHTML = `<div class="fxring"></div><div class="fxbox"><div class="fxg">${miniHTML(s.def)}</div><div class="fxname">${esc(s.def.item_name)}</div><div class="fxline">${esc(s.def.item_line||'')}</div><div class="fxtext">${esc(s.def.item_text)}</div></div>`;
    document.body.appendChild(el);
    const end = () => { if (!el.parentNode) return; el.classList.add('out'); setTimeout(()=>{ el.remove(); res(); }, 250); };
    el.addEventListener('click', end); setTimeout(end, 1700);
  });
}
async function bossLowGuard(){
  const m = S.master; const d = effDiff({type:'master'}); const left = d - m.progress;
  const k = m.items.findIndex(it => parseRules(it.rules).some(r=>r.k==='lowGuard'));
  if (k<0) return;
  const r = parseRules(m.items[k].rules).find(r=>r.k==='lowGuard'); const th = +r.f || 6;
  if (left<=0 || left>th) return;
  const it = m.items.splice(k,1)[0];
  m.baseDiff = (m.baseDiff!=null ? m.baseDiff : +m.def.diff) + r.n;
  log(`☗ 보스가 「${it.name}」을(를) 먹었다! 보스 난이도 +${r.n} (남은 진행도 ${left} → ${left+r.n})`, 'bad');
}

function pbarHTML(p, d){

}

function hungerCounter(c){
  if (!S || !S.exhaustActive.includes(c)) return '';
  const out = [];
  parseRules(c.rules).forEach(r=>{
    if (r.k==='failLose') out.push(`실패 ${c.fails||0}/${r.n}`);
    if (r.k==='setLose') out.push(`「${c.name}」 ${S.exhaustActive.filter(x=>x.name===c.name).length}/${r.n}장`);
  });
  return out.join(' · ');
}
function slotState(k){
  if (!S || over()) return '';
  if (S.A){ const t = S.A.tg; const isT = (k==='m' && t.type==='master') || (t.type==='slot' && t.i===k); return isT ? 'tgt' : 'off'; }
  if (S.busy) return '';
  if (k==='m' && S.phase!=='final') return '';
  if (k!=='m' && S.slots[k] && S.slots[k].down) return '';
  if (S.T.acted) return 'off';
  if (!slotPickable(k)) return 'off';
  return S.selSlot===k ? 'sel' : 'can';
}
const RIB = {sel:'선택됨', tgt:'도전 중'};
function slotCardHTML(sl, i, o={}){
  const c = sl.card; if (!c) return '';
  if (sl.down) return trialDownHTML(sl, {...o, zoom:`slot:${i}`});
  const st = o.noact ? '' : slotState(i);
  const base = {...o, cls:[o.cls||'', st].join(' '), zoom:`slot:${i}`,
    key: o.noact ? '' : `F${i+1}`, rib: o.noact ? '' : RIB[st], attrs: o.noact ? '' : `data-act="slot" data-i="${i}"`};
  if (c.kind==='event') return eventHTML(c, base);
  return chalHTML(c, {...base, progress: sl.progress, diff: cardDiff(c, sl), lock: c.kind==='trial' ? trialLocked(c) : null});
}

      const f = document.createElement('i'); f.className = 'numfx '+(k==='hp' ? (fx.d<0?'bad':'good') : 'deck'); f.textContent = (fx.d>0?'+':'')+fx.d; f.style.animationDelay = (fx.t - t)+'ms'; el.parentElement.style.position = 'relative'; el.after(f); }
  }

function fit(){

  const v = S.seekers[S.view] || cur(); const n = Math.max(v.hand.length, 5);
  const byH = window.__VH ? Math.round(window.__VH*0.2) : Math.max(100, Math.min(235, window.innerHeight*0.21));   // 작은 화면: 손패를 줄여 던전 카드에 공간을 준다
  const availW = seat ? seat.clientWidth - (info?info.offsetWidth:0) - 30 : 900;
  const hw = Math.floor(Math.max(110, Math.min(byH, availW/(7*1.07))));   // 패 장수와 관계없이 7장 기준 크기로 고정(화면 배치가 흔들리지 않게). 8장부터 겹쳐서 보여 준다
  { const hn = v.hand.length, gap = hw*0.07, hd = document.querySelector('.hand'); if (hd) hd.style.setProperty('--ov', (hn>1 ? Math.min(gap, (availW - hn*hw)/(hn-1)) : 0)+'px'); }   // 6장 기준 크기 (가독성 우선), 더 많으면 가로 스크롤
  document.documentElement.style.setProperty('--hw', hw+'px');

}

function actionHTML(){

    /* 고른 카드의 설명은 오른쪽 카드 정보 칸에 나온다 */

  } else {

    h += diceHTML(A,false);

  { const dv = A.dice && !A.rolling ? diceValue(A) : null;
    h += `<div class="tally1" title="${esc(A.notes.join(', '))}">행동${A.action?` 「${esc(A.action.name)}」`:''} <b>+${A.actionVal}</b> · ${tallyParts(A)} · 주사위 <b>${dv==null?'—':'+'+dv}</b> = <b class="tot">+${pendingTotal(A)}</b></div>`; }
  return h;
}
function handState(c){
  if (!S.A || S.busy) return '';
  const A = S.A;
  if (A.step===1){
    if (c.owner!==S.cur) return 'off';
    if (A.sel===c.uid) return 'sel';
    return actionEligible(c) ? 'can' : 'off';

  if (A.step===2){

    if (A.selBoost.includes(c.uid)) return 'sel';

  }
  return '';
}

function topModal(){ const r = $('#modal-root'); return r.lastElementChild; }
function modal({title, html, buttons=[{label:'확인',primary:true}], wide, closeX}){
  return new Promise(res=>{
    const el = document.createElement('div'); el.className = 'mback';
    const cancelIdx = buttons.findIndex(b=>b.cancel || b.value===false);
    const primIdx = buttons.findIndex(b=>b.primary);
    const head = closeX ? `<div class="mhead"><h3>${title}</h3><button class="mx" data-mb="0" title="닫기 (Esc)">✕</button></div>` : `<h3>${title}</h3>`;
    el.innerHTML = pxui(`<div class="modal ${wide?'wide':''}">${head}<div class="mbody">${html}</div>
      <div class="mbtns"><span class="mkeys">${primIdx>=0?'<kbd>Enter</kbd> 확인':''}${cancelIdx>=0||buttons.length===1?' · <kbd>Esc</kbd> 닫기':''}</span>
      ${buttons.map((b,i)=>`<button data-mb="${i}" class="${b.primary?'primary':''}">${b.label}</button>`).join('')}</div></div>`);
    const done = i => { el.remove(); res(buttons[i].value); };
    el.addEventListener('click', e=>{ const b = e.target.closest('[data-mb]'); if (b) done(+b.dataset.mb); });
    el._enter = () => { if (primIdx>=0) done(primIdx); else if (buttons.length===1) done(0); };
    el._cancel = () => { if (cancelIdx>=0) done(cancelIdx); else if (buttons.length===1) done(0); };
    el._num = () => {};
    $('#modal-root').appendChild(el);
    const pb = el.querySelector('button.primary'); if (pb) pb.focus({preventScroll:true});
  });
}
function pickModal({title, desc, items, n=1, skip=false}){
  return new Promise(res=>{
    const sel = []; const need = Math.min(n, items.length);
    const el = document.createElement('div'); el.className = 'mback';
    const draw = () => {
      el.innerHTML = pxui(`<div class="modal wide"><h3>${title}</h3><p>${desc||''}</p>
        <div class="pickgrid">${items.map((it,k)=>{ const num = k<9?`<span class="num">${k+1}</span>`:'';
          return it.raw ? it.html.replace('class="pick', `data-pick="${it.v}" class="pick ${sel.includes(it.v)?'on':''}`).replace('</div>', `${num}</div>`) :
          `<div class="pick ${sel.includes(it.v)?'on':''}" data-pick="${it.v}">${num}${it.html}</div>`; }).join('')}</div>
        <div class="mbtns"><span class="mkeys">클릭 또는 <kbd>1~9</kbd> 선택${n>1?' · <kbd>Enter</kbd> 확인':''} · <kbd>Esc</kbd> ${n>1?'선택 해제':skip?'사용하지 않음':''}</span>
          ${skip?'<button data-x="skip">사용하지 않음</button>':''}${n>1?`<button class="primary" data-x="ok" ${sel.length!==need?'disabled':''}>확인 (${sel.length}/${need})</button>`:''}</div></div>`);
    };
    const pick = v => {
      if (n===1){ el.remove(); res([v]); return; }
      const k = sel.indexOf(v); if (k>=0) sel.splice(k,1); else if (sel.length<need) sel.push(v); draw();
    };
    draw();
    el.addEventListener('click', e=>{
      if (e.target.closest('.zb')) return;
      const p = e.target.closest('[data-pick]'); const x = e.target.closest('[data-x]');
      if (p){ pick(p.dataset.pick); return; }
      if (x){ if (x.dataset.x==='skip'){ el.remove(); res([]); } else if (sel.length===need){ el.remove(); res([...sel]); } }
    });
    el._num = k => { if (items[k]) pick(items[k].v); };
    el._enter = () => { if (n>1 && sel.length===need){ el.remove(); res([...sel]); } };
    el._cancel = () => { if (n>1 && sel.length){ sel.pop(); draw(); } else if (skip){ el.remove(); res([]); } };
    $('#modal-root').appendChild(el);
  });
}

/* =================== 카드 문구 넘침 자동 맞춤 =================== */
// 문구가 넘치면 단계적으로: 그림 축소 → 글자 축소 → 이야기 글 숨김(크게 보기·정보창에서는 모두 보임)
const FITS = ['fit1','fit2','fit3','fit4','fit5'];
function fitLine(el, min){   // 한 줄에 들어가도록 글자 크기를 줄인다
  el.style.fontSize = ''; if (el.scrollWidth <= el.clientWidth + 1) return;
  const base = parseFloat(getComputedStyle(el).fontSize);
  for (let k = 0.94; k >= min - 0.001; k -= 0.06){ el.style.fontSize = (base*k).toFixed(2)+'px'; if (el.scrollWidth <= el.clientWidth + 1) return; }
}
function fitCard(card){
  card.querySelectorAll('.name').forEach(el=>fitLine(el, 0.58));
  card.querySelectorAll('.rp.g4 .rr').forEach(el=>fitLine(el, 0.58));
  const t = card.querySelector('.txt'); if (!t) return;
  card.classList.remove(...FITS);
  for (const f of FITS){ if (t.scrollHeight <= t.clientHeight + 1) return; card.classList.add(f); }
}
function fitBlock(el, minPx, base){   // 칸 높이에 맞게 글자 크기를 줄인다(부적·특성 설명). base: 맞출 공통 높이
  el.style.fontSize = ''; ['display','height','-webkit-line-clamp'].forEach(p=>el.style.removeProperty(p));
  const H0 = el.offsetHeight, H = Math.max(H0, base||0); let px = parseFloat(getComputedStyle(el).fontSize);
  el.style.setProperty('display','block','important'); el.style.setProperty('height','auto','important');   // 줄 수 제한 없이 실제 높이를 잰다
  while (el.offsetHeight > H && px > minPx){ px -= 0.5; el.style.fontSize = px+'px'; }
  const need = Math.max(el.offsetHeight, H);
  el.style.removeProperty('display'); el.style.removeProperty('height');
  if (need > H0 + 1){ el.style.setProperty('height', need+'px', 'important'); el.style.setProperty('-webkit-line-clamp','unset','important'); el.style.setProperty('display','block','important'); }   // 가장 작은 글자로도 넘치면 칸을 늘려 잘리지 않게
}
let SIBH = {k:'', h:0};
function sibBaseH(el){   // 탐험대 전원의 부적·특성 글 중 가장 긴 것이 들어가는 높이 (탭을 바꿔도 칸 크기 고정)
  if (!S) return 0;
  const k = el.offsetWidth+'|'+innerWidth+'x'+innerHeight+'|'+S.seekers.map(s=>s.def.id).join();
  if (SIBH.k===k) return SIBH.h;

  let h = 0;
  S.seekers.forEach(s=>{ const d = s.def;
    [`<b>부적 「${esc(d.item_name)}」</b><span class="st">충전 대기</span> ${tcol(esc(d.item_text))}`, `<b>특성 「${esc(d.ability_name)}」</b> ${tcol(esc(d.ability_text))}`].forEach(html=>{ pr.innerHTML = pxui(html); fitBlock(pr, 10.5); h = Math.max(h, pr.offsetHeight); }); });
  pr.remove(); SIBH = {k, h}; return h;
}
function fitCards(root){ (root||document).querySelectorAll('.card').forEach(c => { if (c.offsetParent!==null) fitCard(c); }); if (!root){ { const sb = document.querySelectorAll('.sinfo .sib'); const bh = sb.length ? sibBaseH(sb[0]) : 0; sb.forEach(el=>fitBlock(el, 10.5, bh)); } document.querySelectorAll('.status .sg.fx').forEach(fitChips); } }
function fitChips(box){   // 적용 중인 효과가 칸에 다 안 들어가면 뒤쪽을 접고 '+N'으로 표시(마우스를 올리면 전체)

}

/* ---------- 도트 아이콘 정렬: 12px·18px 원본 중 하나를 정수 배율로만 표시하고, 위치를 화면 픽셀에 맞춘다 ---------- */
var PXQ = 0, PXT = null;
function bodyScale(){ const b = document.body; return b && b.offsetWidth ? b.getBoundingClientRect().width / b.offsetWidth : 1; }
function pxSnap(){
  PXQ = 0; if (window.__noFx) return;
  const dpr = window.devicePixelRatio || 1, bs = bodyScale();
  const plan = [...document.querySelectorAll('.px:not([data-ps])')].map(el=>{
    const w = parseFloat(getComputedStyle(el).width); if (!w) return null;
    const dev = w * bs * dpr;
    let best = null; for (const a of [12,18]) for (let k=1;k<=8;k++){ const d = Math.abs(a*k - dev) + (a===18 ? 0.01 : 0); if (!best || d < best.d) best = {d, a, k}; }
    return {el, css: best.a*best.k/(dpr*bs), a: best.a}; });
  plan.forEach(p=>{ if (!p) return; p.el.style.width = p.el.style.height = p.css+'px'; p.el.classList.toggle('p18', p.a===18); p.el.dataset.ps = '1'; });
  pxPos(); clearTimeout(PXT); PXT = setTimeout(pxPos, 900);   // 등장 연출이 끝난 뒤 위치를 한 번 더 맞춘다
}
function pxPos(){
  if (window.__noFx) return;
  const dpr = window.devicePixelRatio || 1, bs = bodyScale();
  const els = [...document.querySelectorAll('.px[data-ps]')];
  const rs = els.map(el=>el.getBoundingClientRect());
  els.forEach((el,i)=>{ const r = rs[i]; if (!r.width) return; const tx = el.__tx || 0, ty = el.__ty || 0;
    const bx = r.left - tx*bs, by = r.top - ty*bs;
    const ox = (Math.round(bx*dpr) - bx*dpr)/dpr/bs, oy = (Math.round(by*dpr) - by*dpr)/dpr/bs;
    if (Math.abs(ox-tx) > 0.005 || Math.abs(oy-ty) > 0.005){ el.__tx = ox; el.__ty = oy; el.style.translate = ox.toFixed(3)+'px '+oy.toFixed(3)+'px'; } });
}
function pxSnapSoon(){ if (!PXQ) PXQ = requestAnimationFrame(pxSnap); }
if (typeof MutationObserver!=='undefined') new MutationObserver(pxSnapSoon).observe(document.documentElement, {childList:true, subtree:true});
window.addEventListener('resize', ()=>{ document.querySelectorAll('.px[data-ps]').forEach(el=>{ el.removeAttribute('data-ps'); el.style.width = el.style.height = el.style.translate = ''; el.__tx = el.__ty = 0; el.classList.remove('p18'); }); pxSnapSoon(); });

<tr><td><b>기술 카드</b></td><td>도전을 해결하는 카드. 위쪽 큰 숫자가 <b>행동 수치</b>, 아래쪽 막대가 <b>향상 수치와 향상 색</b>입니다.</td></tr>
<tr><td><b>던전 카드</b> ${DATA.delve.length}장</td><td><b>도전</b>(전투·장애물·퍼즐·함정)과 <b>이벤트</b> 두 종류. 섞어서 던전 덱을 만듭니다.</td></tr>
<tr><td><b>던전 보스</b> 3장</td><td>한 판에 1장만 쓰며, 최심층에 도달할 때까지 정체가 숨겨져 있습니다.</td></tr>
<tr><td><b>시련 카드</b> 12장</td><td>최심층에서 보스를 둘러싸는 카드. 보스전마다 4장이 나옵니다. 완료하면 보스의 약점이 드러납니다.</td></tr>
<tr><td><b>배고픔 카드</b> 6장</td><td>패를 새로 뽑을 때 받는 불리한 카드.</td></tr>
<tr><td><b>주사위</b></td><td><b>기술 주사위</b> 3개(적▼·녹◆·청■)와 <b>운명 주사위</b> 1개(☀ 행운 / ☠ 불운).</td></tr></table>

<h2 id="r-color">4. 카드 색상과 팀 HP</h2>
<p>대부분의 카드는 ${colChip('R')} ${colChip('G')} ${colChip('B')} 세 가지 색입니다. 도전을 시도할 때는 <b>도전의 색과 같은 색의 기술 카드</b>만 행동으로 쓸 수 있습니다.</p>
<ul><li><b>2색 카드</b>: 두 색 중 어느 쪽으로도 쓸 수 있습니다.</li>
<li>${colChip('W')} <b>백색 카드</b>: 세 색 모두와 일치합니다.</li>
<li>${colIcon('K')} <b>흑색 향상</b>: 향상 막대가 흑색인 카드는 향상에 쓸 수 없습니다.</li></ul>
<p><b>팀 HP</b> — 모든 탐험대원이 HP 하나를 함께 씁니다. 보통 ${CFG.hpNormal}, 어려움 ${CFG.hpHard}로 시작하고, 회복해도 시작 값을 넘을 수 없습니다. <b>0이 되면 즉시 패배</b>합니다. 회복 수단은 드물니 아껴 쓰세요.</p>

<h2 id="r-setup">5. 준비</h2>
<p class="muted">PC 게임에서는 아래 과정이 자동으로 진행됩니다. 흐름을 이해하는 용도로 읽어 주세요.</p>
<ol><li>던전 보스 3장 중 1장을 무작위로 골라 <b>정체를 숨긴 채</b> 가운데에 놓습니다.</li>
<li>각자 탐험대원을 고르고, 부적을 <b>충전된 상태</b>로 놓습니다.</li>
<li>기술 카드 18장을 섞어 기술 덱을 만들고 패를 뽑습니다.
<table><tr><th>탐험대원 수</th><th>1마리</th><th>2마리</th><th>3마리</th><th>4마리</th></tr><tr><td>패</td><td>${CFG.handSize['1']}장</td><td>${CFG.handSize['2']}장</td><td>${CFG.handSize['3']}장</td><td>${CFG.handSize['4']}장</td></tr></table></li>
<li>시련 카드는 적▼·청■·녹◆에서 1장씩 무작위로 뽑고 보스의 특수 시련 1장을 더해 4장을 옆에 두고, 배고픔 카드 6장은 섞어서 뒷면으로 둡니다.</li>
<li>던전 덱을 섞어 맨 위 <b>4장을 보스 주위에</b> 펼칩니다.</li>
<li>이어서 던전 덱에서 ${CFG.setupDiscard}장을 버려 <b>「지나온 층」</b>(던전 버린 더미)을 만듭니다.</li></ol>

<h2 id="r-turn">6. 차례 진행</h2>
<p>자기 차례에 <b>보스 주위의 던전 카드 4장 중 1장</b>을 골라 상호작용합니다.</p>
<table><tr><th>고른 카드</th><th>하는 일</th></tr>
<tr><td><b>✧ 이벤트</b></td><td>카드의 지시를 순서대로 실행하고 지나온 층에 버립니다. 이벤트는 <b>골랐을 때만</b> 발동합니다.</td></tr>
<tr><td><b>⚔ 도전</b></td><td>그 도전을 <b>시도</b>합니다. → 6. 도전 시도하기</td></tr></table>
<p><b>차례의 끝</b></p>
<ol><li>보스 주위의 던전 카드가 4장보다 적으면, 던전 덱에서 뽑아 다시 4장으로 채웁니다.</li>
<li>이번 차례에 쓴 기술 카드는 <b>각 주인의 버린 더미</b>로 갑니다. 다른 대원이 향상으로 준 카드는 그 대원의 버린 더미로 갑니다.</li>
<li>이번 차례에 행동으로 쓴 카드의 「차례 종료 시」 효과가 적용됩니다(던전 카드를 다시 채운 뒤).</li>
<li>다음 탐험대원의 차례가 됩니다.</li></ol>
<div class="note warn">차례를 시작하거나 끝낼 때 <b>카드를 뽑지 않습니다.</b> 패를 새로 받는 방법은 <b>배고픔 선언</b>뿐입니다. → 8. 배고픔</div>

<h2 id="r-try">7. 도전 시도하기</h2>
<p>도전 카드에는 <b>유형</b>(전투·장애물·퍼즐·함정), <b>난이도</b>, <b>색</b>, <b>보상</b>(🏆), <b>불이익</b>(✘)이 적혀 있습니다. 도전에 올린 <b>진행도</b>가 난이도 이상이 되면 완료입니다.</p>
<div class="steps">
<div><b>1단계 · 행동</b> <span class="muted">(선택)</span><br>도전과 같은 색의 기술 카드 1장을 냅니다. 그 카드의 <b>행동 수치</b>를 더하고, 카드에 적힌 효과가 적용됩니다.<br><span class="muted">행동을 내지 않으면 향상도 받을 수 없어 바로 3단계로 넘어갑니다.</span></div>
<div><b>2단계 · 향상</b> <span class="muted">(최대 2장)</span><br>다른 카드를 <b>향상</b>으로 더해 수치를 올립니다. 향상 막대의 색이 도전 색이거나 백색이어야 합니다. 향상으로 쓴 카드의 효과 문구는 <b>무시</b>합니다(「향상으로 쓰면」 효과 제외).<br>• 혼자 할 때: <b>자기 패</b>로 자신을 향상<br>• 2마리 이상: <b>다른 탐험대원만</b> 나를 향상할 수 있음</div>
<div><b>3단계 · 주사위</b><br>기술 주사위 3개와 운명 주사위 1개를 굴립니다.<br>• 기술 주사위: <b>도전 색과 같은 색</b>이 나올 때마다 +1<br>• 운명 주사위: ☀ 행운이면 +1, ☠ 불운이면 0<br>다시 굴리기 효과가 있으면 원하는 주사위를 골라 다시 굴립니다(운명 주사위 포함). 그 뒤 「주사위를 굴린 뒤」 효과가 적용됩니다.</div>
<div><b>4단계 · 완료 또는 실패</b><br>행동 + 향상 + 주사위 + 보너스를 모두 더해 도전에 <b>진행도</b>로 올립니다. 이전에 올려 둔 진행도와 합쳐 난이도 이상이면 <b>완료</b>, 아니면 <b>실패</b>입니다. → 7. 완료와 실패</div>
</div>
<div class="ex"><b>예시</b> — 난이도 7의 적▼ 전투를 시도합니다. 수치 2인 적▼ 카드를 행동으로 내고(2), 향상 2장(+1, +2)을 받고(3), 주사위에서 적▼ 1개와 ☀가 나왔습니다(2). 합계 <b>7</b>로 난이도와 같으니 완료입니다.</div>
<p class="note"><b>수치와 진행도</b> — 한 번의 시도에서 더하는 값을 <b>수치</b>, 그 결과 도전 카드에 쌓이는 값을 <b>진행도</b>라고 부릅니다. 카드의 「이 기술의 수치 +2」는 이번 시도에만, 「다른 도전에 진행도 1 추가」는 다른 도전 카드에 바로 쌓입니다.</p>

<h2 id="r-result">8. 완료와 실패</h2>
<table><tr><th></th><th>완료</th><th>실패</th></tr>
<tr><td>기본</td><td>🏆 보상을 받고, 도전 카드를 치웁니다.</td><td>✘ 불이익을 받습니다. 진행도는 <b>그대로 남습니다.</b></td></tr>
<tr><td>운명 주사위</td><td>☀면 카드의 <b>☀ 행운 보너스</b>도 받습니다.</td><td>☠면 카드의 <b>☠ 불운</b> 불이익도 받습니다.</td></tr>
<tr><td>카드 효과</td><td>「도전 완료 시」 효과가 적용됩니다.</td><td>「도전 실패 시」 효과가 적용됩니다.</td></tr></table>
<p class="note"><b>처리 순서</b>: ① 행동 카드의 「도전 완료 시」·「도전 실패 시」 효과 → ② 🏆 보상(☀ 행운 보너스) 또는 ✘ 불이익(☠ 불운) → ③ 완료한 도전 카드 치우기 → ④ 행동 카드의 「행동 후」 효과(카드 뽑기 등)</p>
<p class="note"><b>실패 피해 계산</b>: ① 실패 피해 = ✘ 불이익의 피해 + ☠ 불운의 피해 + 「실패 피해 +N」(배고픔·필드·도전 규칙) → ② 「이번 시도 실패 피해 -N」과 특성의 피해 감소를 뺍니다(0보다 작아지지 않음) → ③ 「받아넘기기」가 있으면 남은 피해를 그만큼 받지 않고, 막은 만큼 그 도전에 진행도를 올립니다 → ④ 남은 피해에 「이번 차례에 받는 피해 막기」를 적용합니다. 「불이익 무시」는 ✘·☠ 불이익 전체를 없앱니다. 패 버리기 같은 피해가 아닌 불이익은 감소와 관계없이 받습니다.</p>
<p class="muted">☀ 행운 보너스와 ☠ 불운은 난이도 8 이상의 도전(그리고 퍼즐의 ☀ 깊이 파기)에만 있습니다.</p>
<ul><li><b>시도하지 않고 완료</b>: 다른 효과로 진행도가 난이도에 닿으면 그 도전은 즉시 완료됩니다. 보상은 현재 차례의 탐험대원이 받습니다.</li>
<li><b>도전 버리기</b>: ✂ 효과로 버린 도전은 완료가 아니므로 보상이 없습니다.</li></ul>
<table><tr><th>유형</th><th>성격</th><th>🏆 보상</th><th>✘ 불이익</th></tr>
<tr><td>⚔ 전투</td><td>진행도를 넘기거나 가져오는 효과가 많음</td><td>깊이 파기 2~4</td><td>피해 1~2</td></tr>
<tr><td>▲ 장애물</td><td>향상 제한, 주사위 제한</td><td>깊이 파기 2~4</td><td>위로 후퇴 1~3</td></tr>
<tr><td>✥ 퍼즐</td><td>주사위 결과가 중요</td><td>카드 뽑기·배고픔 제거·HP 회복·부적 충전</td><td>카드 버리기 1~3</td></tr>
<tr><td>⚠ 함정</td><td>실패의 대가가 큼</td><td>깊이 파기 2~4</td><td>피해 1~2 (+ 추가 불이익)</td></tr></table>
<p class="muted"><b>깊이 파기</b>는 던전 덱 맨 위 카드를 지나온 층으로 버려 최심층에 가까워지는 것, <b>위로 후퇴</b>는 지나온 층의 카드를 던전 덱 맨 아래로 되돌려 멀어지는 것입니다.</p>

<h2 id="r-hunger">9. 배고픔</h2>
<p>패를 새로 받으려면 <b>차례를 시작할 때 배고픔을 선언</b>합니다.</p>
<ol><li>패에 남은 카드를 모두 버립니다.</li>
<li>배고픔 덱에서 1장을 뽑아 공개합니다. 공개된 배고픔 카드는 <b>계속 효과가 적용</b>됩니다.</li>
<li>패 크기만큼 새로 뽑고, 차례를 평소대로 진행합니다.</li></ol>
<ul><li>패가 0장이면 <b>반드시</b> 선언해야 합니다.</li>
<li>기술 덱이 비면 버린 더미를 섞어 새 덱을 만듭니다.</li>
<li>🍎 <b>배고픔 제거</b> 효과로 공개된 배고픔 카드 1장을 골라 배고픔 덱으로 되돌릴 수 있습니다.</li>
<li>「허기」 3장을 모두 획득하면 <b>패배</b>합니다.</li></ul>

<h2 id="r-item">10. 탐험대 부적</h2>
<p>탐험대원마다 하나씩 있는 필살기입니다. 충전된 상태로 시작하며, <b>${esc(CFG.itemTiming)}</b>에 쓸 수 있습니다(다른 탐험대원의 차례에는 쓸 수 없음). 쓰면 뒤집히고, ⟳ <b>부적 충전</b> 효과로 다시 쓸 수 있게 됩니다. 도전 시도 중에 충전하면 그 시도가 끝난 뒤 충전됩니다. 이브이의 부적은 쓸 때 진화형 4가지 중 하나를 골라 그 힘을 받습니다.</p>

<h2 id="r-boss">11. 최심층과 보스전</h2>
<p>던전 카드를 채워야 하는데 <b>던전 덱이 비어 있으면</b> 최심층에 도달합니다.</p>
<ol><li>남은 던전 카드와 그 위의 진행도를 모두 치웁니다.</li>
<li>보스를 앞면으로 뒤집습니다. 이때부터 보스의 효과가 적용됩니다.</li>
<li>시련 카드 4장을 보스 주위에 펼칩니다.</li></ol>
<ul><li>보스는 처음에 <b>모든 색에 무적</b>이라 시도할 수 없습니다.</li>
<li>시련을 완료하면 그 시련이 뒤집히며 <b>보스의 약점 색</b>이 공개됩니다(시련 색 = 약점 색). 이후 그 색으로 보스를 시도할 수 있습니다. 약점이 여러 개면 시도할 때 색을 하나 고릅니다.</li>
<li>시련 중 1장은 보스마다 정해진 <b>특수 시련</b>입니다. 약점을 공개하지 않지만, 남겨 두면 보스를 쓰러뜨리기 어려워집니다.</li>
<li>약점은 <b>시도할 색</b>만 정합니다. 「다른 도전에 진행도」 효과는 약점이 공개되기 전에도 보스에게 쓸 수 있습니다.</li>
<li>보스 도전에 실패하면 진행도는 남고 <b>보스의 반격</b>(피해 1 + ☠면 보스별 추가 불이익)을 받습니다.</li>
<li>보스는 <b>전투</b> 유형입니다. 「전투라면」 효과가 보스에게도 적용됩니다.</li>
<li>보스전 동안 깊이 파기·위로 후퇴는 무시하며, 시련은 버릴 수 없습니다.</li></ul>
<div class="note warn"><b>${esc(CFG.backName)}</b> — ${esc(CFG.backText)}<br><b>보스의 소지품</b> — 일부 이벤트는 당장은 이득이지만 보스가 소지품을 얻습니다. 소지품은 최심층에서 효과를 발휘하며, 탐내기 같은 기술로 빼앗을 수 있습니다.</div>

<h2 id="r-end">12. 승리와 패배</h2>
<ul><li><b>승리</b>: 보스 도전을 완료합니다.</li>
<li><b>패배</b>: 팀 HP가 0이 되거나, 「허기」 배고픔 카드 3장을 모두 획득합니다.</li></ul>
<p><b>게임 변형</b> — <b>어려움</b>: HP ${CFG.hpHard}로 시작합니다. <b>빠른 게임</b>: 준비 때 던전 카드 ${CFG.quickDiscard}장을 버리고, 피해 2와 배고픔 1장을 받고 시작합니다.</p>

<h2 id="r-more">13. 더 알아두기</h2>
<p class="muted">처음에는 건너뛰어도 됩니다. 카드에서 처음 보는 표시가 나오면 여기서 찾아보세요.</p>

<tr><td><b>🌀 반동</b></td><td>강하지만 대가가 하나 붙은 기술(피해 1, 패 버리기, 주사위를 굴리지 않음 등).</td></tr>

<tr><td><b>식량 도전 · 온천 · 샘</b></td><td>식량 도전(열매를 지키는 꼬마돌 등)은 성공하면 배고픔을 제거하고, 실패해도 불이익이 가볍습니다(카드 1장 버리기 또는 피해 1). 숨겨진 온천·별이 쏟아지는 샘은 난이도 12로 어렵지만 <b>실패하면 HP를 회복</b>합니다.</td></tr>
