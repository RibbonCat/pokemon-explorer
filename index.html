/* =================== 입력 처리 =================== */
// 같은 카드를 짧은 간격으로 두 번 클릭 = 더블클릭(크게 보기)으로 처리
const CLICK = {key:null, t:0}; let EXEC = null;
function dbl(key){ const now = Date.now(); const hit = CLICK.key===key && now-CLICK.t<380; CLICK.key = hit?null:key; CLICK.t = now; return hit; }
function later(fn){ clearTimeout(EXEC); EXEC = setTimeout(()=>{ EXEC=null; fn(); }, 300); }
function cardClick(el, key, fn){
  const zk = (el.closest('[data-zoom]')||{}).dataset?.zoom;
  if (dbl(key)){ clearTimeout(EXEC); EXEC=null; if (zk) showZoom(zk); return; }
  fn();
}

/* =================== 탐험 시작 연출 =================== */
// 화면이 어두워졌다가 밝아지고 → 던전의 잠긴 문이 열리고 → 던전 카드가 한 장씩 → 패가 한 장씩
var INTRO = null;
// 시작 화면 → (오프닝) → 탐험대 고르기
function goFromTitle(){ wipeTo(()=>{ SETUP.screen = opOn() ? 'opening' : 'pick'; SETUP.op = 0; render(); }); }
function opNext(){ if ((SETUP.op||0) >= OPENING.length-1) return opEnd(); SETUP.op = (SETUP.op||0) + 1; sfx('select'); render(); }
function opEnd(){ if (SETUP.screen!=='opening') return; wipeTo(()=>{ SETUP.screen = 'pick'; render(); }); }
function opToggle(){ const on = !opOn(); try { localStorage.setItem('pmd_opening', on?'1':'0'); } catch(e){} sfx('select'); toast(on ? '오프닝을 켰습니다.' : '오프닝을 껐습니다.'); render(); }
function toggleSound(){ const on = SND.toggle(); if (on){ SND.init(); sfx('confirm'); syncMusic(); } toast(on ? '소리를 켰습니다.' : '소리를 껐습니다.'); render(); }
function startGame(init){
  if (INTRO || WIPING) return; sfx('confirm'); init = typeof init==='function' ? init : newGame;
  if (window.__noFx){ init(); return; }
  const f = document.createElement('div'); f.id = 'fade'; document.body.appendChild(f);
  requestAnimationFrame(()=>f.classList.add('on'));
  INTRO = {t:[]};
  INTRO.t.push(setTimeout(()=>{
    init(); document.body.classList.add('intro'); setTimeout(()=>sfx('door'), 520);
    const bw = document.querySelector('.boardwrap');
    if (bw){ const d = document.createElement('div'); d.id = 'door';
      d.innerHTML = '<div class="dl"><i class="ring"></i></div><div class="dr"><i class="ring"></i></div><div class="lock"><i></i></div>'; bw.appendChild(d); }
    const slots = [...document.querySelectorAll('.cross .slot')];
    const order = [...slots.filter(s=>s.classList.contains('m')), ...slots.filter(s=>!s.classList.contains('m'))];   // 보스 카드 먼저
    order.forEach((s,i)=>{ s.classList.add('introcard'); s.style.animationDelay = (1250 + i*170)+'ms'; });
    document.querySelectorAll('.hand .card').forEach((c,i)=>{ c.classList.add('introhand'); c.style.animationDelay = (1250 + order.length*170 + 150 + i*90)+'ms'; });
    f.classList.remove('on');
  }, 450));
  INTRO.t.push(setTimeout(()=>{ const f2 = document.getElementById('fade'); if (f2) f2.remove(); }, 950));
  INTRO.t.push(setTimeout(endIntro, 1250 + 6*170 + 150 + 9*90 + 600));
}
function endIntro(){
  if (!INTRO) return; INTRO.t.forEach(clearTimeout); INTRO = null;
  document.body.classList.remove('intro');
  ['fade','door'].forEach(id=>{ const e = document.getElementById(id); if (e) e.remove(); });
  document.querySelectorAll('.introcard,.introhand').forEach(e=>{ e.classList.remove('introcard','introhand'); e.style.animationDelay = ''; });
  if (S) render();
}
// 연출 중 클릭·키 입력 = 연출 건너뛰기
['click','keydown','contextmenu','touchstart'].forEach(ev=>document.addEventListener(ev, e=>{
  if (!INTRO || !S) return;
  if (e.type==='keydown' && /^F(9|10|11|12)$/.test(e.key)) return;
  e.stopPropagation(); if (e.cancelable) e.preventDefault(); endIntro();
}, true));

// 옛 게임식 화면 전환: 가로 띠가 계단처럼 닫혔다가 열린다
var WIPING = false;
function wipeTo(fn){
  if (WIPING) return; sfx('confirm'); if (window.__noFx){ fn(); return; }
  WIPING = true; const w = document.createElement('div'); w.id = 'wipe'; w.innerHTML = '<i></i>'.repeat(8); document.body.appendChild(w);
  setTimeout(()=>{ fn(); w.classList.add('open'); }, 380);
  setTimeout(()=>{ w.remove(); WIPING = false; }, 800);
}
function pickGo(i){   // 선택 화면: 한 마리씩 좌우로 넘기기
  const n = DATA.seekers.length, c = SETUP.cur||0; i = (i+n)%n; if (i===c) return;
  const fwd = (i===c+1) || (c===n-1 && i===0) || (i>c && !(c===0 && i===n-1));
  SETUP.slide = fwd ? 'slideL' : 'slideR'; SETUP.cur = i; sfx('select'); render();
}
function togglePickSeeker(id){
  if (!isUnlocked(id)){ sfx('fail'); toast(`아직 잠겨 있습니다. ${(UNLOCK_RULES[id]||{}).text||''}`); return; }
  const k = SETUP.sel.indexOf(id);
  if (k>=0){ SETUP.sel.splice(k,1); sfx('cancel'); } else if (SETUP.sel.length<4){ SETUP.sel.push(id); sfx('confirm'); } else { sfx('fail'); toast('최대 4마리까지 선택할 수 있습니다.'); }
  render();
}
function onSlotClick(k){

    if (SETUP.screen==='opening'){ e.preventDefault(); if (k==='Escape') opEnd(); else if (k==='Enter' || k===' ' || GB==='OK') opNext(); return; }
    if (SETUP.screen!=='pick'){ if (k==='Enter' || GB==='OK'){ e.preventDefault(); goFromTitle(); } else if (k==='o' || k==='O'){ e.preventDefault(); opToggle(); } return; }
    if (k==='Enter' && SETUP.sel.length){ e.preventDefault(); startGame(); }

    return;
  }
  if (over()){
    if (k==='Escape'){ e.preventDefault(); S.hideOver = true; render(); }
    else if (k==='Enter'){ e.preventDefault(); S = null; render(); }
    return;
  }
  if (S.busy) return;
  if (k==='Escape'){ e.preventDefault(); goBack(); return; }
  if (k==='Enter'){ e.preventDefault(); primary(); return; }
  if (k===' '){ e.preventDefault(); primary(); return; }
  if (/^F[1-4]$/.test(k)){ onSlotClick(+k[1]-1); return; }
  if (k==='F5'){ onSlotClick('m'); return; }
  if (/^[1-9]$/.test(k)){ handKey(+k-1); return; }
  if (k==='Tab'){ e.preventDefault(); S.view = (S.view+1) % S.seekers.length; render(); return; }
});

/* =================== 작은 화면(휴대폰 가로) 맞춤 · 터치 조작 =================== */
// 화면이 작으면 PC 배치(가상 화면)를 그대로 그린 뒤 비율대로 줄여서 보여 준다. 창(모달)·크게 보기는 실제 크기로 뜬다.
const VIRT_H = 740, VIRT_MINW = 1280;
/* 세로 화면(터치 기기 또는 작은 창): 화면 전체를 90° 돌려 가로 배치로 보여 준다.
   미디어 쿼리의 width·height와 vw·vh 단위도 함께 맞바꾼다. */
let MQ = null;
function swapMedia(on){
  if (!MQ){ MQ = []; for (const sh of document.styleSheets){ let rs; try { rs = sh.cssRules; } catch(e){ continue; } for (const r of rs) if (r.media && r.conditionText!==undefined) MQ.push([r, r.media.mediaText]); } }
  MQ.forEach(([r, t])=>{ const v = on ? t.replace(/(min|max)-(width|height)/g, (x,a,b)=>a+'-'+(b==='width'?'height':'width')) : t; if (r.media.mediaText!==v) r.media.mediaText = v; });
}
var FIT_STAB = {w:0, h:0};
function fitScreen(){
  const app = document.getElementById('app'); if (!app) return;
  const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  const W = window.innerWidth, bs = document.body.style, rs = document.documentElement.style; let H = window.innerHeight;
  // 휴대폰: 아래 내비게이션 바나 키보드가 잠깐 올라와 높이만 줄어들면 화면을 다시 맞추지 않고 그대로 둔다(가려질 뿐 밀리지 않게)
  if (coarse){ if (W===FIT_STAB.w && H < FIT_STAB.h) H = FIT_STAB.h; FIT_STAB.w = W; FIT_STAB.h = H; }
  const rot = H > W && (coarse || W < 1000);
  document.body.classList.toggle('touch', !!coarse);
  document.body.classList.toggle('rot', rot);
  swapMedia(rot);
  if (rot){ bs.position='fixed'; bs.left=bs.top='0'; bs.width=H+'px'; bs.height=W+'px'; bs.transformOrigin='0 0'; bs.transform=`translate(${W}px,0) rotate(90deg)`;
    rs.setProperty('--vw', (H/100)+'px'); rs.setProperty('--vh', (W/100)+'px'); }
  else { bs.position=bs.left=bs.top=bs.width=bs.height=bs.transformOrigin=bs.transform=''; rs.removeProperty('--vw'); rs.removeProperty('--vh'); }
  const w = rot ? H : W, h = rot ? W : H;   // 돌린 뒤의 가로·세로
  const small = h < 600 || w < 1000;
  document.body.classList.remove('portrait');
  if (!small){
    document.body.classList.remove('scaled'); window.__VH = 0;
    app.style.width = app.style.height = app.style.transform = app.style.marginLeft = '';
    return;
  }
  const vw = Math.max(VIRT_MINW, Math.round(VIRT_H * w / h));
  const sc = Math.min(w / vw, h / VIRT_H);
  window.__VH = VIRT_H;
  document.body.classList.add('scaled');
  app.style.width = vw + 'px'; app.style.height = VIRT_H + 'px';
  app.style.transform = `scale(${sc})`;
  app.style.marginLeft = Math.max(0, (w - vw*sc)/2) + 'px';
}

// 말풍선이 떠 있는 동안은 게임 조작·자동 진행을 막는다 (「확인」 또는 Enter·Z·Space로 넘김)
function tutBlocking(){ const el = document.getElementById('tut'); return !!(TUT.cur && el && el.style.display!=='none'); }
function tutConfirm(){ sfx('select'); if (TUT.cur) tutMark(TUT.cur); TUT.cur = null; tutCheck(); if (S) render(); }
function tutBlock(on){
  let b = document.getElementById('tutblk');
  if (!on){ if (b) b.remove(); return; }
  if (b) return;
  b = document.createElement('div'); b.id = 'tutblk'; document.body.appendChild(b);
  ['click','dblclick','mousedown','mouseup','touchstart','touchend','contextmenu','mouseover','wheel'].forEach(ev=>b.addEventListener(ev, e=>{ e.stopPropagation(); if (ev!=='touchstart' && ev!=='wheel') e.preventDefault(); }));
}
document.addEventListener('keydown', e=>{
  if (!tutBlocking() || e.target.closest && e.target.closest('input,textarea')) return;
  e.preventDefault(); e.stopPropagation();
  if (!e.repeat && (e.key==='Enter' || e.key===' ' || e.key==='z' || e.key==='Z')) tutConfirm();
}, true);
function tutAfter(s){ return s.turnNo>=2 || s.T.acted; }   // 첫 행동 뒤부터 계속 참: 「확인」으로만 넘어간다
function tutStart(s){ return !s.A && s.selSlot==null && !s.T.acted && s.phase!=='final'; }
var TUT = {cur:null};
function tutOn(){ try { return localStorage.getItem('pmd_tut')!=='0'; } catch(e){ return true; } }
function tutSeen(){ try { return JSON.parse(localStorage.getItem('pmd_tut_seen')||'[]'); } catch(e){ return []; } }
function tutMark(id){ const a = tutSeen(); if (!a.includes(id)){ a.push(id); try { localStorage.setItem('pmd_tut_seen', JSON.stringify(a)); } catch(e){} }
  if (TUT_TIPS.every(t=>a.includes(t.id))){ try { localStorage.setItem('pmd_tut', '0'); } catch(e){} } }   // 다 보면 자동으로 꺼짐 (마지막 설명에 안내 포함)
function tutToggle(){ const on = !tutOn(); try { localStorage.setItem('pmd_tut', on?'1':'0'); if (on) localStorage.removeItem('pmd_tut_seen'); } catch(e){} sfx('select'); toast(on ? '튜토리얼을 켰습니다. 혼자 하기에서 처음부터 안내합니다.' : '튜토리얼을 껐습니다.'); tutHide(); render(); }
function tutHide(){ TUT.cur = null; const el = document.getElementById('tut'); if (el) el.remove(); tutBlock(false); document.querySelectorAll('.tuthl').forEach(e=>e.classList.remove('tuthl')); }
function tutOffTop(el){ let y = 0; while (el && el.id!=='app'){ y += el.offsetTop || 0; el = el.offsetParent; } return y; }
function tutCheck(){
  const ok = S && !NET.on && !window.__noFx && tutOn() && !INTRO && !over() && !MENUOPEN && !topModal() && !(typeof zoomOpen==='function' && zoomOpen());
  if (!ok){ if (document.getElementById('tut')) document.getElementById('tut').style.display = 'none'; tutBlock(false); document.querySelectorAll('.tuthl').forEach(e=>e.classList.remove('tuthl')); return; }
  let tip = TUT.cur && TUT_TIPS.find(t=>t.id===TUT.cur);
  if (tip && !tip.c(S)){ tutMark(tip.id); tip = null; TUT.cur = null; }   // 상황이 넘어가면 본 것으로 친다
  if (!tip){ const seen = tutSeen(); tip = TUT_TIPS.find(t=>!seen.includes(t.id) && t.c(S) && document.querySelector(t.tg)); if (!tip){ tutHide(); return; } TUT.cur = tip.id; }
  const tg = document.querySelector(tip.tg);
  document.querySelectorAll('.tuthl').forEach(e=>{ if (e!==tg) e.classList.remove('tuthl'); }); if (tg) tg.classList.add('tuthl');
  let el = document.getElementById('tut');
  if (!el){ el = document.createElement('div'); el.id = 'tut'; document.body.appendChild(el);
    el.addEventListener('click', e=>{ e.stopPropagation(); const b = e.target.closest('[data-tut]'); if (!b) return;
      if (b.dataset.tut==='ok') tutConfirm();
      else if (b.dataset.tut==='off'){ tutToggle(); } }, true);
    ['mousedown','touchstart','touchend','contextmenu'].forEach(ev=>el.addEventListener(ev, e=>e.stopPropagation())); }
  el.style.display = ''; tutBlock(true);
  const n = TUT_TIPS.findIndex(t=>t.id===tip.id) + 1;
  if (el.dataset.id!==tip.id){ el.dataset.id = tip.id; el.innerHTML = pxui(`<div class="tuthd">튜토리얼 ${n}/${TUT_TIPS.length}</div><div class="tutb">${tip.t}</div><div class="tutbt"><button data-tut="off">튜토리얼 끄기</button><button class="primary" data-tut="ok">확인</button></div>`); }
  const app = document.getElementById('app'), H = app ? app.offsetHeight : 740, y = tg ? tutOffTop(tg) + tg.offsetHeight/2 : 0;
  el.classList.toggle('btm', tip.at==='btm'); el.classList.toggle('low', !tip.at && y < H*0.5);   // 대상이 위쪽이면 말풍선은 아래쪽 (주사위 창은 맨 아래)
}

/* ---------- UI 테마 (기본 + 1~4) ---------- */
// 원래 화면(기본)은 그대로 두고, 고르면 body.th1~th4 클래스로 창틀·버튼·말풍선·배경을 도트 창 스타일로 바꾼다 (theme/gen_pkm.py)
const THEMES = ['기본', '남색 돌', '몬스터볼', '초록 풀', '갈색 나무', '피카츄', '이상해씨', '꼬부기', '파이리', '이브이', '푸린'];
function themeIdx(){ let v = ''; try { v = localStorage.getItem('pmd_theme') || ''; } catch(e){} if (v==='pkm') v = '1'; const n = +v; return n>0 && n<THEMES.length ? n : 0; }
function themeName(){ return THEMES[themeIdx()]; }
function pkmApply(){ const n = themeIdx(); for (let k=1;k<THEMES.length;k++) document.body.classList.toggle('th'+k, k===n); }
function pkmSet(n){ try { localStorage.setItem('pmd_theme', String(n)); } catch(e){} pkmApply(); sfx('select'); render(); }

function pkmToggle(){ const n = (themeIdx() + 1) % THEMES.length; try { localStorage.setItem('pmd_theme', String(n)); } catch(e){} pkmApply(); sfx('select'); toast('UI 테마: ' + THEMES[n]); render(); }

/* ---------------- 탐험 기록 · 업적 · 탐험대 암호 (1.12.0.0) ----------------
   기록은 이 기기의 브라우저에 저장(pmd_prof). 탐험대 암호 = 요약 기록(횟수·보스·탐험대원·업적·해금)을 짧은 글자로 바꾼 것.
   판별 상세 기록(recent)은 암호에 넣지 않음. 보스·탐험대원·업적·해금은 DATA 순서대로 넣으므로 새 항목은 맨 뒤에만 추가. */
const PROF_KEY = 'pmd_prof', UNLOCKS = ['riolu'];   // UNLOCKS: 해금 항목 (암호의 비트 순서. 맨 뒤에만 추가)
const UNLOCK_RULES = {riolu:{cond:'wins>=1', text:'던전 보스를 1번 쓰러뜨리면 해금'}};   // 해금 조건 (조건 코드는 업적과 같음)
function isUnlocked(id){ const d = DATA.seekers.find(x=>x.id===id); return !!d && (!d.hidden || !!PROF.unlock[id]); }
function unlockCheck(){ const got = []; UNLOCKS.forEach(k=>{ const r = UNLOCK_RULES[k]; if (r && !PROF.unlock[k] && achEval(r.cond, null)){ PROF.unlock[k] = Date.now(); got.push(k); } }); return got; }
// 업적·해금 알림: 오른쪽 아래에서 올라왔다가 잠시 뒤 내려감 (여러 개면 차례로 쌓임)
function achPop(kind, name, desc){
  let box = document.getElementById('achpop'); if (!box){ box = document.createElement('div'); box.id = 'achpop'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'apop';
  el.innerHTML = `<i>${kind==='unlock'?'🔓':'🏅'}</i><div><small>${kind==='unlock'?'새 탐험대원 해금':'업적 달성'}</small><b>${esc(name)}</b><span>${esc(desc)}</span></div>`;
  box.appendChild(el); try { sfx('complete'); } catch(e){}
  setTimeout(()=>el.classList.add('out'), 5200); setTimeout(()=>el.remove(), 5800);
}
function achNotify(got, unl){ let k = 0;
  got.forEach(a=>setTimeout(()=>achPop('ach', a.name, a.desc), 1200 + 700*k++));
  unl.forEach(id=>{ const d = DATA.seekers.find(x=>x.id===id); setTimeout(()=>achPop('unlock', d ? d.name : id, '탐험대원 선택 화면에서 고를 수 있습니다'), 1200 + 700*k++); });
  if (got.length || unl.length) setTimeout(()=>achPop('ach', '탐험대 암호를 저장해 두세요', '시작 화면 「기록」에서 복사할 수 있습니다'), 1200 + 700*k);
}
const PROF_NUM = ['games','wins','solo_wins','multi_wins','hard_wins','quick_wins','best_turns'];
function profNew(){ return {v:1, games:0, wins:0, solo_wins:0, multi_wins:0, hard_wins:0, quick_wins:0, best_turns:0, boss:{}, seeker:{}, ach:{}, unlock:{}, recent:[], gids:[]}; }
function profLoad(){ try { const p = JSON.parse(localStorage.getItem(PROF_KEY)||'null'); return p && p.v ? Object.assign(profNew(), p) : profNew(); } catch(e){ return profNew(); } }
function profSave(){ try { localStorage.setItem(PROF_KEY, JSON.stringify(PROF)); } catch(e){} }
var PROF = profLoad();
// 판이 끝나면 한 번 기록 (게임마다 고유 번호 gid로 중복 방지: 방장 이어하기·참가자 화면 갱신에도 한 번만)
function profRecord(){
  if (!S || !over() || !S.gid || PROF.gids.includes(S.gid)) return;
  PROF.gids = PROF.gids.concat(S.gid).slice(-10);
  const won = S.phase==='won', multi = !!(NET.on && S.net), hard = S.hpStart===CFG.hpHard, quick = !!S.quick;
  const mine = multi ? S.net.owner.map((p,i)=>p===NET.pid?i:-1).filter(i=>i>=0) : S.seekers.map(s=>s.i);
  const run = {t:Date.now(), w:won?1:0, boss:S.master.def.code, hard:hard?1:0, quick:quick?1:0, multi:multi?1:0, team:S.seekers.map(s=>s.def.id), mine:mine.map(i=>S.seekers[i].def.id), turns:S.turnNo, hp:Math.max(0, S.hp)};
  PROF.games++;
  if (won){
    PROF.wins++; if (multi) PROF.multi_wins++; else PROF.solo_wins++; if (hard) PROF.hard_wins++; if (quick) PROF.quick_wins++;
    PROF.best_turns = PROF.best_turns ? Math.min(PROF.best_turns, run.turns) : run.turns;
    PROF.boss[run.boss] = (PROF.boss[run.boss]||0) + 1; run.mine.forEach(id=>{ PROF.seeker[id] = (PROF.seeker[id]||0) + 1; });
  }
  PROF.recent = [run].concat(PROF.recent).slice(0, 20);
  const got = achCheck(run), unl = unlockCheck(); profSave();
  achNotify(got, unl);
}
function achVal(k, run){
  const [b, arg] = k.split(':');
  if (PROF_NUM.includes(b)) return b==='best_turns' ? (PROF.best_turns || 9999) : (PROF[b]||0);
  if (b==='boss_kinds') return Object.values(PROF.boss).filter(n=>n>0).length;
  if (b==='seeker_kinds') return Object.values(PROF.seeker).filter(n=>n>0).length;
  if (b==='boss_wins') return PROF.boss[arg]||0;
  if (b==='seeker_wins') return PROF.seeker[arg]||0;
  if (!run) return null;   // 이번 판 키는 판이 끝날 때만 판정
  return {run_win:run.w, run_hp:run.hp, run_turns:run.turns, run_team:run.team.length, run_solo:run.multi?0:1, run_hard:run.hard, run_quick:run.quick,
    run_boss:run.boss===arg?1:0, run_seeker:run.mine.includes(arg)?1:0}[b] ?? null;
}
function achEval(cond, run){
  const parts = String(cond||'').split('&').map(x=>x.trim()).filter(Boolean); if (!parts.length) return false;
  return parts.every(p=>{ const m = p.match(/^([a-z_]+(?::[A-Za-z0-9_-]+)?)\s*(>=|<=|=|>|<)\s*(\d+)$/); if (!m) return false;
    const v = achVal(m[1], run); if (v==null) return false; const n = +m[3];
    return m[2]==='>=' ? v>=n : m[2]==='<=' ? v<=n : m[2]==='>' ? v>n : m[2]==='<' ? v<n : v===n; });
}
function achCheck(run){ const got = []; (DATA.achievements||[]).forEach(a=>{ if (!PROF.ach[a.code] && achEval(a.cond, run)){ PROF.ach[a.code] = Date.now(); got.push(a); } }); return got; }

// 탐험대 암호: 버전·숫자(가변 길이)·보스·탐험대원·업적 비트·해금 비트·검사 글자 → 32글자(O·0·I·1 제외)로 4글자씩 묶음
const RCODE = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function crc8(b){ let c = 0; for (const x of b){ c ^= x; for (let i=0;i<8;i++) c = c & 0x80 ? ((c<<1) ^ 0x07) & 0xff : (c<<1) & 0xff; } return c; }
function profCode(){
  const B = [1], vi = n=>{ n = Math.max(0, Math.min(n|0, 1e7)); while (n >= 128){ B.push((n & 127) | 128); n >>>= 7; } B.push(n); };
  PROF_NUM.forEach(k=>vi(PROF[k]||0));
  const bo = DATA.masters.map(m=>m.code), so = DATA.seekers.map(s=>s.id);
  vi(bo.length); bo.forEach(c=>vi(PROF.boss[c]||0)); vi(so.length); so.forEach(i=>vi(PROF.seeker[i]||0));
  const bits = (list, obj)=>{ vi(list.length); for (let i=0;i<list.length;i+=8){ let x = 0; for (let j=0;j<8 && i+j<list.length;j++) if (obj[list[i+j]]) x |= 1<<j; B.push(x); } };
  bits((DATA.achievements||[]).map(a=>a.code), PROF.ach); bits(UNLOCKS, PROF.unlock);
  B.push(crc8(B));
  let acc = 0, n = 0, out = '';
  for (const x of B){ acc = (acc<<8) | x; n += 8; while (n >= 5){ out += RCODE[(acc >> (n-5)) & 31]; n -= 5; } acc &= (1<<n) - 1; }
  if (n) out += RCODE[(acc << (5-n)) & 31];
  return out.match(/.{1,4}/g).join('-');
}
function profDecode(str){
  const s = String(str||'').toUpperCase().replace(/[\s-]/g,''); if (!s) return null;
  const B = []; let acc = 0, n = 0;
  for (const ch of s){ const v = RCODE.indexOf(ch); if (v<0) return null; acc = (acc<<5) | v; n += 5; if (n >= 8){ B.push((acc >> (n-8)) & 255); n -= 8; acc &= (1<<n) - 1; } }
  if (B.length < 3) return null; const crc = B.pop(); if (crc8(B)!==crc || B[0]!==1) return null;
  let p = 1; const vi = ()=>{ let r = 0, sh = 0, b; do { if (p >= B.length) throw 0; b = B[p++]; r += (b & 127) * 2**sh; sh += 7; } while (b & 128); return r; };
  try {
    const o = profNew(); PROF_NUM.forEach(k=>o[k] = vi());
    const bo = DATA.masters.map(m=>m.code), so = DATA.seekers.map(x=>x.id);
    { const nb = vi(); for (let i=0;i<nb;i++){ const v = vi(); if (bo[i] && v) o.boss[bo[i]] = v; } }
    { const ns = vi(); for (let i=0;i<ns;i++){ const v = vi(); if (so[i] && v) o.seeker[so[i]] = v; } }
    const rb = (list, obj)=>{ const m = vi(); for (let i=0;i<m;i+=8){ if (p >= B.length) throw 0; const x = B[p++]; for (let j=0;j<8 && i+j<m;j++) if ((x>>j) & 1 && list[i+j]) obj[list[i+j]] = 1; } };
    rb((DATA.achievements||[]).map(a=>a.code), o.ach); rb(UNLOCKS, o.unlock);
    return o;
  } catch(e){ return null; }
}
function profMerge(o){   // 불러온 암호와 지금 기록을 합쳐 큰 값을 남김 (기록이 줄어들지 않음)
  ['games','wins','solo_wins','multi_wins','hard_wins','quick_wins'].forEach(k=>{ PROF[k] = Math.max(PROF[k]||0, o[k]||0); });
  if (o.best_turns) PROF.best_turns = PROF.best_turns ? Math.min(PROF.best_turns, o.best_turns) : o.best_turns;
  ['boss','seeker'].forEach(g=>Object.keys(o[g]).forEach(k=>{ PROF[g][k] = Math.max(PROF[g][k]||0, o[g][k]); }));
  ['ach','unlock'].forEach(g=>Object.keys(o[g]).forEach(k=>{ if (!PROF[g][k]) PROF[g][k] = Date.now(); }));
  achCheck(null); unlockCheck(); profSave();
}
function recHTML(){
  const P = PROF, pct = P.games ? Math.round(P.wins/P.games*100) : 0, A = DATA.achievements||[], nA = A.filter(a=>P.ach[a.code]).length;
  const row = (k, v)=>`<tr><td>${k}</td><td><b>${v}</b></td></tr>`;
  const bossName = c=>{ const m = DATA.masters.find(x=>x.code===c); return m ? m.name : c; };
  const seekName = id=>{ const d = DATA.seekers.find(x=>x.id===id); return d ? d.name : id; };
  const dt = t=>{ const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  return `<div class="rec">
    <div class="rgrid">
      <table class="rt"><tr><th colspan="2">전체</th></tr>${row('끝까지 마친 판', P.games)}${row('승리', `${P.wins} <small>(${pct}%)</small>`)}${row('혼자 / 함께 승리', `${P.solo_wins} / ${P.multi_wins}`)}${row('어려움 승리', P.hard_wins)}${row('빠른 게임 승리', P.quick_wins)}${row('가장 빠른 승리', P.best_turns ? P.best_turns+'번째 차례' : '-')}</table>
      <table class="rt"><tr><th colspan="2">보스별 승리</th></tr>${DATA.masters.map(m=>row(esc(m.name), P.boss[m.code]||0)).join('')}</table>
      <table class="rt"><tr><th colspan="2">탐험대원별 승리</th></tr>${DATA.seekers.filter(d=>isUnlocked(d.id)).map(d=>row(esc(d.name), P.seeker[d.id]||0)).join('')}</table>
    </div>
    <h4>업적 <small>${nA}/${A.length}</small></h4>
    <div class="achl">${A.map(a=>`<div class="ach ${P.ach[a.code]?'on':''}"><b>${P.ach[a.code]?'🏅':'🔒'} ${esc(a.name)}</b><span>${esc(a.desc)}</span></div>`).join('')}</div>
    <h4>최근 탐험 <small>이 기기에만 저장</small></h4>
    ${P.recent.length ? `<div class="rwrap"><table class="rt rr"><tr><th>날짜</th><th>결과</th><th>보스</th><th>탐험대</th><th>차례</th><th>HP</th><th>방식</th></tr>${P.recent.slice(0,10).map(r=>`<tr><td>${dt(r.t)}</td><td class="${r.w?'w':'l'}">${r.w?'승리':'패배'}</td><td>${esc(bossName(r.boss))}</td><td>${r.team.map(i=>esc(seekName(i))).join(', ')}</td><td>${r.turns}</td><td>${r.hp}</td><td>${r.multi?'함께':'혼자'}${r.hard?' · 어려움':''}${r.quick?' · 빠른':''}</td></tr>`).join('')}</table></div>` : '<p class="muted">아직 끝까지 마친 탐험이 없습니다.</p>'}
    <h4>탐험대 암호</h4>
    <p class="muted">기록(업적·해금 포함)을 글자로 바꾼 것입니다. 메모나 카카오톡 나와의 채팅에 저장해 두면, 기록이 지워지거나 다른 기기에서 할 때 그대로 불러올 수 있습니다.</p>
    <div class="rcode"><code>${profCode()}</code><button data-rec="copy">복사</button></div>
    <div class="rin"><input id="recIn" placeholder="암호를 붙여 넣으세요" autocomplete="off" spellcheck="false"><button data-rec="load">불러오기</button></div>
    <p class="rmsg"></p>
  </div>`;
}
function showRecords(){ sfx('select'); (window.MODAL0||modal)({title:'📜 탐험 기록', html:recHTML(), wide:true, closeX:true, buttons:[{label:'닫기',primary:true}]}); }
document.addEventListener('keydown', e=>{ if (e.key==='Enter' && e.target && e.target.id==='recIn'){ e.preventDefault(); e.stopPropagation(); const b = e.target.closest('.rec').querySelector('[data-rec=load]'); if (b) b.click(); } }, true);
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-rec]'); if (!b) return;
  const box = b.closest('.rec'), msg = t=>{ const m = box && box.querySelector('.rmsg'); if (m) m.textContent = t; };
  if (b.dataset.rec==='copy'){
    const t = box.querySelector('.rcode code').textContent;
    const fb = ()=>{ const r = document.createRange(); r.selectNodeContents(box.querySelector('.rcode code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg('자동 복사가 안 되어 암호를 선택해 두었습니다. 직접 복사하세요.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>{ sfx('confirm'); msg('복사했습니다. 안전한 곳에 붙여 넣어 두세요.'); }, fb); else fb();
  }
  if (b.dataset.rec==='load'){
    const o = profDecode((box.querySelector('#recIn')||{}).value);
    if (!o){ sfx('cancel'); msg('암호가 올바르지 않습니다. 빠진 글자나 오타가 없는지 확인하세요.'); return; }
    profMerge(o); sfx('confirm'); const nb = document.createElement('div'); nb.innerHTML = pxui(recHTML()); box.replaceWith(nb.firstElementChild);
    const m = document.querySelector('.rec .rmsg'); if (m) m.textContent = '불러왔습니다. 지금 기록과 합쳐서 더 큰 값을 남겼습니다.';
  }
});

netInstall();
</script>
